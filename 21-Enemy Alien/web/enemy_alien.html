 to the Rhine and I'm not going to blow up Notre-Dame. I've finished. I took off my uniform in a toilet in the Gare de l'Est and put it in a bin.\""],[null,"He looks past you into the flat, at Madeleine, at Josette in the kitchen doorway."],[[[["flag","kurt_rejected",false]]],"\"I know you don't want me here,\" he says. \"I know what you said. I'd go somewhere else. I don't know anywhere else.\""],[null,"\"If they catch me in uniform, I'm a prisoner. If they catch me out of it, I'm a deserter, and the French shoot me, or the SS hang me. Either way.\" He holds on to the door frame. \"I don't know what to do. Tell me what to do. You were always the one who knew.\""],[[[["flag","kurt_saved_emil",false]]],"He came to the rue des Saussaies for you with a forged order and a stick. You owe him your hands, your life, everything."]],"choices":[[null,"Hide him. In the coal hole under the workshop, where you hid the Lewins.","kurt_hide",[["set","kurt_hidden"]]],[null,"Tell him to surrender to the FFI at the town hall tomorrow. He'll be a prisoner of war, and safe.","kurt_surrender",[]],[null,"Send him away. You have children. You cannot have a German deserter in your cellar on the day of the liberation.","kurt_away",[["stat","hope","-",1]]]],"gotos":[],"end":false},"kurt_hide":{"chapter":null,"effects":[],"paragraphs":[[null,"You take him down to the workshop and move the drying rack and lift the trapdoor, and he goes down the ladder into the black, with a candle and a blanket and a bottle of water and a loaf."],[null,"\"Like Mother's cellar,\" he says from the dark. \"During the inflation. When the bailiffs came. Do you remember?\""],[null,"You remember. You were eighteen and he was thirteen and you sat in your mother's coal cellar on the Grindelallee all afternoon, the two of you, playing cards by candlelight, while men in bowler hats carried away the piano upstairs."],[null,"You close the trapdoor. You drag the rack across. You go up to the flat and sit down at the kitchen table, and Madeleine looks at you, and you both know what will happen if anyone finds a German in the cellar this week, in this city, with the barricades up and the dead in the streets."]],"choices":[],"gotos":[[null,"barricade"]],"end":false},"kurt_surrender":{"chapter":null,"effects":[["set","kurt_surrendered"]],"paragraphs":[[null,"\"Go to the town hall in the morning,\" you say. \"Tell them who you are. They're taking prisoners. There's a convention, Kurt. Geneva. They have to treat you properly. You'll be in a camp for a year and then you'll go home to Hilde and Peter.\""],[null,"He nods slowly. \"Yes,\" he says. \"Yes. A prisoner. That's the right way. That's correct.\" He almost smiles. \"I've always liked to do things correctly.\""],[null,"You let him sleep on the kitchen floor. In the morning he shaves with your razor, and washes his face, and puts on his ill-fitting suit, and you walk with him to the town hall of the eleventh arrondissement on the place Léon-Blum, where the FFI have their headquarters. There are crowds. There are men with armbands and rifles. There is a tricolour as big as a house on the front of the building."],[null,"At the door, he turns and holds out his hand, very formally, as if you are business acquaintances."],[null,"\"Thank you, Emil.\""],[null,"He goes in."]],"choices":[],"gotos":[[null,"barricade"]],"end":false},"kurt_away":{"chapter":null,"effects":[["set","kurt_sent_away"]],"paragraphs":[[null,"\"I can't, Kurt. Not here. Not with the children. If they find you here, they'll kill all of us. You have to go.\""],[null,"He looks at you. Then he nods, slowly, as if this is what he expected all along."],[null,"\"Yes,\" he says. \"You're right. Of course. You're right.\" He picks up his bag. \"I'll try to get to the Bois de Boulogne. There'll be units there, still. I'll find somebody.\""],[null,"He goes down the stairs. At the bottom he stops, and looks up, the way Rivka did in July 1942, and you think he's going to say something. Then he goes."]],"choices":[],"gotos":[[null,"barricade"]],"end":false},"barricade":{"chapter":"The Barricade","effects":[],"paragraphs":[[null,"For five days, Paris fights."],[null,"You cannot fight. Your right hand still won't close. But there is plenty to do with one hand. You carry paving stones to the barricade at the end of the street with your left arm, one at a time, and Josette carries them with you, two hands, staggering, until Madeleine sees and drags her home. You help Ferrand fill wine bottles with petrol from a stolen German lorry, and stuff rags into their necks. Madeleine nurses in a first-aid post in the basement of the school on the rue Keller: a boy of fifteen with his arm off at the elbow, a German soldier with a stomach wound whom nobody wants to treat, whom she treats."],[[[["flag","pujol_hostile",true]]],"Madame Pujol makes soup for the barricade, in a vast pot on a fire in the courtyard. She makes it out of everything: the last potatoes, the last swedes, a cabbage, and a ham bone she has been hiding since 1941. She ladles it out to the FFI boys with a face like thunder. \"Eat,\" she says. \"Eat, you idiots, you'll get yourselves killed on an empty stomach.\""],[[[["flag","pujol_hostile",false]]],"Madame Pujol stays in her lodge with the door shut. She has a portrait of Marshal Pétain on her wall which she has had since 1940. On the twenty-first, the FFI boys from the barricade come in and take it down and smash it on the cobbles, while she watches through the window."],[null,"On the twenty-second a German tank comes down the boulevard Voltaire and fires into the barricade at the corner of the rue de la Roquette. Ferrand is killed. He is in his chair with his stick, directing the boys, and the shell lands ten metres in front of him, and then he is gone, and the chair is gone, and there is just his stick lying in the road. You carry him to the café with three FFI boys, and lay him on the zinc counter where he drank for twenty-five years, and the patron covers him with a tricolour."],[null,"Late on the evening of the twenty-fourth you hear the bells."]],"choices":[],"gotos":[[null,"bells"]],"end":false},"bells":{"chapter":null,"effects":[],"paragraphs":[[null,"They start at Notre-Dame. The great bell, the bourdon, Emmanuel, which has been silent since 1940. You hear it across the whole city, deep and slow, from the Île de la Cité, and then Saint-Paul joins it, and then Sainte-Marguerite at the end of your street, and then every church in Paris, hundreds of bells, all at once, at half past nine on a summer evening, so loud that the windows rattle."],[null,"The first French tanks of General Leclerc's 2nd Armoured Division have reached the Hôtel de Ville."],[null,"Everybody comes out. The whole building, the whole street, the whole city. Into the courtyards, the streets, on to the balconies, everyone crying, everyone singing, strangers kissing each other. Josette is on your shoulders. Madeleine is holding your arm so hard it hurts. Somebody has a bottle of champagne they have been saving since 1939 and it goes round the whole courtyard, one mouthful each."],[[[["flag","pierrot",false]]],"Pierrot is frightened of the bells. He thinks they mean aeroplanes. You hold him on your lap on the steps and tell him what they mean, over and over, until he understands, and then he is laughing, eight years old, laughing with tears on his face."],[[[["flag","parents_safe",false]]],"Isaac Lewin stands in the middle of the courtyard with Rivka, in the dark, with his arms around her, both of them crying. They have not been outside in daylight for two years. Isaac lifts his face up to the bells as if it is raining."],[null,"The next day, the twenty-fifth, the German commander, General von Choltitz, who did not blow up the bridges or Notre-Dame or the Opéra, signs the surrender in the billiard room of the Prefecture of Police, and then again at the Gare Montparnasse."],[null,"On the twenty-sixth, de Gaulle walks down the Champs-Élysées."]],"choices":[],"gotos":[[null,"mob"]],"end":false},"mob":{"chapter":"The Twenty-Sixth of August","effects":[],"paragraphs":[[null,"You go to the Champs-Élysées with Madeleine and Josette, with two million other people. You see de Gaulle, very tall, very far away, walking down the middle of the avenue with his arms raised, with the Arc de Triomphe behind him and the crowd roaring. Then, at the place de la Concorde, there is shooting from the rooftops, Germans or militiamen still holding out, or nobody knows who, and the crowd throws itself flat on the cobbles, and you lie on top of Josette with your arm over her head, again, like June 1940."],[null,"On the way home, at the Bastille, it happens."],[null,"You are tired. You are thirsty. You are happy. You are holding Josette's hand in the crowd and you turn to Madeleine and say something, a joke, about Ferrand, about how he would have hated de Gaulle, and you say it a little too loudly, in your accent, the r from the back of the throat."],[null,"A man next to you, a big man in a vest with an FFI armband and a rifle, turns round."],[null,"\"Boche,\" he says."],[null,"Then he says it louder. \"Boche! There's a Boche here! A Boche!\" And people turn round. A woman. Two boys. A man with a bandage around his head. More."],[null,"You know this crowd. You have seen it in the stadium at Colombes, at the Vel d'Hiv, in the clearing in the Limousin. It is not anybody's crowd. It is just the shape a crowd takes. Somebody hits you on the back of the head. Somebody pulls Josette's hand out of yours. Somebody gets hold of your collar."]],"choices":[],"gotos":[[[[["flag","parents_safe",false]]],"mob_isaac"],[[[["flag","jeannot_maquis",false]],[["flag","resistance",false],["flag","lucien_arrested",true]]],"mob_ffi"],[[[["flag","pujol_hostile",true]]],"mob_pujol"],[null,"mob_madeleine"]],"end":false},"mob_isaac":{"chapter":null,"effects":[["stat","hope","+",2]],"paragraphs":[[null,"A voice behind the crowd, an enormous voice, roaring in Yiddish-accented French: \"Leave him! Leave him alone! LEAVE HIM!\""],[null,"Isaac Lewin, who came to the Bastille to see de Gaulle with Rivka, who has been in a coal cellar and behind a press and inside four walls for two years, pushes through the crowd like a ship through ice, and gets between you and the man with the rifle, and spreads his arms out."],[null,"\"This man hid my family!\" he shouts. \"In his own cellar! From the police! From the Germans! This man is a German, yes, and he's a better Frenchman than you, you, all of you!\" He pulls open his jacket. The yellow star is still sewn on the inside of it, where he moved it in 1942. \"You want to beat somebody? Where were you in July '42? Where were you?\""],[null,"The crowd goes very quiet. The man with the rifle lets go of your collar. Somebody gives Josette back to Madeleine. People turn away, and walk off, and talk about something else, and in a minute it is as if it never happened."],[null,"Isaac is shaking. You hold him up."]],"choices":[],"gotos":[[null,"tondue"]],"end":false},"mob_ffi":{"chapter":null,"effects":[["stat","health","-",1]],"paragraphs":[[null,"A young man in a beret with an FFI armband and a Sten gun on his back shoulders through the crowd, and gets his hand on the big man's rifle, and pulls it down."],[[[["flag","jeannot_maquis",false]]],"It is Jeannot, back from the Limousin with the FFI column that came up to Paris, brown and bearded and terrifying. \"This man's one of ours!\" he shouts. \"This man made our papers! He was in the rue des Saussaies! Look at his hand! Look at his hand, you idiots!\""],[[[["flag","jeannot_maquis",true]]],"It is a boy from Lucien's network, one of the ones who used to collect the papers from the workshop on a bicycle. \"This man's one of ours!\" he shouts. \"This man made our papers! He was in the rue des Saussaies! Look at his hand!\""],[null,"They look at your hand. The two fingers that set crooked."],[null,"The crowd changes its mind as fast as it made it up. Suddenly people are slapping you on the back. A woman kisses you. The big man with the rifle wants to shake your hand, and is offended when you won't, and then you do. You find you have a split lip and a loose tooth."]],"choices":[],"gotos":[[null,"tondue"]],"end":false},"mob_pujol":{"chapter":null,"effects":[["stat","health","-",2]],"paragraphs":[[null,"They have you on the ground. Somebody is kicking you. You have your arms over your head. You can hear Josette screaming."],[null,"Then a voice. An old woman's voice, a voice like a rusty hinge, that you know."],[null,"\"Get off him! Get off him, you animals! Get off!\""],[null,"It is Madame Pujol. She is beating the big man round the head with her handbag. \"I know him! I've known him eleven years! He lives in my building! He's a bookbinder! He hid the Jews! Who are you? I don't know you! Where were you in '42, eh? Hiding under your bed?\""],[null,"You will never understand Madame Pujol."],[null,"The crowd breaks up, embarrassed. The big man walks away rubbing his head. Madame Pujol helps you up, holding your arm in her hard little hand, and brushes the dust off your coat, briskly, as if you were a doormat."],[null,"\"Idiot,\" she says. \"Talking German on the day of the liberation. Idiot.\""]],"choices":[],"gotos":[[null,"tondue"]],"end":false},"mob_madeleine":{"chapter":null,"effects":[["set","in_mob"],["stat","health","-",4]],"paragraphs":[[null,"They have you on the ground. They are kicking you. You have your arms over your head. You can hear Josette screaming, and somebody laughing."],[null,"Then Madeleine is on top of you. She has thrown herself down across you, the way she threw herself on Josette in the ditch on the road south of Étampes in June 1940, and she is screaming at them. \"He's my husband! He's French! He's my husband! He was in their camps! He was tortured by the Gestapo! Look at his hand! Look at his hand! Kill me too then, kill me, go on!\""],[null,"A boot hits her on the shoulder. Then nobody kicks anymore."],[null,"A gendarme comes, eventually, and the crowd breaks up and drifts away to look at something else, and the gendarme helps Madeleine up, and looks down at you, lying on the cobbles of the place de la Bastille with your face in a puddle of your own blood."],[null,"\"Better get him off the street, Madame,\" he says. \"Today's not a good day to be a Boche.\""]],"choices":[],"gotos":[[null,"tondue"]],"end":false},"tondue":{"chapter":"The Shaving","effects":[],"paragraphs":[[null,"On the twenty-eighth there is a crowd in the courtyard of number 64."],[null,"You hear it from the flat, where you are lying on the bed with your ribs strapped. Shouting. Laughter. A woman screaming. You get up and go to the window."],[null,"It is Simone Ribot. Simone from the second floor, whose husband was the reservist who left in September 1939 with his cardboard suitcase and was taken prisoner in June 1940, and has been in a camp in Pomerania for four years. Simone, who was twenty-six in 1940, with two small children and no money, and who, in 1942, began to be visited in the evenings by a German quartermaster sergeant who brought tins of meat and coal and chocolate for the children. The whole building knew. Nobody said anything, for two years. Everybody ate the chocolate."],[null,"They have dragged her out into the courtyard. Six or seven men with FFI armbands, none of whom you have ever seen before. And women. Women from the street, from the queues. They have put her on a chair by the dry fountain, and one of them has a pair of hair clippers, and he is shaving her head, roughly, so that it bleeds, while the others hold her arms, and the crowd jeers. Her hair is falling on the cobbles. Somebody has painted a swastika on her forehead with lipstick. Her children, four and six, are standing at the bottom of the stairs, holding hands, watching."],[null,"This is happening all over France this week. Twenty thousand women. In village squares, in front of town halls, in courtyards. Shaved, stripped, painted, paraded through the streets. Many of the men who do it have never been in the Resistance in their lives."]],"choices":[[null,"Go down. Stop it.","tondue_stop",[["stat","health","-",1],["set","simone_defended"]]],[null,"Stay at the window. You have been beaten enough this week.","tondue_watch",[["stat","hope","-",1]]]],"gotos":[],"end":false},"tondue_stop":{"chapter":null,"effects":[],"paragraphs":[[null,"You go down the stairs in your shirt with your ribs strapped, holding the banister. You walk into the middle of the courtyard. You do not know what you are going to say."],[null,"\"Enough,\" you say. In French. With your accent."],[null,"They turn round. A man with the clippers looks at you and laughs. \"Look at this! The Boche wants to defend his Boche whore!\""],[null,"\"She has two children,\" you say. \"Look at them. Look at them. Her husband is a prisoner. She had nothing. She was feeding them.\" You look round the courtyard, at the faces you know, at the windows. \"We all ate the chocolate. All of us. I saw you eat it, Madame Duval. And you.\""],[[[["flag","pujol_hostile",true]]],"Madame Pujol comes out of her lodge, and walks across the courtyard, and stands next to you, with her arms crossed, saying nothing at all, staring at them."],[[[["flag","parents_safe",false]]],"Then Isaac comes down the stairs, and stands on your other side."],[null,"Nobody says anything for a while. Then the man with the clippers spits on the cobbles, and turns off the clippers, and they go, all of them, still laughing, but less. Half of Simone's head is shaved. She sits on the chair and doesn't move."],[null,"Madeleine comes down and puts a headscarf over her head and takes her up to her flat, and the children follow, still holding hands."],[null,"Simone's husband comes home from Pomerania in May 1945. He has heard everything, of course, by then; people write letters. He goes up the stairs to the second floor, and the door closes, and nobody in the building knows what is said. They stay married. They have another child in 1947. She wears a headscarf until her hair grows back, and after that, for the rest of her life, she wears it short."]],"choices":[],"gotos":[[null,"kurt_fate"]],"end":false},"tondue_watch":{"chapter":null,"effects":[],"paragraphs":[[null,"You stay at the window."],[null,"They finish shaving her. They make her stand up and parade her round the courtyard, and then out into the street, with her children running after her, towards the town hall, where there are other women, and a man with a drum."],[null,"Simone's husband comes home from Pomerania in May 1945. He has heard everything, of course, by then; people write letters. He goes up the stairs to the second floor, and the door closes, and nobody in the building knows what is said. Two months later Simone takes the children and goes to live with her sister in Rouen."],[null,"Her hair is on the cobbles of the courtyard for a week, until it rains."]],"choices":[],"gotos":[[null,"kurt_fate"]],"end":false},"kurt_fate":{"chapter":"Kurt","effects":[],"paragraphs":[],"choices":[],"gotos":[[[[["flag","kurt_hidden",false],["flag","pujol_hostile",false]]],"kurt_found"],[[[["flag","kurt_hidden",false]]],"kurt_prisoner"],[[[["flag","kurt_surrendered",false]]],"kurt_mairie"],[null,"kurt_gone"]],"end":false},"kurt_found":{"chapter":null,"effects":[["stat","hope","-",2],["set","kurt_pow"]],"paragraphs":[[null,"They come for Kurt on the twenty-ninth. Four FFI men with rifles, and Madame Pujol, in her black dress, at the door of the workshop. \"The coal hole,\" she says. \"Under the rack. He thinks I don't know. Eleven years.\""],[null,"They drag him up the ladder. They beat him in the courtyard, in front of everybody, the way they beat you at the Bastille. You try to stop them and somebody hits you with a rifle butt and you go down."],[null,"\"He's my brother!\" you shout from the cobbles. \"He deserted! He took off his uniform! He refused to fight!\""],[null,"\"Then he's a Boche coward instead of a Boche soldier,\" one of them says."],[null,"They take him away in a lorry. You go after him, to the town hall, to the Prefecture, to the American military police, for three days. On the fourth you find him, alive, with a broken arm and his face swollen shut, in a prisoner-of-war cage behind the Gare du Nord, among two thousand German soldiers."],[null,"He has been beaten, but he is alive. He is a prisoner of war. He will be in a camp in France for three years, working in a coal mine in the Nord, and will go home to Hamburg in 1947, to Hilde and Peter, who are living in a single room in a block that survived the firestorm."],[null,"He waves at you through the wire with his good hand."]],"choices":[],"gotos":[[null,"return_1945"]],"end":false},"kurt_prisoner":{"chapter":null,"effects":[["set","kurt_pow"],["stat","hope","+",1]],"paragraphs":[[null,"Kurt stays in the coal hole for nine days. You take him down food at night, and a bucket, and sit with him in the dark and play cards by candlelight, the way you did in your mother's cellar in 1923."],[null,"On the thirtieth, when the shooting has stopped and the American army is passing through Paris on its way east, you walk him out of the courtyard at five in the morning, in his bad suit, and across the city to the Gare de l'Est, where there is an American military police post. You do the talking. In English, which you speak badly. A tall black sergeant from Alabama listens to the whole story, and looks at Kurt for a long time, and then at you, and says, \"OK, buddy. He's a POW. I got him. Nobody's going to hurt him on my watch.\""],[null,"Kurt holds out his hand to you, very formally, the way he would have at the town hall."],[null,"\"Thank you, Emil.\""],[null,"You don't take it. You hold him instead, in the street, in front of the American sergeant, who looks away politely."],[null,"He will be in a prisoner-of-war camp in France for two years, working on a farm in the Beauce, where the farmer's wife will feed him so well he puts on twenty kilos. He will go home to Hamburg in 1946, to Hilde and Peter, who are living in a single room in a block that survived the firestorm."]],"choices":[],"gotos":[[null,"return_1945"]],"end":false},"kurt_mairie":{"chapter":null,"effects":[["stat","hope","-",4],["set","kurt_dead"]],"paragraphs":[[null,"You go to the town hall on the evening of the twenty-first to find out what happened to him."],[null,"Nobody knows. Nobody remembers. A German? There were a lot of Germans. Prisoners were taken to the Prefecture, to the barracks at Reuilly, to the Vel d'Hiv, of all places. A young man with an armband and no idea of anything sends you to a sergeant who sends you to a captain who sends you away."],[null,"You find out on the twenty-third, from a cleaning woman at the town hall who saw it. A German in a civilian suit came in on the morning of the twenty-first with his hands up. A German with a stick. He said he wanted to surrender. He said it in French. He said it correctly. The young men at the door had just come from the barricade at the place de la République, where two of their friends had been killed by a German tank an hour before. They took him into the courtyard at the back."],[null,"\"They didn't even ask him anything,\" the cleaning woman says. \"I'm sorry, Monsieur. He had a photograph in his pocket of a little boy in a sailor suit. I kept it. I didn't know who to give it to.\""],[null,"She gives you the photograph. A fat little boy on a beach at Travemünde."],[null,"You told him there was a convention. You told him Geneva. You told him he would be safe."]],"choices":[],"gotos":[[null,"return_1945"]],"end":false},"kurt_gone":{"chapter":null,"effects":[["set","kurt_dead"],["stat","hope","-",2]],"paragraphs":[[null,"You never see Kurt again."],[null,"You find out what happened to him in 1947, in a letter from Hilde, his widow, in Hamburg, who has found your address through the Red Cross. The German army, she writes, has informed her that Obergefreiter Kurt Brandt was killed in action in Paris, near the École Militaire, on the twenty-fifth of August 1944, in the fighting against the French 2nd Armoured Division. He is buried in the German military cemetery at Champigny-Saint-André, in the Eure."],[null,"He must have found a unit, after all. In the Bois de Boulogne, or somewhere. He must have put on someone else's uniform. He must have picked up a rifle."],[null,"Hilde writes that she has a photograph of you, from 1932, two brothers in front of the Michel church in Hamburg, in their Sunday suits, and that she will send it, and does, and that Peter, who is eight now, asks about his uncle in Paris. She writes that she hopes you are well. She writes, at the end, that she wore the fur coat Kurt sent her from Kiev every winter until 1945, when she sold it to a Russian officer for a sack of potatoes."]],"choices":[],"gotos":[[null,"return_1945"]],"end":false},"return_1945":{"chapter":"Part Ten — The Lutetia","effects":[],"paragraphs":[[null,"The war does not end when Paris is liberated. It goes on for another eight months, somewhere else, to the east, and Paris is cold and hungry through another winter, the winter of 1944, with no coal again and the bread ration cut again, and the Americans everywhere in the streets with their chewing gum and their cigarettes, which are money now instead of German marks."],[[[["flag","felix_alive",false]]],"In December a letter comes for you, forwarded three times, with American stamps. It is from Felix. He got out. Varian Fry got him a visa in the spring of 1941; he crossed the Pyrenees on foot with his violin on his back, and sailed from Lisbon to New York. He plays in the orchestra of a cinema in Brooklyn, between the newsreel and the feature. He is married, to a girl from Cleveland who plays the harp. \"I owe you a wedding,\" he writes. \"Josette's. I'm still coming. Tell her to choose a husband who likes Haydn.\" He writes nothing about his mother in Vienna. At the bottom, in a different ink, as if he added it later, he writes: \"Theresienstadt, they think. Then nobody knows.\""],[[[["flag","sarah_safe",false]],[["flag","moise_safe",false]]],"In March, Annette Monod brings the children back from the plateau."],[[[["flag","sarah_safe",false]]],"Sarah is thirteen and a half, and taller than Madeleine, and speaks French with the accent of the Haute-Loire, and has a Protestant hymn book that she reads in bed."],[[[["flag","moise_safe",false]]],"Moïse is five and doesn't remember Paris, or the flat, or the Lewins. He remembers the calf. He asks when he can go back to the calf."],[null,"In April the camps in Germany begin to be opened."],[null,"The photographs come first, in the newspapers, from Buchenwald, from Bergen-Belsen, from Dachau. Nobody believes them. Then they have to."],[null,"Then the trains start to come back, and the lorries, and the aeroplanes, with the deportees. They are brought to the Hotel Lutetia, on the boulevard Raspail, a big Art Nouveau hotel on the left bank that was the headquarters of German military intelligence for four years, and which is now a reception centre. Deportees are registered, deloused, examined, fed, given a little money and a ration card and a bed. Their names are read out over loudspeakers. Their names are posted on lists in the hall."],[null,"And outside the Lutetia, on the boulevard, every day, from morning to night, there is a crowd of people holding up photographs."]],"choices":[],"gotos":[[null,"lutetia"]],"end":false},"lutetia":{"chapter":null,"effects":[],"paragraphs":[[null,"You go every day, in April and May."],[[[["flag","parents_safe",true],["flag","sarah_safe",false]]],"You take Sarah. She insists. She makes a sign herself, from a piece of binder's board from the workshop, with her best handwriting: LEWIN Isaac and Rivka, 64 rue de la Roquette, Paris 11e, taken 16-7-1942, Vel d'Hiv, Pithiviers. YOUR DAUGHTER SARAH IS WAITING. She stands on the pavement of the boulevard Raspail every day after school, holding it up, for six weeks."],[[[["flag","parents_safe",true],["flag","sarah_safe",true]]],"You make a sign yourself, from a piece of binder's board from the workshop: LEWIN Isaac, Rivka, Sarah, Moïse, 64 rue de la Roquette, Paris 11e, taken 16-7-1942. You hold it up on the pavement of the boulevard Raspail, among the others, every day for six weeks, because there is nobody else left to hold it up."],[[[["flag","parents_safe",false]]],"You go because Isaac goes. Isaac is looking for his brother, from Łódź, and his cousin from Montreuil, and the Grinbergs from number 60, and the Kaplans with their canary, and the woman with the baby from across the street, and everybody else."],[[[["flag","lucien_arrested",false]]],"And you go for Lucien, who was taken to Buchenwald in January 1944. You don't know if he is alive."],[null,"The people who come out of the Lutetia do not look like people. They are skeletons, in striped clothes, or in odd clothes from the Red Cross, with their heads shaved and their eyes enormous. They walk very slowly, like old men, even the young ones. Some of them are carried. Some of them come out and stand on the pavement and look at the crowd of photographs and cannot speak. Some of them are recognised, and there is screaming, and people fall into each other's arms on the pavement and the crowd closes round them. Most of them are not."],[null,"The crowd holds up the photographs. Have you seen him? Have you seen her? Auschwitz? Buchenwald? Ravensbrück? Do you know? Did you see?"]],"choices":[],"gotos":[[null,"lutetia_2"]],"end":false},"lutetia_2":{"chapter":null,"effects":[],"paragraphs":[[null,"On the fifth day a woman stops in front of your sign."],[null,"She is perhaps forty, perhaps seventy, there is no way of knowing. She has a headscarf over her shaved head. On her left forearm, below the sleeve of a Red Cross coat, there is a blue number, tattooed."],[null,"She reads the sign. She reads it very slowly, as if reading is something she has to remember how to do."],[null,"\"Pithiviers,\" she says. \"The convoy from Pithiviers. In August 1942.\" Her French has a Polish accent like Rivka's. \"I was on the convoy of the thirty-first of July. From Pithiviers. With the mothers. They had taken our children from us in the camp. In Auschwitz they made a selection on the platform. Right, left. Young women who could work, to the right. To the camp. Everybody else, to the left. To the showers, they said.\" She looks at the sign. \"Nobody who went to the left came back. They were dead in an hour. The same day. The children who came after, in August, without us, they all went left. All of them. Every child. The same day.\""],[[[["flag","sarah_safe",false]]],"Sarah is standing beside you with the sign. She heard it. You watch her hear it. She doesn't move."],[null,"The woman looks at you. \"I'm sorry,\" she says. \"Somebody should tell you. Nobody tells anybody. You stand here for weeks. I'm sorry. Don't stand here any more.\""],[null,"She walks away down the boulevard Raspail, very slowly."],[[[["flag","parents_safe",true],["flag","sarah_safe",false]]],"Sarah stands there for another hour, with the sign. You do not try to make her go home. Then she puts the sign down on the pavement, very carefully, face up, and takes your hand, and you walk home together, across the river, all the way, without speaking, and she does not cry until you get to the courtyard of number 64. Then she does."],[[[["flag","parents_safe",true],["flag","sarah_safe",true]]],"You put the sign down on the pavement, face up, and leave it there, and walk home."],[[[["flag","parents_safe",false]]],"Isaac stands beside you with his photographs. His brother. His cousin. The Grinbergs. The Kaplans. He looks at them for a long time. Then he puts them back in his pocket, carefully, one by one, and you walk home."],[null,"Of the thirteen thousand people arrested in the Vel d'Hiv roundup, fewer than a hundred come back. Of the four thousand children, none."]],"choices":[],"gotos":[[[[["flag","lucien_arrested",false]]],"lucien_return"],[null,"victory"]],"end":false},"lucien_return":{"chapter":"Lucien","effects":[],"paragraphs":[[null,"Lucien comes back on the twenty-ninth of April."],[null,"You don't recognise him. He recognises you. A skeleton in a striped jacket and an American army greatcoat, with a shaved head and no teeth at the front, comes out of the doors of the Lutetia leaning on a nurse and stops dead on the steps and says \"Emil,\" in a voice like paper tearing, and you look and look and it is Lucien, Lucien who weighed a hundred kilos, who now weighs forty-one."],[null,"Buchenwald. Then a subcamp called Dora, where they built the V2 rockets in tunnels under a mountain, and men died at the rate of a hundred a day. Then a death march in April, west, ahead of the Russians, and an open railway wagon, and the Americans."],[null,"You take him home. Madeleine puts him in your bed. He sleeps for two days. When he wakes up he asks for wine and Madeleine gives him milk and he drinks it and cries."],[null,"On the fourth day, sitting up in the bed with his hands round a bowl of soup, he says, \"I know you were in the rue des Saussaies. Stoltenberg told me. He liked to tell us who'd been in. He said you were very brave.\" He smiles with no front teeth. \"Were you?\""],[null,"You gave them his name. You said it to the floor of a cell. They already had it. They took him two days before. It made no difference. It made all the difference."]],"choices":[[null,"Tell him the truth. You gave them his name.","lucien_confess",[]],[null,"Say nothing. Let him keep it.","lucien_silent",[["set","never_told"]]]],"gotos":[],"end":false},"lucien_confess":{"chapter":null,"effects":[["stat","hope","+",2]],"paragraphs":[[null,"You tell him. All of it. The bath. The third day. Stoltenberg saying, You'd only be confirming. You saying it to the floor. The print shop with the paper seal. The dairy woman spitting."],[null,"He listens with the bowl of soup going cold in his hands. When you have finished, he puts the bowl down on the bedside table, very carefully, with both hands, because his hands shake."],[null,"\"Emil,\" he says. \"In Buchenwald, there was a block elder, a German Communist, a comrade, been in the camps since 1933. A hero. He saved hundreds of men. He put their names on the lists for the good work details instead of the transports. And to do that he had to put other names on the transports, to make up the numbers. Every week. He chose. Every week he chose who would die so that someone else could live.\" He looks at you. \"Everybody gave something. Everybody. The only people who didn't give anything are the people who weren't asked.\""],[null,"He holds out his hand. It is a bundle of sticks. You take it."],[null,"\"You stupid Boche,\" he says. \"You confirmed it. I'd already given them my own name, the first day, when they asked me what it was.\""]],"choices":[],"gotos":[[null,"victory"]],"end":false},"lucien_silent":{"chapter":null,"effects":[],"paragraphs":[[null,"You don't tell him."],[null,"\"Not brave,\" you say. \"Stubborn. A binder's thing.\""],[null,"He laughs, and coughs, and the soup spills. You mop it up. He goes back to sleep."],[null,"He lives another nineteen years, and you never tell him. Some years, on his birthday, at the dinner in the café on the rue de Belleville, with his wife and his children and the men from the print shop and the old comrades, he makes a speech, and in the speech, every year, he says that his friend Emil Brandt, the Boche, the best forger in Paris, was the bravest man he knew, because he kept his mouth shut in the rue des Saussaies. Every year you raise your glass."]],"choices":[],"gotos":[[null,"victory"]],"end":false},"victory":{"chapter":"The Eighth of May","effects":[],"paragraphs":[[null,"On the eighth of May 1945, at three o'clock in the afternoon, the bells ring again, all over Paris, and General de Gaulle on the radio says that the war is won."],[null,"There are crowds on the Champs-Élysées again, and on the place de la Concorde, and dancing in every street. There are American soldiers on the roofs of jeeps, kissing girls. There is a man in the rue de la Roquette playing an accordion on a chair in the middle of the street, and everybody in the building comes down to dance in the courtyard, around the dry fountain."],[null,"You do not dance. You sit on the steps of number 64 with your hand that does not close, and you watch."],[[[["flag","sarah_safe",false]]],"Sarah dances with Josette. They're fourteen and twelve. They dance badly, holding each other round the waist, laughing."],[[[["flag","moise_safe",false]]],"Moïse is asleep on your lap, five years old, heavy and warm."],[[[["flag","pierrot",false]]],"Pierrot is on the roof of the workshop, with two other boys, throwing paper planes into the courtyard. He is not frightened of planes any more."],[[[["flag","parents_safe",false]]],"Isaac dances with Rivka. Very slowly, in the middle of the courtyard, to a waltz from the accordion, as if they were twenty years old in Łódź."],[[[["flag","pujol_hostile",true]]],"Madame Pujol dances with nobody. She sits outside her lodge in a chair with a glass of wine. She raises it to you, just slightly, across the courtyard."],[[[["flag","pujol_hostile",false]]],"Madame Pujol does not come out of her lodge. They say she is going to live with a niece in Clermont-Ferrand."],[null,"Madeleine comes and sits beside you on the step and puts her head on your shoulder."],[null,"\"What are you thinking about?\" she says."],[null,"You are thinking about a ravine with birch trees. About a pram in a church. About a girl in a pinafore on the stairs. About a woman in a yellow dress lying in the road with her arms out. About a man in a cardigan from Eimsbüttel with a pot of geraniums. About Lindner on a bench in the sun, taking a little rest. About your brother."],[[[["flag","oradour_promise",false]]],"About a promise you made to an old man on a bicycle, on the wall of a churchyard, to tell them, in Germany, in German."],[null,"\"Nothing,\" you say. \"Everything. I don't know.\""],[null,"\"Me neither,\" says Madeleine. \"Let's just sit.\""],[null,"So you sit."]],"choices":[],"gotos":[[[[["flag","sarah_safe",false]],[["flag","moise_safe",false]],[["flag","parents_safe",false]]],"ending_kept"],[null,"ending_lost"]],"end":false},"ending_kept":{"chapter":"Epilogue — What Was Kept","effects":[],"paragraphs":[],"choices":[],"gotos":[[null,"epilogue"]],"end":false},"ending_lost":{"chapter":"Epilogue — What Was Lost","effects":[],"paragraphs":[],"choices":[],"gotos":[[null,"epilogue"]],"end":false},"epilogue":{"chapter":null,"effects":[],"paragraphs":[[null,"You live a long time. Longer than you expected; longer, some days, than you would have chosen."],[null,"You go back to work. You learn to sew with your left hand, and with the two good fingers of your right. It takes you two years. Your work is never quite as fine again. You do not tell your customers why, and they do not ask. In 1949 you become a French citizen, at last, in a ceremony at the Prefecture of Police, where the clerk who used to sigh at you shakes your hand, and does not sigh."],[[[["flag","oradour_promise",false]]],"In 1955 you keep your promise. You take the train to Hamburg, for the first time in twenty-two years, to a city that is half ruins and half cranes, and you stand in front of a class of sixteen-year-olds at a Gymnasium in Eimsbüttel, and you tell them, in German, about Oradour-sur-Glane. They are very polite. They do not believe you. A boy at the back puts up his hand and says that his father was in the Das Reich division and that it was a battle against partisans. You go back every year until 1970. By the end, they believe you."],[[[["flag","testimony",false]]],"The eleven pages you wrote on the churchyard wall at Oradour are read into the record at the military court in Bordeaux in 1953. A journalist from Le Monde asks you to give them to the Oradour memorial. You do."],[null,"Madeleine teaches at the girls' school on the rue Keller until 1965. She is a headmistress by then. She never wears blue again; she says it reminds her of the blackout paper on the windows. She dies in 1981, in her sleep, with her hand on your chest."],[[[["flag","sarah_safe",true],["flag","moise_safe",true],["flag","parents_safe",true]]],"Josette grows up. She becomes a nurse. She marries a doctor from Lyon and has three daughters. She is kind to you, always. She visits every Sunday. But there is a door in her that stays closed to you, all her life, and you know which morning it closed on. In 2005, when the Wall of Names is unveiled at the Shoah Memorial in the Marais, seventy-six thousand names of the Jews deported from France, she takes her granddaughters to find two of them, Lewin, Sarah, 1931, and Lewin, Moïse, 1939, and they touch the names with their fingers. Then she rings you, and you talk for an hour, for the first time in sixty years, about Sarah."],[[[["flag","sarah_safe",false]],[["flag","moise_safe",false]],[["flag","parents_safe",false]]],"Josette grows up. She becomes a nurse. She marries a doctor from Lyon and has three daughters. She still has the sock rabbit; it is grey and has no eyes and sits on a shelf in her bedroom in Lyon until her death."],[[[["flag","josette_star",false]]],"She still has the paper star as well, in the drawer with the rabbit. Her granddaughter finds it in 2019 and gives it to the Shoah Memorial, where it is in a glass case, with a label: Paper star, made in 1942 by a nine-year-old non-Jewish girl, in solidarity with her friend."],[[[["flag","sarah_safe",false],["flag","parents_safe",true]]],"Sarah Lewin lives with you until she is twenty. Then she goes to the Sorbonne, and becomes a historian, and spends her life on one subject: the arrests of Jews in France, the files, the lists, the police, the convoys. She is the one who finds the convoy numbers for her parents in the archives, in 1978, and brings you the photocopy. In July 1995 she is standing in the crowd in front of the site of the Vélodrome d'Hiver, which was demolished in 1959, when President Jacques Chirac says, for the first time, that France, the French state, committed the irreparable, that it delivered those it was supposed to protect to their executioners. She is sixty-three. She rings you afterwards. She is crying. \"They said it,\" she says. \"Fifty-three years. They finally said it.\" You are ninety. You listen to her cry down the telephone and you do not say anything, and that is right."],[[[["flag","sarah_safe",false],["flag","parents_safe",false]]],"Sarah Lewin becomes a historian. She spends her life on one subject: the arrests of Jews in France, the files, the lists, the police, the convoys. Her parents live to see her made a professor. In July 1995, when President Chirac says for the first time that the French state delivered the Jews of France to their executioners, Isaac is dead, but Rivka is ninety-one, and is in the crowd, in a wheelchair, with Sarah pushing it."],[[[["flag","moise_safe",false],["flag","parents_safe",true]]],"Moïse Lewin goes back to the plateau at Le Chambon every summer of his childhood. In 1957 he emigrates to Israel and becomes an engineer. He has a wooden horse on his desk all his life, although it is not the one his father carved. That one is lost. In 1990 he gets the people of Le Chambon recognised, as a whole village, as Righteous Among the Nations, the honour Israel gives to non-Jews who risked their lives to save Jews. He also puts forward two other names. Madeleine Brandt. Emil Brandt. You go to Jerusalem to plant a tree."],[[[["flag","moise_safe",false],["flag","parents_safe",false]]],"Moïse Lewin grows up in the flat on the third floor, above the tailor's shop his father reopens in 1945. He becomes an engineer. In 1990 he puts forward your name and Madeleine's to Yad Vashem, to be recognised as Righteous Among the Nations. You go to Jerusalem to plant a tree. Isaac goes with you. He is ninety. He cries the whole time."],[[[["flag","parents_safe",false],["flag","moise_safe",true],["flag","sarah_safe",true]]],"Isaac Lewin reopens the tailor's shop on the rue de la Roquette in 1945. He has to go to court to get it back from the man who was given it in 1941. It takes him three years."],[[[["flag","grabbed_sarah",false]]],"Sarah never forgets the hand that came out of the door on the stairs. When she is old she writes about it, in the one book she ever writes that is not about archives: about a door open a crack, and an eye behind it, and a hand."],[[[["flag","warned_isaac",false],["flag","parents_safe",false]]],"Isaac tells everybody, for the rest of his life, that the German downstairs warned him about the lists in 1940 and he didn't listen. \"And then he hid me anyway,\" he says. \"That's a German for you. Stubborn.\""],[[[["flag","sarah_safe",true],["flag","moise_safe",true],["flag","parents_safe",true]]],"Isaac Lewin, Rivka Lewin, Sarah Lewin and Moïse Lewin did not come back. Their names are on the Wall of Names. Their flat on the third floor is lived in by a family from Brittany, who are very nice."],[[[["flag","pierrot",false]]],"Pierrot Maréchal never finds his family. He grows up in your box room, and is your son, and becomes a pilot for Air France, which makes Madeleine laugh until she cries. He flies the Paris–New York route for thirty years. He is not frightened of aeroplanes."],[[[["flag","felix_alive",false]]],"Felix Adler plays at Josette's wedding in 1956, in the Café des Sports, after flying from New York. It is the Haydn. He has kept his promise."],[[[["flag","felix_dead",false]]],"Felix Adler's grave is in the village cemetery at Les Milles, in a corner. In 2012 the brickworks becomes a memorial, the only French internment camp still intact. You are not alive to see it. But Josette is. She gives them Lindner's sketchbook."],[[[["flag","felix_alive",false]]],"In 2012 the brickworks at Les Milles becomes a memorial, the only French internment camp still intact. Josette gives them Lindner's sketchbook."],[[[["flag","sold_sketch",false]]],"It has one page missing. Sleepers, c. 1939. Nobody knows where it is."],[[[["flag","lucien_arrested",false],["flag","never_told",false]]],"Lucien Marchal dies in 1964 of the lungs he brought back from the tunnels at Dora. At his funeral you are asked to speak, as his oldest friend, the bravest man he knew. You do. You do not say what you should say. You never do."],[[[["flag","lucien_arrested",false],["flag","never_told",true]]],"Lucien Marchal dies in 1964 of the lungs he brought back from the tunnels at Dora. At his funeral you are asked to speak, as his oldest friend. You tell the truth. You tell them everything about the rue des Saussaies. Afterwards nobody says anything to you. Then his widow comes and takes your arm, and walks you to the car."],[[[["flag","lucien_arrested",true]]],"Lucien Marchal comes back from the Limousin with a medal and a limp and a reputation. He is a Communist town councillor in Belleville for twenty years and prints election posters for the Party, and is expelled from it in 1956 for saying in public what he thinks about Hungary."],[[[["flag","jeannot_maquis",false]]],"Jeannot marries Paulette from the maquis in 1945. They run a print shop in Limoges. Every year, on the tenth of June, they go to Oradour."],[[[["flag","jeannot_dead",false]]],"Jeannot's name is on no memorial at all, because he died as a labourer in Germany, which is not a thing France has a word for. His mother goes to the Gare de l'Est every day in 1945 to meet the trains of returning workers, for a year."],[[[["flag","kurt_pow",false]]],"Kurt Brandt lives until 1983, in Hamburg, a clerk with the harbour authority. He never speaks about the Ukraine to anybody but you. Every summer from 1950, he comes to Paris for a week, without Hilde, and you sit in a café on the rue Soufflot and drink calvados and do not talk about it. In 1968 a prosecutor from Ludwigsburg, investigating the shootings in the Ukraine, writes to him asking whether he witnessed anything as a member of his company in September 1941. He sits at his kitchen table with the letter for a week. Then he writes back and tells them everything."],[[[["flag","kurt_dead",false]]],"Kurt Brandt is buried in the German war cemetery at Champigny-Saint-André, in the Eure, west of Paris, under a stone cross, among nearly twenty thousand other German soldiers. Every year on the twenty-fifth of August, while Paris celebrates its liberation, you go there with flowers. Nobody else does."],[[[["flag","hahn_job",false]]],"Doctor Albrecht Hahn is arrested by the Americans in 1945, and released in 1947. In 1951 he becomes deputy director of a university library in West Germany. Three hundred thousand of the books from the depot are never found. In 1960, for your fifty-fifth birthday, a parcel comes from Germany: a first edition of the West-Eastern Divan, 1819, in a binding you recognise. There is no note."],[[[["flag","reinach_book",false]]],"In 1947 a young man of seventeen with a school cap comes into the workshop. He says his name is Daniel Kahn-Morel. He survived the war hidden in a Catholic boarding school in the Tarn under a false name. His grandfather and his parents did not. He has been going round every bookbinder in Paris, because a woman at the depot remembered that the binder with the Hamburg accent had taken something. You take the Jules Verne down from the shelf behind the account books. He opens it. The letter is still inside. Mon cher Grand-Père. He reads it standing up in the workshop, and you go into the back room so that he can be alone."],[[[["flag","simone_defended",false]]],"Simone Ribot's hair grows back. She sends you a card every New Year until she dies. It never says anything except Bonne année. It is enough."],[[[["flag","dug_monique",false]]],"In 1974 a woman of thirty-seven, walking with a stick, comes into the workshop with a book to be rebound and asks if you are the man who dug at Billancourt. She does not remember you. She remembers a voice talking to her through the bricks, asking her name. Her name is Monique. You rebind her book for nothing."],[[[["flag","pleaded_boy",false]]],"In 1964 a parcel comes from a village near Sélestat: a small box of oak, beautifully made, dovetailed by hand, for keeping books in. Inside there is a card. For Herr Brandt, who spoke for me. J. K."],[[[["flag","sarah_drawing",false]]],"Above your workbench, until the day you close the workshop, there is a drawing pinned to the wall: a man with a brown moustache and a yellow star, and a little girl with another star, holding hands."],[null,"You die in 1998, at ninety-three, in the flat on the rue de la Roquette, in the bed where Josette slept between you and Madeleine on the first night in October 1940. In the drawer of the bedside table, folded so many times it is falling apart along the folds, they find a drawing in coloured pencil of a man with a brown moustache holding a bone folder, with a rabbit beside him."],[null,"PAPA DON'T BE AFRAID."]],"choices":[],"gotos":[],"end":true},"ending_england":{"chapter":"Ending — The Other Shore","effects":[],"paragraphs":[[null,"The fishing boat reaches the liner. Somebody hauls you up a rope ladder. The Arandora Star sails at midnight with three thousand Polish soldiers and two hundred civilians, and you stand at the rail at the stern and watch the lights of Saint-Jean-de-Luz go out one by one."],[null,"In England they intern you again, of course. You are a German. They take you off the ship at Liverpool. A week later the Arandora Star sails again, for Canada, carrying German and Italian internees, and is torpedoed off Ireland; eight hundred of them drown. You are not on it, by the luck of a list. Within a fortnight you are in a camp of tents on an unfinished housing estate at Huyton, near Liverpool, and then on the Isle of Man, behind barbed wire, in a seaside boarding house with the windows painted over, with a thousand other Germans and Austrians, many of them Jews, many of them men you knew from Les Milles. You laugh about it, the way Lindner taught you. Rats in a barrel, but an English barrel, with tea."],[null,"They let you out in 1941. You work in a bindery in Oxford, repairing the books of the Bodleian Library. You write to Madeleine through the Red Cross, twenty-five words at a time, once a month. Some of the letters arrive."],[null,"In 1945 you go back to Paris. Madeleine is there. Josette is there, twelve years old, and does not recognise you, and is polite to you, like a guest. Madeleine is kind. Madeleine has been alone for five years, through all of it, the hunger and the stars and the buses and the bells, and you were in Oxford, repairing books. You try. Both of you try, for three years. Then you go back to England, alone."],[null,"You live. That was the choice. You live, and you are safe, and you never forgive yourself for it, and you never know, as long as you live, whether you were right."]],"choices":[],"gotos":[],"end":true},"ending_handed_over":{"chapter":"Ending — Surrender on Demand","effects":[],"paragraphs":[[null,"\"I would rather die,\" you say, \"than go home to your Reich.\""],[null,"The German from Munich smiles. \"That can be arranged,\" he says, quite pleasantly, and makes a cross on his list."],[null,"The French officer in the corner of the tent looks at the canvas wall. He does not say anything. He has his orders. Article Nineteen."],[null,"They hand you over at the demarcation line at Moulins in September 1940, with six other men from the camps of the south, in a lorry with a French driver and two French gendarmes who do not look at you, to two men in leather coats who do. You are taken to Paris, then Berlin, to the Gestapo headquarters on the Prinz-Albrecht-Strasse. Then to the concentration camp at Sachsenhausen, north of Berlin, where you are given a red triangle, for politicals, and a number."],[null,"You die there on the ninth of February 1942, of pneumonia and starvation and the beatings, in the infirmary block, aged thirty-six. Your number is entered in a ledger by a prisoner clerk with good handwriting. The camp administration sends a printed form to your last known address in Germany, informing your relatives of your death from heart failure and offering them your ashes for a fee of three Reichsmarks. Your last known address in Germany is your mother's flat in Hamburg. Your mother has been dead since 1938."],[null,"Madeleine never finds out what happened to you. In 1947 the Red Cross tells her you were \"transferred to the German authorities in September 1940.\" That is all. She keeps writing letters until 1960."],[null,"You were brave. You told the truth. Nobody heard it but a man from Munich and a French officer looking at a wall."]],"choices":[],"gotos":[],"end":true},"ending_deported":{"chapter":"Ending — Night and Fog","effects":[],"paragraphs":[[null,"Stoltenberg looks at you across the desk with the geraniums and says, \"Well, Herr Brandt. You're a stubborn Hamburger. I respect that. It won't help you, but I respect it.\""],[null,"You are not shot. You are sent to the transit camp at Compiègne, and in January 1944, in a cattle wagon, a hundred men to a wagon, to Germany. Nacht und Nebel, the order is called. Night and Fog: prisoners who disappear without trace, so that their families never know."],[null,"The train goes to the concentration camp at Neuengamme. Neuengamme is twenty kilometres from the centre of Hamburg. From the brickworks where the prisoners work, on clear days, you can see the spires of your city. The Michel church. The cranes of the harbour. It is a brickworks. Of course it is a brickworks. You laugh when you see it, the first day, standing in the snow in your striped clothes, and the Kapo beats you for laughing."],[null,"In April 1945, as the British army approaches, the SS evacuate the camp. Nine thousand prisoners are marched to the port of Lübeck and loaded on to ships, the Cap Arcona and the Thielbek, old liners, in the bay. On the third of May, five days before the end of the war, British aircraft, who do not know who is on board, bomb and sink them."],[null,"You are on the Cap Arcona. You are on the deck when the rockets hit. The water is very cold, the way the Allier was cold. You think of the Heine on your workbench with its split spine, that you never finished. You think of a drawing in coloured pencil. You are not afraid."],[null,"Seven thousand prisoners die in the bay of Lübeck that afternoon. Your body washes up on the beach at Neustadt in June, with hundreds of others. They are buried there in mass graves. In 1946 the French government writes to Madeleine to tell her you are \"presumed dead in deportation.\""],[null,"Lucien comes to see her. He was never arrested. You never gave them his name."]],"choices":[],"gotos":[],"end":true},"ending_shot_maquis":{"chapter":"Ending — The Beech Tree","effects":[],"paragraphs":[[null,"They shoot you at dawn, against a beech tree, at the edge of the clearing, next to the boy from the SS."],[null,"It is not anyone's fault. Not exactly. It is the war. It is Oradour. It is Tulle. It is the rope still tied to the balconies, and the pram in the church, and twenty young men in a wood who have seen too much in a week and have nowhere to put it. You had a German accent, and German papers, and a book of drawings of guards and camps, and you were found on the road from Oradour the day after the massacre. You would have shot you too."],[null,"The girl who cooks takes your papers and the drawing from your breast pocket and gives them to the priest at Saint-Junien. The priest sends them to Paris in September, after the liberation, with a letter that says that a German civilian named Brandt was \"executed in error by a unit of the FFI on the twelfth of June 1944 in the context of the events of Oradour,\" and that he is very sorry."],[null,"Madeleine has the drawing framed. It hangs in the workshop, over the bench, where the light is good, until she sells the workshop in 1960."],[null,"Josette visits the clearing in 1984, with her husband. There is nothing there. Just beech trees, and the wind."]],"choices":[],"gotos":[],"end":true},"ending_health":{"chapter":"Ending — The Slow Kind","effects":[],"paragraphs":[[[[["flag","in_mob",false]]],"You die of the beating at the Bastille. Not that day. Four days later, in the bed in the flat on the rue de la Roquette, of the bleeding inside that nobody could see, on the thirtieth of August 1944, with the bells still ringing for the liberation and the flags still hanging in the street. A German, killed by Frenchmen, on the week Paris was freed. It is not a death that will be put on any memorial."],[[[["flag","in_mob",true]]],"It is not a bomb that kills you, or a bullet. It is the other kind of war: the slow kind. The hunger, the cold, the coughing that started in the brick dust and never went away, the winters without coal, the years of too little of everything. Your body simply runs out of the things it needs to go on. It happens to hundreds of thousands of people in Europe in these years, quietly, in beds and in queues and in camps, and nobody counts them as casualties of the war, although that is what they are."],[null,"Madeleine is with you at the end. She holds your broken hand."],[null,"You think of Josette at six in a nightdress in the workshop doorway with a sock rabbit, asking if it was the war today. You think: yes. It was the war. It was the war every day."],[null,"The drawing is in the breast pocket of the jacket they bury you in. PAPA DON'T BE AFRAID. Madeleine put it there herself."]],"choices":[],"gotos":[],"end":true},"afterword":{"chapter":null,"effects":[],"paragraphs":[[null,"History note. Enemy Alien is fiction: Emil, Madeleine, the Lewins, Felix, Lindner, Kurt, Lucien, Hahn, Stoltenberg and everyone else in it are invented. But almost everything that happens to them happened to real people. The internment of German and Austrian refugees at Colombes and the Camp des Milles in 1939, the \"ghost train\" to Bayonne, Article 19 of the armistice, the exodus of June 1940, the roundup of Jewish men in the 11th arrondissement in August 1941, the shooting of hostages, the yellow star, the Vel d'Hiv roundup of 16-17 July 1942 and the separation of the children at Pithiviers and Beaune-la-Rolande, the bombing of Boulogne-Billancourt on 4 April 1943, the STO, the firestorm in Hamburg, the rescuers of Le Chambon-sur-Lignon, the hangings at Tulle and the massacre at Oradour-sur-Glane, the liberation of Paris, the shaving of women, the returning deportees at the Hotel Lutetia: all of these are real, and the numbers given in the story are the historical ones as far as they are known."],[null,"If you want to know more, the Camp des Milles memorial, the Mémorial de la Shoah in Paris, the Centre de la mémoire at Oradour-sur-Glane, and the Lieu de Mémoire at Le Chambon-sur-Lignon all tell these stories far better than a game can."]],"choices":[],"gotos":[],"end":false}}}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("story").textContent);
  const S = DATA.scenes;
  const START = DATA.start, DEATH = DATA.death, AFTER = DATA.afterword;
  const MAX = DATA.max;
  const KEY = "enemy-alien-save-v1";
  const app = document.getElementById("app");

  let state = null;
  let pendingNotes = [];
  let confirmRestart = false;

  function fresh() {
    return { scene: START, stats: Object.assign({}, DATA.stats), flags: [], entered: false, chapter: null };
  }
  function store(s) { try { if (s) localStorage.setItem(KEY, JSON.stringify(s)); else localStorage.removeItem(KEY); } catch (e) {} }
  function loadSaved() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); return s && S[s.scene] ? s : null; } catch (e) { return null; }
  }

  function check(cond) {
    if (!cond) return true;
    return cond.some(group => group.every(t => {
      if (t[0] === "flag") return state.flags.includes(t[1]) !== t[2];
      const v = state.stats[t[1]], n = t[3];
      return { ">=": v >= n, "<=": v <= n, ">": v > n, "<": v < n, "=": v === n }[t[2]];
    }));
  }
  function apply(effects) {
    for (const e of effects) {
      if (e[0] === "set") { if (!state.flags.includes(e[1])) state.flags.push(e[1]); }
      else if (e[0] === "unset") state.flags = state.flags.filter(f => f !== e[1]);
      else {
        let v = state.stats[e[1]];
        v = e[2] === "+" ? v + e[3] : e[2] === "-" ? v - e[3] : e[3];
        state.stats[e[1]] = Math.max(0, Math.min(MAX[e[1]], v));
      }
    }
  }
  function enter(scene) {
    const notes = [];
    state.entered = true;
    if (scene.chapter) {
      state.chapter = scene.chapter;
      if (scene.chapter.startsWith("Part")) {
        const st = state.stats;
        if (st.food > 0) {
          st.food -= 1;
          if (st.food >= 4 && st.health < 10) { st.health += 1; notes.push("You have eaten well enough to mend a little."); }
        } else {
          st.health = Math.max(0, st.health - 2);
          notes.push("Months of hunger have worn you down.");
        }
      }
    }
    apply(scene.effects);
    return notes;
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function topbar(where) {
    const bar = el("div", "topbar");
    bar.appendChild(el("span", "name", "Enemy Alien"));
    const w = el("span", "where", where || "");
    bar.appendChild(w);
    if (state) {
      const b = el("button", "linkbtn", "Restart");
      b.type = "button"; b.id = "restart";
      b.onclick = () => { confirmRestart = true; render(); };
      bar.appendChild(b);
    }
    return bar;
  }

  function rationCard() {
    const card = el("section", "ration");
    card.setAttribute("aria-label", "Your condition");
    const head = el("div", "head");
    head.appendChild(el("span", null, "Carte d'alimentation"));
    head.appendChild(el("span", "francs", state.stats.money + " F"));
    card.appendChild(head);
    for (const [key, label] of [["health", "Health"], ["food", "Food"], ["hope", "Hope"]]) {
      const v = state.stats[key];
      const row = el("div", "stat");
      row.appendChild(el("span", "lbl", label));
      const c = el("div", "coupons" + (v <= 2 ? " low" : ""));
      c.setAttribute("role", "img");
      c.setAttribute("aria-label", label + " " + v + " of 10");
      for (let i = 0; i < 10; i++) c.appendChild(el("span", i < v ? "on" : ""));
      row.appendChild(c);
      card.appendChild(row);
    }
    return card;
  }

  function cover() {
    app.replaceChildren();
    app.appendChild(topbar("Paris, 1939–1945"));
    const c = el("section", "cover");
    c.appendChild(el("h1", null, "Enemy Alien"));
    c.appendChild(el("p", "sub", "An interactive story of a German civilian in Paris during the Second World War."));
    const id = el("div", "card-id");
    for (const [k, v, red] of [
      ["Nom", "BRANDT, Emil"], ["Né le", "1905, Hambourg"], ["Profession", "Relieur (bookbinder)"],
      ["Nationalité", "Apatride (stateless)"], ["Domicile", "64 rue de la Roquette, Paris XIe"], ["Observations", "SUSPECT", true]]) {
      const r = el("div", "row");
      r.appendChild(el("span", "k", k));
      r.appendChild(el("span", red ? "redink" : null, v));
      id.appendChild(r);
    }
    c.appendChild(id);
    c.appendChild(el("p", "note", DATA.note));
    const row = el("div", "btnrow");
    const saved = loadSaved();
    if (saved) {
      const cont = el("button", "primary", "Continue");
      cont.type = "button"; cont.id = "continue";
      cont.onclick = () => { state = saved; pendingNotes = []; render(); };
      row.appendChild(cont);
    }
    const begin = el("button", saved ? "primary ghost" : "primary", saved ? "New game" : "Begin");
    begin.type = "button"; begin.id = "begin";
    begin.onclick = () => { state = fresh(); render(); };
    row.appendChild(begin);
    c.appendChild(row);
    c.appendChild(el("p", "aside", "About 44,000 words. Your progress is saved in this browser, and you can leave and come back at any time."));
    app.appendChild(c);
  }

  function go(target, effects) {
    if (effects) apply(effects);
    state.scene = target;
    state.entered = false;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (!state) return cover();
    let scene = S[state.scene];
    if (!state.entered) { pendingNotes = enter(scene); if (!scene.end) store(state); }
    const dying = state.stats.health <= 0 && !scene.end && state.scene !== DEATH;

    app.replaceChildren();
    app.appendChild(topbar(state.chapter || ""));

    if (confirmRestart) {
      const box = el("div", "confirm");
      box.appendChild(el("p", null, "Start again from September 1939? Your current game will be lost."));
      const row = el("div", "btnrow");
      const yes = el("button", "primary", "Start over"); yes.type = "button";
      yes.onclick = () => { confirmRestart = false; store(null); state = fresh(); render(); window.scrollTo(0, 0); };
      const no = el("button", "primary ghost", "Keep playing"); no.type = "button";
      no.onclick = () => { confirmRestart = false; render(); };
      row.append(yes, no); box.appendChild(row);
      app.appendChild(box);
    }

    if (scene.chapter) app.appendChild(el("h2", "stamp" + (scene.chapter.startsWith("Part") || scene.chapter.startsWith("Epilogue") || scene.chapter.startsWith("Ending") || scene.chapter.startsWith("Interlude") ? " part" : ""), scene.chapter));

    const prose = el("div", "prose");
    for (const n of pendingNotes) prose.appendChild(el("p", "aside", n));
    for (const [cond, text] of scene.paragraphs) {
      if (!check(cond)) continue;
      const shout = /^[A-Z][A-Z .,'’!-]+$/.test(text) && text.length < 60;
      const aside = /^\(.*\)$/.test(text);
      prose.appendChild(el("p", shout ? "shout" : aside ? "aside" : null, text));
    }
    app.appendChild(prose);

    if (scene.end) {
      store(null);
      app.appendChild(el("div", "theend", "THE END"));
      const aw = el("div", "afterword");
      for (const [, text] of (S[AFTER] ? S[AFTER].paragraphs : [])) aw.appendChild(el("p", null, text));
      app.appendChild(aw);
      const again = el("button", "primary", "Play again"); again.type = "button"; again.id = "again";
      again.onclick = () => { state = fresh(); render(); window.scrollTo(0, 0); };
      app.appendChild(again);
      return;
    }

    app.appendChild(rationCard());
    const box = el("div", "choices");
    if (dying) {
      const b = el("button", "primary", "Continue"); b.type = "button"; b.id = "next";
      b.onclick = () => go(DEATH);
      box.appendChild(b);
    } else {
      const gotos = scene.gotos.filter(g => check(g[0]));
      if (gotos.length) {
        const b = el("button", "primary", "Continue"); b.type = "button"; b.id = "next";
        b.onclick = () => go(gotos[0][1]);
        box.appendChild(b);
      } else {
        scene.choices.filter(c => check(c[0])).forEach((c, i) => {
          const b = el("button", "choice", c[1]); b.type = "button"; b.id = "choice-" + i;
          b.onclick = () => go(c[2], c[3]);
          box.appendChild(b);
        });
      }
    }
    app.appendChild(box);
  }

  function start(data) {
    if (data && data.state && S[data.state.scene]) state = data.state;
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ state: state })); } catch (e) {}
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
