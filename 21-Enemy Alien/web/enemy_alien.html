<style>
/* Layout: one narrow reading column, like a page of a rebound book. Chapter
   headings are rubber stamps (Emil cuts them by hand); the stats are a ration
   card whose coupons are torn off as the war goes on. */
:root {
  --paper: #e9ecef;        /* cool grey paper, the colour of an identity card */
  --sheet: #f6f7f8;
  --ink: #1b2230;
  --ink-soft: #4a5468;
  --rule: #c5cbd5;
  --blackout: #2d4682;     /* the blue paper over the windows */
  --stamp: #a3352b;        /* Prefecture red ink */
  --coupon: #fbfaf5;
  --font-body: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-doc: "Courier Prime", "Courier New", ui-monospace, monospace;
  --step-0: 1.125rem;
  --step--1: 0.875rem;
  --step--2: 0.75rem;
  --step-1: 1.4rem;
  --step-2: 2.4rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1420; --sheet: #161d2c; --ink: #dde1e9; --ink-soft: #9aa4b8;
    --rule: #2c3549; --blackout: #91a8de; --stamp: #e07a6c; --coupon: #1d2536;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1420; --sheet: #161d2c; --ink: #dde1e9; --ink-soft: #9aa4b8;
  --rule: #2c3549; --blackout: #91a8de; --stamp: #e07a6c; --coupon: #1d2536;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.62;
  padding-inline: 16px;
  padding-block: 0 4rem;
  -webkit-text-size-adjust: 100%;
  overflow-x: clip;
}
main { max-width: 36rem; margin: 0 auto; display: grid; gap: 1.5rem; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding-block: 0.6rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.topbar .name { font-family: var(--font-doc); font-weight: 700; letter-spacing: 0.18em; font-size: var(--step--1); text-transform: uppercase; white-space: nowrap; }
.topbar .where { font-family: var(--font-doc); font-size: var(--step--2); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.linkbtn {
  font-family: var(--font-doc); font-size: var(--step--2); letter-spacing: 0.08em; text-transform: uppercase;
  background: none; border: 1px solid var(--rule); color: var(--ink-soft);
  padding: 0.35rem 0.6rem; cursor: pointer; flex: none;
}
.linkbtn:hover { color: var(--ink); border-color: var(--ink-soft); }

/* Title screen */
.cover { padding-block: 3rem 1rem; display: grid; gap: 1.25rem; }
.cover h1 {
  font-family: var(--font-doc); font-weight: 700; font-size: clamp(2.2rem, 11vw, 3.6rem);
  letter-spacing: 0.06em; line-height: 1; margin: 0; text-transform: uppercase;
}
.cover .sub { font-style: italic; color: var(--ink-soft); margin: 0; }
.card-id {
  background: var(--sheet); border: 1px solid var(--rule); padding: 1rem 1.1rem;
  font-family: var(--font-doc); font-size: var(--step--1); line-height: 1.5; display: grid; gap: 0.2rem;
}
.card-id .row { display: flex; gap: 0.75rem; }
.card-id .k { color: var(--ink-soft); width: 7.5rem; flex: none; }
.card-id .redink { color: var(--stamp); font-weight: 700; letter-spacing: 0.1em; }
.note { font-size: var(--step--1); color: var(--ink-soft); border-left: 3px solid var(--stamp); padding-left: 0.9rem; margin: 0; }

/* Story text */
.stamp {
  justify-self: start;
  font-family: var(--font-doc); font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
  font-size: var(--step--1); line-height: 1.3; color: var(--stamp);
  border: 3px double var(--stamp); padding: 0.5rem 0.8rem; transform: rotate(-1.6deg);
  max-width: calc(100% - 1.5rem); text-wrap: balance; margin-top: 1rem;
}
.stamp.part { font-size: var(--step-1); border-width: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .stamp { animation: thump 0.35s ease-out both; }
  @keyframes thump { from { transform: rotate(-1.6deg) scale(1.15); opacity: 0.4; } to { transform: rotate(-1.6deg) scale(1); opacity: 1; } }
}
.prose { display: grid; gap: 1rem; min-width: 0; }
.prose p { margin: 0; hyphens: auto; }
.prose p.aside { font-style: italic; color: var(--ink-soft); font-size: var(--step--1); }
.prose p.shout { font-family: var(--font-doc); font-weight: 700; letter-spacing: 0.06em; }

/* Ration card */
.ration {
  background: var(--sheet); border: 1px solid var(--rule); padding: 0.8rem 0.9rem 0.9rem;
  display: grid; gap: 0.45rem; font-family: var(--font-doc); font-size: var(--step--2);
}
.ration .head { display: flex; justify-content: space-between; gap: 1rem; color: var(--ink-soft); letter-spacing: 0.12em; text-transform: uppercase; }
.ration .francs { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; letter-spacing: 0.04em; }
.stat { display: grid; grid-template-columns: 4.2rem 1fr; align-items: center; gap: 0.6rem; }
.stat .lbl { text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }
.coupons { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.coupons span { height: 1.05rem; border: 1px dashed var(--ink-soft); background: var(--coupon); }
.coupons span.on { background: var(--blackout); border-style: solid; border-color: var(--blackout); }
.coupons.low span.on { background: var(--stamp); border-color: var(--stamp); }

/* Choices */
.choices { display: grid; gap: 0.6rem; }
.choice {
  font: inherit; font-size: var(--step-0); line-height: 1.45; text-align: left; color: var(--ink);
  background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--blackout);
  padding: 0.85rem 1rem; cursor: pointer; width: 100%;
}
.choice:hover { border-color: var(--blackout); }
.choice:focus-visible, .linkbtn:focus-visible, .primary:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
.primary {
  font-family: var(--font-doc); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: var(--step--1);
  background: var(--blackout); color: var(--sheet); border: none; padding: 0.9rem 1.2rem; cursor: pointer; justify-self: start;
}
.primary.ghost { background: none; color: var(--blackout); border: 1px solid var(--blackout); }
.btnrow { display: flex; flex-wrap: wrap; gap: 0.75rem; }

.theend { font-family: var(--font-doc); font-weight: 700; letter-spacing: 0.4em; text-align: center; border-block: 1px solid var(--rule); padding-block: 0.8rem; }
.afterword { font-size: var(--step--1); color: var(--ink-soft); display: grid; gap: 0.8rem; }
.afterword p { margin: 0; }
.confirm { background: var(--sheet); border: 1px solid var(--stamp); padding: 1rem; display: grid; gap: 0.8rem; font-size: var(--step--1); }
</style>

<script type="application/json" id="story">{"start":"start","death":"ending_health","afterword":"afterword","stats":{"health":10,"food":6,"hope":6,"money":400},"max":{"health":10,"food":10,"hope":10,"money":99999},"note":"Content note: this story is about civilians in the Second World War. It depicts internment, hunger, bombing, torture, the deportation of Jewish families and the massacre of civilians. The events are fictional but they are drawn closely from history. It does not look away.","scenes":{"start":{"chapter":"Part One — The Enemy Alien","effects":[],"paragraphs":[[null,"The glue pot has been simmering since six. You like this hour best: the workshop on the rue de la Roquette still cold, the courtyard grey, the smell of hot hide glue and old paper, and nobody yet awake to ask you anything."],[null,"Your name is Emil Brandt. You are thirty-four years old. You are a bookbinder. Six years ago you were a bookbinder in Hamburg, in a cellar workshop off the Grindelallee, and you were also a member of the Social Democratic Party, which in the spring of 1933 became a dangerous thing to be. The SA came to the cellar on the second of May. They broke two of your fingers, the ones you still cannot fully close, and they took your younger brother Kurt away in a lorry for nine days. When Kurt came back he would not tell you what had happened. A week later you were on a train to Paris with one suitcase, a bone folder in your coat pocket and forty Reichsmarks sewn into the lining."],[null,"In 1934 the Reich published your name in a list in the official gazette and took away your citizenship. You have a stamped grey paper from the Prefecture of Police that says you are a refugee and stateless, and you have to renew it every few months at a counter where the clerk always sighs as if you have done it to him personally."],[null,"You also have Madeleine, who teaches at the girls' school on the rue Keller and who corrected your French grammar so often in the first year that you married her to make her stop. And you have Josette, who is six, and who is at this moment standing in the workshop doorway in her nightdress, holding a rabbit made of an old sock."],[null,"\"Papa. Is it the war today?\""]],"choices":[],"gotos":[[null,"start_2"]],"end":false},"start_2":{"chapter":null,"effects":[],"paragraphs":[[null,"It is Sunday, the third of September 1939. Two days ago the German army crossed into Poland. Since Friday the radio has talked of nothing else, and yesterday the men from the building who were reservists left with their little cardboard suitcases: Monsieur Ribot from the second floor, the baker's son, the young policeman who lived under the roof. Madeleine cried for the policeman, whom she did not even like."],[null,"You put down the book you were working on. It is a copy of Heinrich Heine's poems that a Russian émigré brought in, with its spine split and the gatherings falling out like teeth. In Germany it would be burned. Here somebody wants it to last another hundred years."],[null,"\"Maybe,\" you tell Josette. \"Maybe not. Grown-ups are deciding.\""],[null,"\"Sarah says if there's a war the Germans will come and put everybody in prison.\""],[null,"Sarah Lewin is eight and lives on the third floor. Her father Isaac is a tailor from Łódź; her mother Rivka sews buttonholes at the kitchen table for a shop in the Sentier; there is also a baby, Moïse, who screams with remarkable lung power at night. The Lewins came from Poland in 1931 and have spent eight years telling everybody they are lucky. Sarah has decided that you, being German, are a sort of expert on Germans."],[null,"\"Sarah,\" you say, \"is a very clever girl who knows nothing at all about it.\""]],"choices":[[null,"Pick Josette up and carry her up to her mother","start_home",[]],[null,"Tell Josette to get dressed: you will walk down to the café together to hear the news","start_cafe",[]]],"gotos":[],"end":false},"start_home":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"Madeleine is at the stove in her old blue cardigan, heating yesterday's coffee, which is mostly chicory. She takes one look at your face and then at Josette's and says, \"Nobody in this family is allowed to be frightened before breakfast. It's a rule.\""],[null,"So you eat breakfast. Bread, a little butter, the end of the apricot jam her mother sent from Gien. Josette tells a long story about the sock rabbit's family. The window is open on the courtyard and from every window around it comes the same voice of the same radio announcer, as if the whole building is one big head thinking a single thought."],[null,"Madeleine puts her hand on the back of your neck, where your hair is too long, and leaves it there."],[null,"\"Whatever happens,\" she says quietly, in German, which she speaks badly and only when she does not want Josette to understand, \"you are French now. You understand me? You are ours.\""],[null,"You do not tell her that it is not a thing the French state agrees with."]],"choices":[],"gotos":[[null,"radio"]],"end":false},"start_cafe":{"chapter":null,"effects":[["set","cafe"]],"paragraphs":[[null,"The Café des Sports on the corner is full by nine on a Sunday, which never happens. The men stand three deep at the zinc counter and nobody is drinking very much. Old Ferrand, who lost a leg at Verdun, sits at his usual table under the radio and tells anybody who comes near him that he has seen all this before, and that it ends with your name carved on a monument in a village square."],[null,"You keep Josette on your knee and say little. In this café you are tolerated. They know you, they know you hate Hitler, they know you rebound Ferrand's prayer book for nothing. But they also know that when you speak, the r comes from the back of your throat in the wrong way, and today that sound makes people turn their heads."],[null,"A young man you do not know looks at you for a long time. Then he says to the room, \"There's a Boche in here.\""],[null,"Ferrand bangs his stick on the floor. \"That one's a Boche who got beaten up by other Boches. Sit down, idiot. Save it for the front.\""],[null,"The young man sits down. Josette, who understood all of it, holds on to your sleeve with both hands until you leave."]],"choices":[],"gotos":[[null,"radio"]],"end":false},"radio":{"chapter":null,"effects":[],"paragraphs":[[null,"At a quarter to twelve, British time, the radio says, Britain is at war with Germany. At five o'clock in the afternoon France follows."],[null,"There are no cheers. You had expected cheers, maybe, or crying, but what happens in the courtyard of number 64 when the announcement comes is that everybody comes out on to the landings and stands there. Madame Pujol, the concierge, comes out of her lodge in her slippers and her black dress and stands under the plane tree with her arms crossed. Isaac Lewin stands on the third-floor landing holding Moïse. Rivka holds Sarah's hand. Upstairs somebody switches off a radio, and then the next, until the only sound is pigeons."],[null,"Then Madame Pujol lifts her head and looks straight at you on the first-floor landing, and says, loud enough to be heard from every window:"],[null,"\"And what are they going to do about him? He's a German, isn't he? A Boche living in this building, with a bomb in his cellar for all we know.\""],[null,"Somebody laughs, uneasily. Nobody tells her to be quiet."]],"choices":[[null,"Answer her the same way. \"My bombs are made of paper and glue, Madame. Go back to your lodge.\"","radio_angry",[["set","pujol_hostile"],["stat","hope","+",1]]],[null,"Answer calmly. \"I left Germany because of the people we are fighting. I am on your side, Madame.\"","radio_calm",[]],[null,"Say nothing. Go inside and close the door.","radio_silent",[["stat","hope","-",1]]]],"gotos":[],"end":false},"radio_angry":{"chapter":null,"effects":[],"paragraphs":[[null,"For a moment the courtyard is very quiet. Then somebody on the fourth floor laughs properly, and Madame Pujol's face turns the colour of raw liver."],[null,"\"You'll see,\" she says. \"We'll see who goes back to his lodge.\""],[null,"She goes back to her lodge. The door slams so hard the glass rattles. Upstairs, Isaac Lewin catches your eye and shakes his head very slightly, the way you would at a child who has stepped on a dog's tail. Isaac has been in more countries than you and knows the value of a concierge."],[null,"Madeleine says later, \"She deserved it.\" Then, after a while, \"But she sees everything, Emil. All the letters. Who comes and goes. You should not have.\""]],"choices":[],"gotos":[[null,"poster"]],"end":false},"radio_calm":{"chapter":null,"effects":[],"paragraphs":[[null,"Madame Pujol sniffs. \"That's what they all say,\" she says, but she says it with less conviction, and when Isaac Lewin calls down from the third floor, \"He's right, Madame, I can testify, this one hates Hitler more than Stalin does,\" a few people laugh and the moment breaks."],[null,"Later, as you pass her lodge, she says without looking up from her sewing, \"My husband died at the Chemin des Dames. Gas. It took him eleven years to die of it. That's what Germans are to me, Monsieur Brandt.\""],[null,"\"I am sorry, Madame.\""],[null,"\"Yes,\" she says. \"Well.\""]],"choices":[],"gotos":[[null,"poster"]],"end":false},"radio_silent":{"chapter":null,"effects":[],"paragraphs":[[null,"You go inside and close the door and stand with your back to it. Madeleine looks at you. Josette looks at you. You have been in France six years. You thought by now that it would not hurt in exactly this way."],[null,"Through the door you hear Madame Pujol say, \"You see? He doesn't even deny it,\" and somebody laughs."],[null,"Madeleine gets up and opens the door again and stands on the landing in her apron with her arms crossed, saying nothing at all, staring down at the concierge until the concierge goes back inside. Then she comes back in and closes the door herself."],[null,"\"There,\" she says. \"Now we have both said nothing.\""]],"choices":[],"gotos":[[null,"poster"]],"end":false},"poster":{"chapter":null,"effects":[],"paragraphs":[[null,"The poster goes up on the Tuesday, on the wall of the town hall of the eleventh arrondissement and on the fence of the Métro at Voltaire. White, with the tricolour at the top, the words too small to read without going close, so that people stand in a crowd around it reading over each other's shoulders."],[null,"All nationals of the Greater German Reich, men between seventeen and fifty years of age, residing in the department of the Seine, are to report to the Stade Olympique de Colombes. They are to bring a blanket, eating utensils, and food for two days."],[null,"The phrase \"Greater German Reich\" includes Austrians, since the Anschluss. It includes Czechs from the Sudetenland. It includes you, whom the Greater German Reich went to the trouble of declaring no longer its citizen. It includes every Jew who escaped Berlin or Vienna and every Communist who escaped Dachau. To the French Republic, now, all of you are one thing: enemy aliens."],[null,"That night you and Madeleine sit at the kitchen table after Josette is asleep. The window is blacked out with blue paper. The single lamp makes a circle on the oilcloth."],[null,"\"Two days of food,\" Madeleine says. \"So they mean two days.\""],[null,"\"Maybe.\""],[null,"\"They can't keep you. You were in their camps. Well, almost. You have papers that say you are a refugee. They'll look at the papers and send you home.\""],[null,"\"Maybe.\""],[null,"\"Stop saying maybe!\" She stands up, sits down again. \"Lucien says you could stay with him in Belleville. Nobody knows you there. Until it's sorted out. Until they understand.\""],[null,"Lucien Marchal is a printer, a Communist, and the best friend you have in France. He would hide you without thinking twice. He would also, if the police came, fight them, which would be worse."]],"choices":[[null,"Report to Colombes. You are a refugee, not a criminal, and you will not hide from France.","report",[]],[null,"Hide at Lucien's until the situation becomes clearer.","hide",[]]],"gotos":[],"end":false},"hide":{"chapter":null,"effects":[["set","hid"]],"paragraphs":[[null,"Lucien's print shop is in a courtyard off the rue de Belleville, behind a dairy, and smells of ink, paraffin and the dairy's cats. He gives you the camp bed in the back room between a Minerva press and three thousand unsold posters for a 1937 workers' choir festival."],[null,"\"The Republic is shitting itself,\" he tells you, pouring red wine into two glasses that have previously held ink. \"Daladier spent a year telling us Hitler could be reasoned with, so now he has to look tough. And who is tough to lock up? Some Viennese violinists. Some old Jewish ladies' sons. You. Very brave.\""],[null,"For four days you sit in the back room and listen to the presses and to Lucien's apprentice, Jeannot, a red-haired boy of sixteen who whistles all of Charles Trenet badly. You sew sections of a ledger to keep your hands still. You think about Josette."],[null,"On the fifth day Madeleine comes with a basket of clothes and a face that tells you everything before she speaks."]],"choices":[],"gotos":[[null,"hide_2"]],"end":false},"hide_2":{"chapter":null,"effects":[],"paragraphs":[[null,"\"Two policemen came this morning,\" she says. \"With a list. Your name was on it. They asked me where you were and I said you had gone to Colombes like everybody else, and one of them, the old one, said, 'No, Madame, he hasn't, we've checked.'\" She takes your hand. \"Somebody told them you didn't go. They knew before they arrived.\""],[[[["flag","pujol_hostile",false]]],"You do not need to ask who. In the lodge by the courtyard gate, Madame Pujol has a window that looks at everybody's door."],[null,"\"They said...\" Madeleine swallows. \"They said if you don't present yourself, it will be considered a sign of hostile intent. They said the word 'spy.' They said I could be charged for helping you. They said it nicely. The old one even apologised.\""],[null,"Lucien, who has been listening from the doorway, says, \"Stay. They don't have enough police to look for every Austrian in Paris.\""]],"choices":[[null,"Go and turn yourself in. You cannot let them threaten Madeleine.","hide_surrender",[]],[null,"Stay hidden. Lucien is right.","hide_raid",[]]],"gotos":[],"end":false},"hide_surrender":{"chapter":null,"effects":[["stat","hope","-",1],["set","drawing"]],"paragraphs":[[null,"You walk to the police station on the rue de l'Orillon with Madeleine, and you hand over your grey paper, and the sergeant at the desk looks at it and looks at you and says, \"Late, aren't we?\" and writes something in a ledger in red ink."],[null,"You do not know what the red ink means. You will find out later that it means you are classified as \"suspect,\" a category that will follow you from one file to the next for years."],[null,"They let you say goodbye. Madeleine has brought something folded small, which she pushes into your coat pocket. \"From Josette,\" she says. \"She made it yesterday. She said to give it to you when you go to the war.\""],[null,"It is a drawing, in coloured pencil, of a man with a brown moustache and a bone folder in his hand. Beside him is a rabbit. Underneath, in letters of different sizes: PAPA DON'T BE AFRAID."]],"choices":[],"gotos":[[null,"colombes"]],"end":false},"hide_raid":{"chapter":null,"effects":[["stat","health","-",1],["stat","hope","-",2],["set","drawing"]],"paragraphs":[[null,"They come at dawn on the ninth day, four of them, with Madame Pujol's information or somebody else's. You hear Lucien shouting at them in the courtyard, and the dairy's dog, and then the door of the back room opens and a young policeman with a moustache like a smear of soot is pointing a revolver at you while you sit up on the camp bed in your vest."],[null,"They are not gentle. One of them hits you in the kidneys with a baton when you are slow on the stairs, not hard, just to make a point, and on the way to the van the young one keeps saying \"Spy, eh? Little spy,\" as though trying it out. Lucien is arrested too, for an afternoon, and released with a warning that his name has been noted. Jeannot stands in the doorway of the dairy with milk all down his front, staring."],[null,"At the police station the sergeant writes something on your file in red ink. You do not know what the red ink means. You will find out later that it means \"suspect: evaded the order to report,\" a category that will follow you from one file to the next for years."],[null,"Madeleine does not get to say goodbye. Three days later, at Colombes, a guard gives you an envelope that has been opened and resealed. Inside is a drawing in coloured pencil of a man with a brown moustache holding a bone folder, a rabbit beside him, and in letters of different sizes: PAPA DON'T BE AFRAID."]],"choices":[],"gotos":[[null,"colombes_late"]],"end":false},"report":{"chapter":null,"effects":[["set","drawing"]],"paragraphs":[[null,"On Thursday morning Madeleine walks with you as far as the Porte de Clichy. She has packed bread, a sausage, two hard-boiled eggs, cheese, apples, chocolate for emergencies, the blue blanket from the cupboard, a fork, a spoon, a tin mug, a towel, soap, a razor, two shirts, socks, and in the middle of the bag, folded small, a drawing."],[null,"\"From Josette,\" she says. \"She made it last night. She said to give it to you when you go to the war.\""],[null,"It is a man with a brown moustache holding a bone folder. Beside him is a rabbit. Underneath, in letters of different sizes: PAPA DON'T BE AFRAID."],[null,"You fold it back up very carefully and put it in your breast pocket. You find that you cannot speak, so you kiss Madeleine instead, there on the pavement in front of a tobacconist's, and an old woman passing says \"Ah, the war, it's starting again,\" and you are not sure whether she means the kiss."],[null,"\"Two days,\" Madeleine says."],[null,"\"Two days.\""]],"choices":[],"gotos":[[null,"colombes"]],"end":false},"colombes_late":{"chapter":null,"effects":[["stat","hope","-",1]],"paragraphs":[[null,"By the time you arrive the stadium has been running for a week and has already acquired the smell of a place where too many men live without enough latrines. They put you in the section for \"suspects,\" which is the eastern end, behind a line of wooden barriers, where the guards are a little rougher and the bread comes a little later. Nobody explains anything."]],"choices":[],"gotos":[[null,"colombes_2"]],"end":false},"colombes":{"chapter":null,"effects":[],"paragraphs":[[null,"The Stade Olympique de Colombes was built for the 1924 Olympic Games. Harold Abrahams won the hundred metres here. You remember the newsreels. Now there are fifteen thousand men sitting on its stone terraces in the rain, sorted roughly by the letters of the alphabet, with their suitcases and blankets and paper parcels, while soldiers of the Republic with fixed bayonets stand on the running track and stare up at them."],[null,"There is nowhere to sleep except the terraces. The first night it rains. You sit with the blue blanket over your head and listen to men coughing in eleven accents of German."]],"choices":[],"gotos":[[null,"colombes_2"]],"end":false},"colombes_2":{"chapter":null,"effects":[],"paragraphs":[[null,"You learn the population of the stadium the way you learn a new city. Here, the Jews from Berlin and Vienna, doctors, furriers, a famous conductor who weeps all the time. There, the political refugees: Communists who quarrel with Socialists, Socialists who quarrel with each other, a Trotskyist who quarrels with everyone. A few Catholic priests who preached against Hitler. A handful of young men who are simply German students who happened to be studying in Paris. And here and there, sitting apart, men who are actual Nazis, commercial agents and loyal party members who were too slow to catch the last train home, and who look at the rest of you with open amusement."],[null,"\"You see the joke,\" says the man on the step below you, on the second day. \"They have locked up Hitler's enemies with Hitler's friends, and they are very proud of themselves.\""],[null,"He is about sixty, with a white beard stained yellow round the mouth by tobacco, a fisherman's sweater and a pencil behind his ear. He is drawing. On a page of a little notebook, in soft pencil, he has drawn the guard below you on the track: the slump of the shoulders, the rifle held as if it were an umbrella, a boy's face under the steel helmet."],[null,"\"Lindner,\" he says, holding out a hand black with graphite. \"Professor. Formerly of the Academy of Arts in Berlin, until my paintings were found to be degenerate and hung in an exhibition in Munich so the public could laugh at them. Very good attendance. The best I ever had.\""]],"choices":[],"gotos":[[null,"colombes_felix"]],"end":false},"colombes_felix":{"chapter":null,"effects":[["set","felix_alive"]],"paragraphs":[[null,"Beside Lindner is a boy who cannot be more than nineteen, very thin, with a big nose and big ears and a violin case he will not put down, even to sleep. He has no blanket, no food, nothing but the violin and the clothes he stands in, which are a suit for concerts."],[null,"\"Felix Adler,\" Lindner says. \"From Vienna. He came straight from rehearsal. Very foolish. He thought they wanted his autograph.\""],[null,"\"I thought it would be one day,\" Felix says, without humour. His accent is pure Viennese, soft and sing-song. \"They said two days of food. I didn't have food. I had a rehearsal. Brahms. The second sextet.\" He looks at the sky. \"My mother is in Vienna still. She wouldn't come. She said they wouldn't hurt an old woman.\""],[null,"It is the third day. The army has handed out no food at all yet. Your bag still holds the end of Madeleine's sausage, half the bread, the chocolate."]],"choices":[[null,"Share your food with Felix.","colombes_share",[["stat","food","-",1],["set","felix_friend"],["stat","hope","+",1]]],[null,"Keep it. Nobody knows how long this will last.","colombes_keep",[]]],"gotos":[],"end":false},"colombes_share":{"chapter":null,"effects":[],"paragraphs":[[null,"Felix eats the bread and sausage with his eyes closed, slowly, like a man in church. When he has finished he wipes his fingers carefully on a handkerchief before touching the violin case."],[null,"\"I'll pay you back,\" he says. \"I'll play at your wedding.\""],[null,"\"I'm already married.\""],[null,"\"Then at your daughter's.\""],[null,"Lindner, who has been watching, turns a page of his notebook, and draws the two of you sitting on the terrace. He tears out the page and gives it to you. You do not look like a man in a camp. You look like a man at a picnic."]],"choices":[],"gotos":[[null,"colombes_end"]],"end":false},"colombes_keep":{"chapter":null,"effects":[],"paragraphs":[[null,"You eat your bread slowly at night, with the blanket over your head, like a schoolboy with a stolen sweet. You can hear Felix's stomach a metre away."],[null,"On the fourth day the army brings bread, a loaf for every six men, and a soup that is mostly water with a smell of cabbage. Felix gets his ration and eats it standing up, and then he sits down on the terrace and takes out his violin, very quietly, and plays something you don't know, a slow movement, just loud enough for the six men around you to hear. Nobody stops him. A guard on the track below looks up, takes off his helmet, and listens with it held against his chest."],[null,"You are ashamed about the sausage, and you will be for years."]],"choices":[],"gotos":[[null,"colombes_end"]],"end":false},"colombes_end":{"chapter":null,"effects":[],"paragraphs":[[null,"You are at Colombes for eleven days. On the eleventh, the men from your section are marched out of the stadium in columns of four to the station at Bois-Colombes, where a train is waiting. Not cattle cars. Ordinary third-class carriages, with the blinds pulled down and nailed shut, and two soldiers in every compartment. Nobody tells you where you are going. A sergeant laughs and says \"To the sun, gentlemen, to the sun.\""],[null,"You manage to throw a postcard out of a gap in the blind at a level crossing outside Melun, addressed to Madeleine, saying ALIVE. GOING SOUTH. KISS J. You will never know whether it arrived."]],"choices":[],"gotos":[[null,"milles"]],"end":false},"milles":{"chapter":"Part Two — The Brickworks","effects":[],"paragraphs":[[null,"The sun, when the blinds are finally torn off, is real. After two days on the train you step down at a little station among vineyards and white rock and a sky so blue it hurts, and there is the smell of thyme, and cicadas, and for one ridiculous moment half the men from the train are laughing."],[null,"Then they march you two kilometres down a road to the camp."],[null,"Les Milles was a tile and brick factory until a few months ago. It is a huge building of red brick, three storeys high, with a tall chimney and loading yards and kilns, and everything inside it, everything, is covered with a fine red dust: the floors, the walls, the wooden drying racks, the old machinery, the beams. Within an hour it is in your hair and your nostrils and the creases of your hands. Within a week it is in your lungs. When men cough here, they cough red."],[null,"There are about two thousand of you. You sleep on the floors of the upper storeys, in rows, on straw that is changed when someone remembers, among the drying racks where the tiles used to dry. The roof leaks. The rats are as large as cats and entirely unafraid. There are twelve latrine buckets for the whole of the second floor."]],"choices":[],"gotos":[[null,"milles_2"]],"end":false},"milles_2":{"chapter":null,"effects":[["stat","money","+",20]],"paragraphs":[[null,"And yet, within a month, you will discover that Les Milles has the best university in France."],[null,"There are, among the two thousand, four Nobel prize nominees, two dozen painters including some whose canvases hang in New York, novelists, a famous Berlin cabaret singer, three orchestral conductors, mathematicians, rabbis, the former editor of a great Frankfurt newspaper, and a professor of Sanskrit. In the evenings, in the old kiln rooms, there are lectures. Lindner gives one on Dürer, standing on an upturned crate. The cabaret singer performs in a corner of the yard. Someone starts a newspaper, written out by hand. Felix finds two cellists and a viola player and they rehearse Haydn in the brick-drying tunnel, because the acoustics are like a church."],[null,"You bind books. That is to say: someone has a broken Bible, someone has a novel coming apart, someone has a sheaf of loose poems he wrote on the train. With a needle bought from a guard, some thread, a sheet of tile-factory cardboard and glue boiled from fish bones, you make them whole again. It becomes your trade inside the wire. People pay you in cigarettes, which are money here."]],"choices":[],"gotos":[[null,"milles_letters"]],"end":false},"milles_letters":{"chapter":null,"effects":[],"paragraphs":[[null,"The first letter from Madeleine arrives at the end of October. It has been opened by the censor and parts of it are blacked out with thick ink. Through the black bars you can read that Josette has started school properly, that she is learning to read, that the sock rabbit has been named Monsieur Lapin, that there are queues for sugar, that Madame Pujol has [black bar] and that Lucien sends [black bar] and that she loves you and is [black bar] the Ministry and is writing to everyone, every deputy, the Archbishop, the President of the League of the Rights of Man."],[null,"She wants to know how you are. She asks it four times."],[null,"You have a sheet of paper and an envelope and an hour before the post is collected. Around you men are writing too, bent over their knees, and some of them are crying with complete absence of embarrassment."]],"choices":[[null,"Write the truth: the dust, the rats, the cold that is coming, the fact that you do not know whether you will ever be released.","letters_truth",[["set","letter_honest"]]],[null,"Write a cheerful letter: the sun, the lectures, the music, the food that is \"not too bad.\"","letters_lie",[]]],"gotos":[],"end":false},"letters_truth":{"chapter":null,"effects":[["stat","hope","-",1]],"paragraphs":[[null,"You write it all. The dust, the rats, the latrines, the thin soup, the men who cough red. That nobody tells you anything. That a commission is supposed to come and examine cases and that nobody has seen it. That you are frightened."],[null,"At the end you write: \"I'm telling you because I could never lie to you anyway and you would know. Keep this letter away from Josette. Tell her Papa is in the sun and is not afraid.\""],[null,"The censor blacks out four lines: the ones about the latrines. Apparently the latrines are a military secret."],[null,"Madeleine's next letter arrives in November. \"Thank you for not lying to me,\" she writes. \"Now I know what to say to them.\" And she has been saying it, it turns out: to a deputy for the Seine, to a journalist at Le Populaire, to a priest at Sainte-Marguerite, to anybody who will listen. In her small, angry schoolteacher's handwriting she has become a nuisance to the French state."]],"choices":[],"gotos":[[null,"milles_winter"]],"end":false},"letters_lie":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"You write about the sun. About Lindner's lecture on Dürer and the cabaret singer and Felix's Haydn quartet in the brick tunnel. You write that the food is \"not too bad.\" You draw the camp chimney in the margin with smoke coming out like a question mark, and a little rabbit for Josette."],[null,"It makes you feel better to write it. For half an hour while you write it you live in the camp you are describing."],[null,"Madeleine's next letter is full of relief. \"I was so frightened,\" she writes. \"Now I can sleep.\" She also writes that the woman from the Ministry told her that the cases of men with French wives would be \"considered favourably in time,\" and that she has decided to be patient."]],"choices":[],"gotos":[[null,"milles_winter"]],"end":false},"milles_winter":{"chapter":null,"effects":[],"paragraphs":[[null,"The winter comes down from the Alps on a wind called the mistral, which blows for three days at a time and makes the whole brick building moan like an organ. There is no heating. You sleep in all your clothes with the blue blanket and two sheets of newspaper and still wake with your feet dead."],[null,"In December the dysentery starts."],[null,"It goes through the second floor like a fire through straw. Men lie on the floor in their own filth because they cannot get to the buckets in time. The camp has one doctor, a French army doctor who is kind and has nothing: no medicine, no clean water, no beds. The internees who are doctors, and there are dozens, Berlin specialists, professors, are not permitted to practise. They practise anyway, in whispers, with nothing."],[null,"Felix gets it in the second week. In four days he goes from thin to skeletal. His lips crack. He cannot keep down water. He lies on his straw with the violin case by his head and asks you, quite calmly, to see that it goes to his mother in Vienna if anything happens."],[null,"There is a guard, a corporal from Marseille named Tonin, who is known to sell things. Bismuth tablets, a little opium tincture, clean water by the bottle. His prices are famous."],[[[["flag","felix_friend",false]]],"Felix looks at you, and you remember the night at Colombes when he ate your bread with his eyes closed."]],"choices":[[null,"Buy medicine from Tonin with your money.","winter_buy",[["stat","money","-",100],["set","felix_saved"]]],[null,"Give Felix your blanket and your rations of bread and nurse him yourself.","winter_nurse",[["stat","health","-",2],["stat","food","-",1],["set","felix_saved"]]],[null,"You can't help him. You have your own family to survive for. Stay away from the sick.","winter_away",[]]],"gotos":[],"end":false},"winter_buy":{"chapter":null,"effects":[],"paragraphs":[[null,"Tonin wants a hundred francs for a bottle of bismuth and a little paregoric. It is most of what you have. He counts it twice, holding it up to the light as though it might be forged, then gives you the bottles wrapped in a page of Le Petit Marseillais."],[null,"\"For the violinist?\" he says. \"Pity. He plays nice. I hear him from the guardroom.\""],[null,"You and Lindner take turns spooning water and medicine into Felix through the night. On the third day his fever breaks. On the fifth he sits up and asks what day it is. On the eighth he plays four bars of Haydn, very badly, and puts the violin down and laughs until he cries."],[null,"Twenty-three men on the second floor die in December and January. Felix is not one of them."]],"choices":[],"gotos":[[null,"milles_commission"]],"end":false},"winter_nurse":{"chapter":null,"effects":[],"paragraphs":[[null,"You give him your blanket. You give him your bread, soaked in water to make it soft. You carry the bucket. You clean him. You take turns with Lindner through the long freezing nights, and you lie next to him so that your body heat will keep him alive, the way soldiers do."],[null,"It nearly kills you. In the second week you get it yourself, a lighter case, and for three days you are the one lying on the straw while Felix, barely able to stand, carries your bucket."],[null,"You both live. Twenty-three men on the second floor die in December and January. Neither of you is one of them. Afterwards Felix calls you \"brother,\" without any irony, in front of everybody, and nobody laughs."]],"choices":[],"gotos":[[null,"milles_commission"]],"end":false},"winter_away":{"chapter":null,"effects":[["unset","felix_alive"],["set","felix_dead"],["stat","hope","-",2]],"paragraphs":[[null,"You move your straw to the other end of the floor, near the windows, where the air is cleaner. You tell yourself it is reasonable. You tell yourself that Josette needs a father and not a dead hero."],[null,"Felix Adler dies on the twenty-first of December 1939, at about four in the morning, of dehydration, in the brick dust, aged nineteen. Lindner is with him. Afterwards Lindner sits with his back against a drying rack for a long time, not drawing."],[null,"They bury Felix in the village cemetery at Les Milles, in a corner for strangers. Six men are allowed to go. The army does not provide a rabbi, so a rabbi from among the internees, who was rabbi of a large Berlin synagogue, says Kaddish in his overcoat."],[null,"The violin is supposed to go to his mother in Vienna. Nobody knows how to send it. In the end the cabaret singer takes it and keeps it, and in February, on the anniversary of something, plays it badly in the yard, and three hundred men stand in the cold and listen to a Viennese song they all know."],[null,"Lindner never mentions your straw by the windows. He does not have to."]],"choices":[],"gotos":[[null,"milles_commission"]],"end":false},"milles_commission":{"chapter":"The Commission","effects":[],"paragraphs":[[null,"In February 1940 a commission finally comes to sort out the internees. Three Frenchmen in a requisitioned office by the gate: a captain, a magistrate in a black coat, and a young man from the Interior Ministry with a fountain pen, who does the questioning. The rumours are that men with French wives, men with French children, men with sons in the French army and men over fifty may be released, if they are \"loyal.\""],[null,"You wait in a corridor for six hours. Then you sit on a chair in front of the three men, and the young man reads your file, and stops at a line, and frowns."],[[[["flag","hid",false]]],"\"It says here you failed to report to Colombes,\" he says. \"That you were arrested in hiding. Why would a loyal refugee hide from the French authorities, Monsieur Brandt?\""],[[[["flag","hid",true]]],"\"It says here you were politically active in Germany,\" he says. \"Social Democrat. And in Paris? Are you in contact with the Communist Party? Your file mentions a printer in Belleville.\""],[null,"You understand that the young man is not your enemy. He is just a young man with a file, and the file is your enemy."]],"choices":[[null,"Explain everything honestly, with dignity: who you are, why you fled, why you love France.","commission_dignity",[]],[null,"Beg. Tell them about your daughter. Show them the drawing.","commission_beg",[]],[null,"Offer to join the Foreign Legion to prove your loyalty.","commission_legion",[]]],"gotos":[],"end":false},"commission_dignity":{"chapter":null,"effects":[],"paragraphs":[[null,"You speak for ten minutes in your best French. The magistrate seems moved. The captain looks at his watch. The young man writes on the file for a long time."],[[[["flag","letter_honest",false]]],"At the end the magistrate says, \"Your wife has been very active, Monsieur Brandt. We've had letters from a deputy and from the League of the Rights of Man about you. Very active.\" He almost smiles. \"Favourable consideration, I think.\""],[null,"\"You'll be informed,\" says the young man."]],"choices":[],"gotos":[[null,"commission_after"]],"end":false},"commission_beg":{"chapter":null,"effects":[["stat","hope","-",1]],"paragraphs":[[null,"You tell them about Josette. You take the drawing out of your breast pocket and unfold it on the table, PAPA DON'T BE AFRAID, and the captain looks at it and looks away, and the magistrate takes off his glasses and cleans them."],[null,"\"I have a daughter as well,\" the young man says quietly, and writes something on the file."],[null,"\"You'll be informed,\" he says."],[null,"Afterwards, in the yard, you feel as though you have taken off your clothes in front of strangers. But Lindner, when you tell him, says, \"Pride is for people who aren't in camps. Did they write something?\""],[null,"\"Yes.\""],[null,"\"Then it worked.\""]],"choices":[],"gotos":[[null,"commission_after"]],"end":false},"commission_legion":{"chapter":null,"effects":[],"paragraphs":[[null,"The captain looks up for the first time. \"The Legion,\" he says. \"Five years. You understand that you would go where they send you, Morocco, Syria? That your wife would not see you?\""],[null,"\"If it gets me out of here.\""],[null,"\"It would get you out of here,\" he says, \"and into a sandbag on the Somme. Monsieur, I have a hundred men a week who discover a passionate love for the Foreign Legion at this desk. The Legion does not want them, and frankly, neither do I.\" He makes a mark on your file. \"You'll be informed.\""]],"choices":[],"gotos":[[null,"commission_after"]],"end":false},"commission_after":{"chapter":null,"effects":[],"paragraphs":[[null,"You are not informed."],[null,"In March, a few dozen men are released, mostly the old and the sick and those with sons in the army. In April, a few dozen more. The lists go up on the wall by the kitchen every Friday, and every Friday you read them twice and your name is not there. Lindner's name is not there either, although he is sixty-three and has a heart that misses beats and goes \"like a drunk drummer,\" he says, if he climbs the stairs too quickly."],[[[["flag","letter_honest",false]]],"At the end of April, a letter comes from Madeleine saying that the Ministry has approved your release \"in principle,\" that it needs only a signature in Marseille. She says it in capital letters. You read it forty times."],[null,"And then, on the tenth of May 1940, the German army invades Holland, Belgium and Luxembourg, and nobody in France is released from anywhere ever again."]],"choices":[],"gotos":[[null,"milles_may"]],"end":false},"milles_may":{"chapter":"May 1940","effects":[],"paragraphs":[[null,"The news comes in waves, each worse than the last. The Germans are in Holland. The Germans are in Belgium. The Germans have crossed the Meuse at Sedan, where the French said nothing could cross. The Germans are at the Channel. The British are trapped at Dunkirk. The Germans are at the Somme. The Germans are on the Seine."],[null,"And in Les Milles, two thousand men who have spent their lives running from Hitler sit locked behind barbed wire in the south of France and listen to his army coming closer every day."],[null,"The camp fills up. New internees arrive from all over France, men who were released last winter and rounded up again, men from Belgium and Holland, refugees of refugees. By the beginning of June there are three thousand five hundred men in the brickworks. You sleep shoulder to shoulder. The bread ration is cut. The commandant, who seems a decent man, has no orders, and no one in Paris answers his telephone because, very soon, there is nobody in Paris to answer it."],[null,"The camp is full of Germans who know exactly what the Gestapo does with men like them. They have names on lists. Some of them have been in Dachau already and have the marks to show it."],[null,"\"If the Germans come here,\" Lindner says, \"we are rats in a barrel.\""]],"choices":[],"gotos":[[null,"milles_lindner"]],"end":false},"milles_lindner":{"chapter":null,"effects":[["set","sketchbook"],["stat","hope","-",1]],"paragraphs":[[null,"Some men in the camp kill themselves in those weeks. One cuts his wrists in the latrines. One, a lawyer from Frankfurt who has been in Buchenwald, takes a bottle of veronal he has been saving, very calmly, and lies down on his straw with his hands folded and his spectacles in his breast pocket. They carry them out in the early morning while everybody pretends to sleep."],[null,"Lindner does not kill himself. His heart does it for him."],[null,"It happens on the eleventh of June, in the yard, in the afternoon, in the sun. He is sitting on a bench drawing the chimney, and he says, \"Emil, I think I'll take a little rest,\" and puts down the pencil, and lies back on the bench as if to look at the sky, and is dead by the time the French doctor comes running across the yard."],[null,"Among his things there is a sketchbook. Three hundred drawings of Colombes and of Les Milles: the guards, the latrines, the men in the straw, the cabaret singer, Felix with his violin, the rabbi in his overcoat, the lawyer with his spectacles, you, bent over a book with a needle in your hand. On the first page, in his small, dancing handwriting, it says: For Emil Brandt, who knows how to keep things from falling apart. Keep this. Someone will need to see it."]],"choices":[],"gotos":[[null,"ghost_train"]],"end":false},"ghost_train":{"chapter":"The Ghost Train","effects":[],"paragraphs":[[null,"On the twenty-second of June, the day France signs the armistice with Germany in the same railway carriage in the forest of Compiègne where Germany signed in 1918, the commandant of Les Milles does a brave and stupid and decent thing. He puts two thousand of his most endangered internees on a train, to send them to Bayonne, on the Atlantic coast, where there are supposed to be ships."],[null,"You are on it. Of course you are on it."],[[[["flag","felix_alive",false]]],"Felix is beside you, his violin case between his knees."],[null,"The train is made of cattle wagons this time, forty men in each, the doors locked. It is ninety degrees in the shade, and there is no shade. Each wagon has one bucket of water and one bucket for everything else. It takes two days to reach Bayonne. In the wagon a man from Cologne dies in the night, sitting up, and you ride with him for eleven hours before the guards let you lift him out."],[null,"At Bayonne the train stops in a siding by the river. Through the slats you can see the town, the cathedral spires, the Adour, and beyond it the sea, and the smoke of a ship. People shout through the slats to railway workers. The railway workers shout back."],[null,"There are ships, they say. At Saint-Jean-de-Luz, twenty kilometres away, the British are taking off Polish soldiers. Some civilians too. Maybe. The last ships, today and tomorrow."]],"choices":[],"gotos":[[null,"ghost_train_2"]],"end":false},"ghost_train_2":{"chapter":null,"effects":[],"paragraphs":[[null,"And then a new rumour runs along the train: the Germans are already at Bayonne. They are coming down the road. Someone has seen motorcycles."],[null,"It is not true. It will turn out that the Germans are still a day away. But the French officer in charge of the train believes it, and in a panic he gives the order to turn back. The engine is being uncoupled to move to the other end. For ten minutes, in the confusion, the doors of your wagon are open while the guards run up and down the train shouting."],[null,"A railway worker in blue overalls, an old Basque with an enormous moustache, stands by the open door and says to nobody in particular, very quietly, \"The road to Saint-Jean-de-Luz is that way. Forty minutes by lorry. My brother-in-law has a lorry.\""],[null,"Your family is in Paris. Paris has been German since the fourteenth of June."]],"choices":[[null,"Jump down. Go to Saint-Jean-de-Luz. Get on a ship to England.","port",[]],[null,"Stay on the train. You will not go anywhere Madeleine and Josette cannot follow.","nimes",[]]],"gotos":[],"end":false},"port":{"chapter":null,"effects":[["stat","hope","-",2]],"paragraphs":[[null,"The lorry smells of fish. You lie under a tarpaulin with three other men from the train, and the Basque's brother-in-law drives like a man possessed, and an hour later you are standing on the quayside at Saint-Jean-de-Luz in a crowd of thousands: Polish soldiers in long greatcoats, British civilians with dogs, Czech airmen, Belgian families, a woman in a fur coat in the June heat. Out in the bay a liner is lying at anchor, the Arandora Star, with small boats going back and forth to it."],[null,"A British officer with a list and a loudspeaker is shouting in English and bad French: soldiers first, British subjects next, then if there is room."],[null,"There is room. Late in the evening there is room. A Polish sergeant who has decided you are Polish waves you into a fishing boat full of men, and the boat pulls away from the quay, and you sit in the bottom of it with Lindner's sketchbook inside your shirt and Josette's drawing in your breast pocket and look back at France."]],"choices":[[null,"Stay in the boat.","ending_england",[]],[null,"At the last moment, jump back on to the quay steps. You cannot do it.","port_back",[]]],"gotos":[],"end":false},"port_back":{"chapter":null,"effects":[["stat","health","-",1]],"paragraphs":[[null,"You are out of the boat before you know you have decided, scrambling up the slimy steps of the quay with somebody's boot on your hand, and the Polish sergeant shouting \"Idiot! Idiot!\" in Polish, which is the same word."],[null,"You sit on the quay among the rope and fish boxes until it is dark and the ship has gone, and you do not know whether you are a coward or a husband."],[null,"In the morning you walk back to Bayonne. The train is gone. A gendarme picks you up on the road outside the town, looks at your grey paper, and sighs, and puts you in a lorry with other stragglers, and two days later you are delivered, like a lost parcel, to the camp where the train ended up: Saint-Nicolas, near Nîmes."]],"choices":[],"gotos":[[null,"nimes_2"]],"end":false},"nimes":{"chapter":null,"effects":[],"paragraphs":[[null,"The train goes back the way it came. Three more days. Two more dead. On the twenty-seventh of June it stops for good near Nîmes, and you are marched to a field of tents in a valley called Saint-Nicolas, where there is no dust, only sun, and flies, and the smell of the latrine trench, and a stream where you can wash."],[[[["flag","felix_alive",false]]],"Felix plays that first night, sitting outside the tent under the stars. A guard asks for \"something French,\" so he plays the Marseillaise, very slowly, like a funeral march, and everybody, the guards and the internees, stands up."]],"choices":[],"gotos":[[null,"nimes_2"]],"end":false},"nimes_2":{"chapter":"Article Nineteen","effects":[],"paragraphs":[[null,"In July you learn the terms of the armistice. The north and west of France is occupied by Germany. The south is \"free,\" under a new government in the spa town of Vichy, headed by old Marshal Pétain, the hero of Verdun, who has told the French that they must accept defeat and be cleansed of their sins."],[null,"And Article Nineteen. Someone has a newspaper with the text. It is passed from tent to tent and read aloud, again and again, until every man in Saint-Nicolas knows it by heart:"],[null,"\"The French Government is obliged to surrender on demand all Germans named by the German Government in France, as well as in the French possessions, colonies, protectorate territories and mandates.\""],[null,"Surrender on demand."],[null,"In August, the Germans come to ask. A German commission, led by an official called Kundt, tours the camps of the south of France with lists. They are polite. They wear civilian clothes. They interview men in a tent by the gate, one at a time, offering repatriation to those who wish to \"return home to the Reich.\" Some do, poor fools or real Nazis. Others are called in and asked questions, and their names are checked against the lists."],[null,"Yours, you are fairly sure, is on a list. It was in the gazette in 1934."],[[[["flag","felix_alive",false]]],"\"We go tonight,\" Felix says. \"There's a gap in the wire by the stream. Everyone knows. The guards look the other way. They don't want to hand us over either.\""],[[[["flag","felix_alive",true]]],"There is a gap in the wire by the stream. Everyone knows. Men go through it every night and the guards look the other way; they do not want to hand anyone over either."]],"choices":[[null,"Escape tonight, through the wire by the stream.","escape",[]],[null,"Stay and face the commission. Running makes you look guilty; with luck they won't recognise you.","kundt",[]]],"gotos":[],"end":false},"kundt":{"chapter":null,"effects":[],"paragraphs":[[null,"You are called into the tent on the fourth day. There is a table, a jug of water, a German in a grey linen suit with a Party pin on the lapel, and a French officer who sits in the corner and looks at the tent wall and does not say anything at all for the whole interview."],[null,"The German is about your age. He has a list in front of him and a pencil."],[null,"\"Brandt, Emil,\" he says, in a soft Bavarian voice. \"From Hamburg. Bookbinder.\" He runs the pencil down the list. \"Social Democrat, wasn't it? Not a Communist. That's something. Would you like to come home, Herr Brandt? The Reich is magnanimous to those who return. A trade like yours, there's always work.\""]],"choices":[[null,"Lie. Say you are not political, never were, you left for work and for love, and you have a French wife and child.","kundt_lie",[]],[null,"Tell him the truth: you would rather die than serve his Reich.","ending_handed_over",[]]],"gotos":[],"end":false},"kundt_lie":{"chapter":null,"effects":[["stat","hope","-",2]],"paragraphs":[[null,"You lie. You say you were never political. You say you left Germany for a woman, then for work, then because it seemed simplest. You say you know nothing about politics, nothing about the party, nothing. You say you have a French wife and a little girl in Paris, and that all you want is to go home to them."],[null,"He looks at you for a long time, tapping the pencil. In the corner the French officer looks at the tent wall."],[null,"\"A Frenchwoman,\" the Bavarian says at last, as if it explains everything sad about you. He makes a small mark, not a cross, a tick. \"You can go.\""],[null,"You find out that night that he has selected four men from Saint-Nicolas for return to Germany. One is a Social Democrat deputy from the Reichstag whom you heard speak once in Hamburg in 1931. You never learn what happens to him. You can guess."],[null,"You walk out of Saint-Nicolas in September with a release paper signed by a French colonel, because, it turns out, Madeleine's Ministry signature came through after all, in July, in Vichy, from a clerk who was moving the files south in a lorry. It just took six weeks to find you."],[null,"You are free. You have to get back to Paris. And in between you and Paris there is the demarcation line, and on the other side of it, everywhere, there are Germans."]],"choices":[],"gotos":[[null,"homeward"]],"end":false},"escape":{"chapter":"Part Three — The Line","effects":[],"paragraphs":[[null,"The gap in the wire by the stream is a place where a post has rotted and the strands sag to knee height. You go through it at two in the morning on your belly with your bag pushed ahead of you, through mint and wet stones, and when you stand up on the far side there is nobody shouting, nobody shooting, nothing but frogs and the smell of the garrigue and an enormous sky full of stars."],[[[["flag","felix_alive",false]]],"Felix comes through behind you, holding the violin case above his head like a man fording a river. On the far side he stands up, looks back at the tents, and bows to them, formally, from the waist."],[null,"You walk. You walk by night and sleep by day in vineyards, under the low twisted vines heavy with grapes that are nearly ripe, which you eat until your stomach aches. You walk north along the Rhône, along roads still littered with the remains of the June exodus: burned-out cars pushed into ditches, a pram with no wheels, a piano, inexplicably, in a field. You stay away from villages. You speak French with a German accent, and in the south, this summer, people are not fond of Germans or of foreigners in general."],[null,"On the fifth night, starving, you come to a farm outside Pont-Saint-Esprit. There are chickens in the yard, a lit window, a dog on a chain that has not yet smelled you."]],"choices":[[null,"Knock on the door and ask for food.","escape_knock",[]],[null,"Steal what you can from the henhouse and keep moving.","escape_steal",[]]],"gotos":[],"end":false},"escape_knock":{"chapter":null,"effects":[["stat","food","+",3],["stat","hope","+",2],["stat","health","+",1]],"paragraphs":[[null,"The woman who opens the door is about seventy, tiny, in black, with a shotgun broken over her arm. She looks at you for a long time in the lamplight."],[null,"\"Boche,\" she says."],[null,"\"Yes, Madame. Of a kind. The kind that the other kind locks up.\""],[null,"She thinks about it. Then she says, \"My grandson is a prisoner in Germany. Somewhere in Pomerania. Nobody knows. He is twenty.\" She opens the door wider. \"Let's hope somebody over there gives him soup.\""],[null,"She gives you soup. Bread, a whole cheese, a bottle of thin red wine, and a pair of her dead husband's boots because yours are coming apart, and lets you sleep in the hayloft. At dawn she wakes you with coffee made of roasted barley and tells you the way to the main road north."],[null,"\"Don't come back,\" she says. \"Next time my son-in-law might be home. He's for Pétain.\""]],"choices":[],"gotos":[[null,"line_approach"]],"end":false},"escape_steal":{"chapter":null,"effects":[["stat","food","+",2],["stat","hope","-",1]],"paragraphs":[[null,"You take four eggs and a hen. The hen makes a noise like the end of the world and the dog goes mad on its chain and a light goes on upstairs, and you run across a field of stubble with the hen under your arm, and a shotgun goes off behind you, very loud, and something hums past your head like a bee."],[null,"You wring the hen's neck in a ditch a mile away, with your eyes shut. You have never killed anything bigger than a moth. You cook it over a small fire in a gully, badly, and eat it half raw."],[[[["flag","felix_alive",false]]],"Felix will not eat it at first. Then he does, all of it, crying. \"My mother kept a kosher kitchen,\" he says. \"Forgive me, Mama. You also never had a war.\""],[null,"Afterwards you lie awake thinking about the old farmer, and how in the morning she will count her hens."]],"choices":[],"gotos":[[null,"line_approach"]],"end":false},"homeward":{"chapter":"Part Three — The Line","effects":[],"paragraphs":[[null,"With a real release paper in your pocket you can buy a real train ticket, and you do, from Nîmes to Lyon and from Lyon to Moulins, sitting upright in a third-class carriage among peasants and soldiers coming home from a lost war, with your hat over your eyes. A gendarme looks at your paper at Lyon and says \"Ah, from the camps,\" and hands it back without interest. Since June, France has had a million soldiers taken prisoner, and nobody has the energy to be interested in a German."],[null,"But the paper is good only in the free zone. At Moulins the train stops. North of the town, across the river Allier, is the demarcation line, and on the bridge there is a German sentry box painted in black, red and white stripes, and German soldiers checking the passes that the German authorities issue, called Ausweis, which you do not have and could never get."]],"choices":[],"gotos":[[null,"line_approach"]],"end":false},"line_approach":{"chapter":"The Demarcation Line","effects":[],"paragraphs":[[null,"The demarcation line runs across France like a scar, twelve hundred kilometres long, from the Spanish border to Switzerland, through forests and fields and the middle of villages. On one side is Vichy. On the other side is the German army. There are bridges with sentry boxes and barbed wire. Everywhere else there are patrols with dogs."],[[[["flag","felix_alive",false]]],"Here, at the edge of it, Felix stops. He sits on a milestone by the road and says that he will not cross."],[[[["flag","felix_alive",false]]],"\"Marseille,\" he says. \"There's an American there, everybody in the camp was talking about him. Fry. Varian Fry. He's getting people out. Visas to America, a ship from Lisbon. Writers, artists, musicians. I'm a musician. Some kind of musician.\" He looks north, towards the occupied zone, where Hitler is. \"I'm not going towards them, Emil. Not even for you. You have someone up there. I have nobody up there.\" He takes your hand. \"Go home to your girl. I'll play at her wedding.\""],[[[["flag","felix_alive",false]]],"You embrace on the side of the road. He walks back south with his violin case, a thin figure in a concert suit that is now mostly holes, and does not turn round, and you watch him until he is out of sight."],[null,"You are near the village of Saint-Pourçain. In the café, you have been told, if you sit by the back door and buy a drink, a man called Ricou will eventually come and sit beside you. He is a passeur: a smuggler of people across the line. He charges a hundred and fifty francs, and he is said to be honest, which is to say he has not yet been caught selling his clients to the Germans."],[null,"There is also the river. Some people just swim it at night."]],"choices":[[null,"Pay the passeur, Ricou.","line_ricou",[["stat","money","-",150]]],[null,"Swim the river at night alone.","line_swim",[]]],"gotos":[],"end":false},"line_ricou":{"chapter":null,"effects":[],"paragraphs":[[null,"Ricou turns out to be a boy of about seventeen with an old man's face and a stolen Wehrmacht bicycle. He takes your money and counts it and says, \"Tonight. Do what I do. When I lie down, you lie down. When I run, you run. If they shoot, you lie down and stay down and don't scream, and if they catch you, you've never seen me.\""],[null,"At midnight he leads you through a wood, across a field of sugar beet, along a drainage ditch with water up to your knees. Twice he stops and lies flat and you lie flat beside him in the mud, and the second time you hear a German patrol pass on the track ten metres away: two men talking about football in the accent of Saxony, and the jingle of a dog's lead. You can smell their cigarettes. You think, those boys could be from my street. You think, if the dog smells me I am dead."],[null,"The dog does not smell you. At three in the morning Ricou points at a road and says, \"That's the occupied zone. Congratulations. Welcome to Germany.\" He turns his bicycle round and is gone."]],"choices":[],"gotos":[[null,"paris_return"]],"end":false},"line_swim":{"chapter":null,"effects":[["stat","health","-",2]],"paragraphs":[[null,"The Allier in September is low but fast, and very cold, the colour of iron in the moonlight. You strip to your underclothes and tie your clothes and Lindner's sketchbook and the drawing inside your bag wrapped in oilcloth, and you put the bag on your head, and you go in."],[null,"It is fifty metres. In the middle the current takes your legs out from under you and you go under and come up and go under, and it is like being in the hands of something huge and indifferent, and you think, absurdly, of the Heine in your workshop with its split spine, and how you never finished it."],[null,"You come out half a kilometre downstream on a gravel bank, choking, without the bag."],[null,"You find the bag the next morning, caught in the roots of a willow, the oilcloth intact. Everything inside is wet but not ruined: the sketchbook stained at the corners, the drawing a little blurred. PAPA DON'T BE AFRAID. The letters have run into each other."],[null,"You have a fever for three days in a barn. Then you walk."]],"choices":[],"gotos":[[null,"paris_return"]],"end":false},"paris_return":{"chapter":"Paris, October 1940","effects":[],"paragraphs":[[null,"You walk into Paris on the twenty-third of October 1940 through the Porte d'Italie, on foot, thirteen months after you left it."],[null,"It is the silence you notice first. Paris used to be the loudest city you had ever lived in, horns, buses, the iron wheels of carts on cobbles. Now there are no cars. There is no petrol, except for the Germans, and so the boulevards are empty, wide as fields, with bicycles and a few horse-drawn cabs taken out of museums and, now and then, a German staff car going fast with a little flag on the bonnet."],[null,"Then the flags. Red, with a white circle and a black hooked cross, hanging from the Senate, from the Chamber of Deputies, from the big hotels on the rue de Rivoli. On every corner there are new signposts painted in yellow, in German: Zum Gross-Paris Kommandantur. Soldatenkino. Wehrmachtsbordell. In the Luxembourg gardens a German band is playing Strauss waltzes to a crowd of soldiers and a handful of Parisians."],[null,"The soldiers are everywhere. Young men in field-grey with cameras, on leave, photographing each other in front of Notre-Dame and the Eiffel Tower. They are polite. They hold doors for old women. They pay for things in the shops with occupation marks at an exchange rate that makes everything in Paris cost them almost nothing, and they are buying it all, silk stockings, perfume, butter, shoes, and sending it home to their mothers. You hear their accents everywhere, Bavarian, Swabian, Berliner, Hamburg, your own, and every time it is like a hand on the back of your neck."],[null,"On the rue de la Roquette, at number 64, the door of the courtyard is open, as always. You walk in."]],"choices":[],"gotos":[[null,"exode"]],"end":false},"exode":{"chapter":null,"effects":[],"paragraphs":[[null,"Josette sees you first, from the kitchen window on the first floor. You hear the scream before you see her, and then she is running down the stairs in her socks and across the courtyard, and she hits you so hard at knee height that you both fall over on the cobbles, and she will not let go of you, she will not let go, and you are lying on your back in the courtyard of number 64 with your daughter on top of you, laughing and crying, and above her, in the doorway at the top of the steps, with a dishcloth in her hand, is Madeleine."],[null,"She is thinner. Her hair is cut short, like a boy's. There is a scar on her forehead, pink and new, that was not there before."],[null,"She does not run. She walks down the steps and across the courtyard very slowly, as though she does not trust it, and kneels down on the cobbles beside you and puts her hand flat on your chest, over your heart, and holds it there."],[null,"\"Well,\" she says. \"You took your time.\""],[null,"That night, when Josette is finally asleep between you in the bed with the sock rabbit in her fist, you touch the scar on Madeleine's forehead and ask her where it came from."],[null,"She is quiet for a long time. Then she tells you about June."]],"choices":[],"gotos":[[null,"exode_1"]],"end":false},"exode_1":{"chapter":"Interlude — Madeleine's Road","effects":[],"paragraphs":[[null,"(You are Madeleine Brandt. It is the tenth of June 1940.)"],[null,"The government has left Paris. Nobody announced it. You only know because the ministries on the left bank are burning their files, and the smoke has been going up all morning, black and white, and pieces of burned paper are drifting down over the eleventh arrondissement like snow. Josette catches one on the landing. It says Ministère de la Guerre and part of a list of names."],[null,"Then in the afternoon the sky turns black. Not smoke from files: something bigger. The fuel depots along the Seine have been set on fire, so the Germans can't have them, and a great cloud of oily soot rolls over the whole city, so that at three o'clock in the afternoon it is dark as evening and the pigeons go to roost and the sparrows stop singing, and when you wipe Josette's face the cloth comes away black."],[null,"Everybody is leaving. The whole building, the whole street. People are tying mattresses to the roofs of cars, loading prams, wheelbarrows, bicycles, handcarts. The Germans will be in Paris in four days. Everybody remembers the stories from 1914, from Belgium: the burned villages, the raped women, the children with their hands cut off. Nobody knows which stories were true."],[null,"Rivka Lewin comes down from the third floor with the baby on her hip and Sarah holding her skirt. \"Isaac won't go,\" she says. \"He says somebody has to stay for the shop. He says it's the Germans, not the Cossacks.\" Her face is white. \"I'm going. Are you going?\""],[null,"Your mother lives in Gien, on the Loire, a hundred and fifty kilometres south. Everybody says the army will hold the Germans on the Loire."]],"choices":[[null,"Go to the Gare d'Austerlitz and try to get a train south.","exode_train",[]],[null,"Load the pram and walk south with Rivka and the children.","exode_walk",[]]],"gotos":[],"end":false},"exode_train":{"chapter":null,"effects":[],"paragraphs":[[null,"The Gare d'Austerlitz is the end of the world."],[null,"There are a hundred thousand people in front of the station. They fill the courtyard, the boulevard, the quays, sitting on suitcases, standing, waiting. Nobody can get in. The gates are locked and behind them soldiers with rifles. Somebody says there will be a train at six. Somebody says the last train went yesterday. A woman has fainted and is lying on her suitcase and nobody can get to her. A man on the railings above the crowd is shouting that the trains are reserved for the government, for the rich, for the Jews, for the Freemasons, depending on what kind of man he is."],[null,"You stand there in the black heat for five hours with Josette on your hip and Rivka beside you with Moïse and Sarah. At eleven o'clock at night, a gate opens and the crowd surges, and you are lifted off your feet and carried twenty metres, Josette screaming, and you think: we'll die here, crushed in front of a station, and then the gate closes again."],[null,"You go home. At five in the morning, you load the pram."]],"choices":[],"gotos":[[null,"exode_walk"]],"end":false},"exode_walk":{"chapter":null,"effects":[],"paragraphs":[[null,"You walk out of Paris through the Porte d'Orléans on the eleventh of June with six million other people."],[null,"That is the number the historians will give, later. Six to eight million people, a quarter of the population of France, on the roads in June 1940, fleeing from Belgium, from the north, from Paris, south, towards the Loire, towards anywhere. You will not know the number. You will only know the road: the N7 south of Paris, solid with people from one side to the other, moving at the speed of an old woman with a stick."],[null,"Every kind of vehicle. Lorries from the Paris bus company. Hearses. Ice-cream carts. Bakers' vans. Taxis with their meters still running. Farm carts pulled by enormous Belgian horses, with grandmothers sitting on top of the furniture. Cars with mattresses tied on top, because people say a mattress will stop a bullet from an aeroplane. Cars out of petrol, pushed by the family, then pushed into the ditch. Soldiers without officers, without rifles, walking south with everybody else, faces grey, not looking at anyone."],[null,"You push the pram, which contains Moïse, two suitcases, a bag of bread and a tin of sardines. Rivka carries Josette when she gets tired, and you carry Sarah. In the first day you go twenty kilometres. In the second day, twelve."],[null,"The sun is very hot. There is no water. The farmers along the road sell it, at a franc a glass, and then two francs, and then they stop selling it and lock their wells."]],"choices":[],"gotos":[[null,"exode_strafe"]],"end":false},"exode_strafe":{"chapter":null,"effects":[],"paragraphs":[[null,"On the third day, south of Étampes, the planes come."],[null,"There are three of them, coming up the road from the north, very low, and very loud, and you see them because the people a kilometre ahead of you begin to run into the fields on both sides of the road like a wave breaking. You have time to think: they're not ours. And then the sound arrives: the scream of the engines and then the guns, a sound like canvas being torn very fast, very loud."],[null,"You throw yourself into the ditch with Josette under you. You see Rivka falling with Moïse. You see Sarah standing in the road, alone, frozen, with her mouth open, and the bullets coming up the road towards her in two lines of little spurts of dust, and a man in a straw hat throws himself at her and knocks her into the ditch on the other side of the road, and the lines of dust go over the place where she was."],[null,"The planes go up the road and turn and come back."],[null,"Then they are gone, and in the silence afterwards a horse is screaming, and somebody is calling a name over and over."]],"choices":[],"gotos":[[null,"exode_after"]],"end":false},"exode_after":{"chapter":null,"effects":[["stat","hope","-",2]],"paragraphs":[[null,"Sarah is alive, under the man in the straw hat. Rivka is alive, with Moïse, in the ditch. Josette is alive, under you. You have a cut on your forehead where your head hit a stone, and you don't feel it for an hour."],[null,"Twelve people are dead in your stretch of road. You count them later because you cannot stop yourself. A soldier. An old couple in a cart, with their horse. Two boys on bicycles. A girl of about fifteen who is lying on her face in the road holding a canary in a cage, and the canary still alive."],[null,"And a young woman in a yellow dress, lying on her back in the middle of the road, with her arms out. Beside her is a little boy of about four, sitting in the dust in short trousers, pulling at her sleeve. \"Maman. Maman. Get up, Maman.\" He is not crying. He is cross with her. \"Maman, get up, we have to go.\""],[null,"Nobody knows her. People go past. They have their own dead and their own children and the Germans are coming. The little boy looks up at you."],[null,"\"Are you a maman?\" he says. \"Can you make her get up?\""],[null,"He says his name is Pierrot. He doesn't know his surname. He knows that he lives \"in the house with the blue door\" in a town that might be Lille or might be somewhere else."]],"choices":[[null,"Take Pierrot with you.","exode_pierrot",[["set","pierrot"],["stat","food","-",1]]],[null,"Take him to the Red Cross post in the next village, where there are nuns who are collecting lost children.",
