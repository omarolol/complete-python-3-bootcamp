 except what the Quakers and the Red Cross are allowed to bring. There are eight toilets, and they are blocked by the first afternoon. There is no water except one hydrant. There are four doctors."],[null,"On the eighteenth you go there. You don't know why. You tell Madeleine you are going to work and you take the Métro to Grenelle and walk along the boulevard under the elevated railway, and there it is."],[null,"You hear it before you see it. Eight thousand people make a sound, even behind walls. It is not screaming. It is lower than that, a kind of roar, like the sea. And the smell, which reaches you a hundred metres away in the hot street."],[null,"There are French gendarmes all round it, in a cordon, keeping order."]],"choices":[],"gotos":[[null,"stadium_2"]],"end":false},"stadium_2":{"chapter":null,"effects":[],"paragraphs":[[null,"People are standing on the other side of the street, watching. Not many. A few dozen. Some are relatives, you can tell, standing very still with packages in their hands. Some are just curious. A woman with a shopping basket. A boy on a bicycle. A man in a good suit who looks at his watch."],[null,"A gendarme is standing by the side entrance, smoking. He is young, with a broad red country face."],[[[["flag","all_taken",true],["flag","parents_safe",true]]],"Isaac and Rivka are in there. Isaac and Rivka and, maybe, Moïse."],[[[["flag","all_taken",true],["flag","parents_safe",true],["flag","moise_safe",false]]],"Not Moïse. Moïse is at home, asleep on your bed."],[[[["flag","all_taken",false]]],"Isaac and Rivka and Moïse and Sarah are in there."],[[[["flag","parents_safe",false]]],"The Lewins are not in there. They are at home, in your flat, with the curtains drawn. But the Grinbergs from number 60 are in there. The Kaplans. The woman with the baby."]],"choices":[[null,"Try to bribe the gendarme to carry in a parcel of food and water.","stadium_bribe",[["stat","money","-",150],["stat","food","-",1]]],[null,"Just stand and watch, so that someone has seen it.","stadium_watch",[]]],"gotos":[],"end":false},"stadium_bribe":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"The young gendarme looks at the money for a long time. Then he takes it and the parcel, without a word, and goes inside, and comes back out after twenty minutes, with the parcel gone. He doesn't look at you. He just puts a folded piece of paper in your hand as he walks past, and goes back to his post."],[[[["flag","parents_safe",false]]],"It's from Esther Grinberg, from number 60. Two lines in pencil, on the back of a bus ticket. \"Monsieur Brandt, thank you, the bread is for the children. Please tell my husband in the Loiret camp that we are here. God will repay you.\""],[[[["flag","parents_safe",true]]],"It's from Rivka. Two lines in Yiddish, which you can almost read, and one line underneath in French, in large clumsy capitals, for you: \"THANK YOU. TELL SARAH TO BE GOOD. MAMA.\""],[[[["flag","all_taken",false]]],"Underneath, in a child's handwriting, in pencil: \"Josette, I have the bread, it is very hot in here. Your friend Sarah Lewin.\""],[null,"You keep it. You will keep it for the rest of your life, in a book on a shelf, and you will take it out once a year."]],"choices":[],"gotos":[[null,"stadium_after"]],"end":false},"stadium_watch":{"chapter":null,"effects":[],"paragraphs":[[null,"You stand on the pavement across the boulevard for three hours."],[null,"You see a woman on the roof. You don't understand at first what she is doing up there, on the edge of the glass roof, among the iron girders. Then she jumps. The gendarmes run. People across the street turn away. The woman with the shopping basket says, \"My God, my God,\" and walks off very quickly towards the Métro."],[null,"You see a Red Cross nurse come out of the side entrance, sit down on the kerb, put her head between her knees, and vomit into the gutter. Then she wipes her mouth with her handkerchief, stands up, straightens her cap, and goes back in."],[null,"You see the buses come, empty, and leave, full, on the fifth day, for the camps in the Loiret, at Pithiviers and Beaune-la-Rolande."],[null,"Somebody has to remember it. You stand there so that you can remember it. You don't know if that is courage or cowardice. It feels like both."]],"choices":[],"gotos":[[null,"stadium_after"]],"end":false},"stadium_after":{"chapter":"August 1942","effects":[["set","annette"]],"paragraphs":[[null,"In August you hear the rest of it from a nurse called Annette Monod, who works for the Red Cross and who has come back from Beaune-la-Rolande, and who sits in the workshop drinking chicory coffee with hands that will not stop shaking."],[null,"The families from the Vel d'Hiv were taken to the camps in the Loiret: Pithiviers and Beaune-la-Rolande, wooden barracks in the fields, behind barbed wire. There, in the first days of August, the parents were deported. To the East. To \"labour in Poland.\" Without their children."],[null,"\"They separated them,\" she says. \"Gendarmes. French gendarmes. With hoses. With rifle butts. The mothers were holding on to them and the gendarmes were tearing their clothes off them to get the children loose. Three thousand children, Monsieur. Three thousand children, left on their own in the camp, the youngest two years old. They didn't know their own names. We tried to write their names on their clothes. They would swap clothes. They would lose their name tags. In the night they cried for their mothers, all of them at once.\""],[null,"Two weeks later, in the second half of August, the children were deported too, from Drancy, in convoys of a thousand, each with a few hundred adults mixed in, so that it would look like families. To the East."],[null,"\"The Germans in Berlin wanted the children,\" she says. \"Laval offered them. That's what they say. Laval said, take the children too.\""],[[[["flag","moise_safe",true],["flag","parents_safe",true]]],"Isaac and Rivka Lewin leave Pithiviers on the convoy of the third of August 1942, convoy number 14, for Auschwitz. You will learn the number after the war, from a list. Moïse Lewin, aged two years and eleven months, leaves Drancy on the convoy of the twenty-sixth of August, convoy number 24. He is listed as \"Lewin, Moïse, born Paris 1939, without known parents.\" He still has his wooden horse, Annette thinks. She thinks she remembers a little boy with a wooden horse, but there were so many, and they all had something."],[[[["flag","moise_safe",false],["flag","parents_safe",true]]],"Isaac and Rivka Lewin leave Pithiviers on the convoy of the third of August 1942, convoy number 14, for Auschwitz. You will learn the number after the war, from a list."],[[[["flag","all_taken",false]]],"Sarah Lewin, aged ten, born in Paris, a French citizen, leaves Drancy on the convoy of the twenty-sixth of August with her brother. She is listed as looking after him. She has her satchel. The note she wrote to Josette from the Vel d'Hiv is in your pocket."],[null,"Annette finishes her coffee."],[null,"\"I'm a Protestant,\" she says. \"From the Cévennes. My grandmother told me about the Camisards, the dragoons, how they hunted our people in the mountains three hundred years ago. I never believed her, about the cruelty. I thought she exaggerated.\" She puts the cup down. \"If you ever have a child to hide, Monsieur Brandt, a Jewish child, come to me. There are places. In the mountains. There's a village called Le Chambon-sur-Lignon. They've been hiding people there since the dragoons.\""]],"choices":[],"gotos":[[null,"hiding"]],"end":false},"hiding":{"chapter":"Part Seven — The Year of Hiding","effects":[],"paragraphs":[],"choices":[],"gotos":[[[[["flag","sarah_safe",false]],[["flag","moise_safe",false]]],"hiding_child"],[null,"hiding_alone"]],"end":false},"hiding_child":{"chapter":null,"effects":[["stat","food","-",2]],"paragraphs":[[null,"The child who lives in your flat does not exist."],[[[["flag","sarah_safe",false]]],"Her name is no longer Sarah Lewin. In the street, if anyone asks, she is Suzanne, a cousin from Alsace whose mother is ill. She has a card."],[[[["flag","sarah_safe",false],["flag","forger",false]]],"You made the card yourself, by candlelight, with a stamp cut from an eraser. It is the best work you have ever done."],[[[["flag","sarah_safe",false],["flag","forger",true]]],"Lucien got the card for her, from the same nervous man with the dyed moustache, for three hundred francs you did not have."],[[[["flag","moise_safe",false]]],"Moïse is three. He does not need a card. He needs nobody to remember that the Lewins had a baby."],[null,"Mostly the child does not go out. You can't risk it: there are too many people in the quarter who knew the Lewins, and Madame Pujol in her lodge, and the informers that every street now has, the ones who write the letters. The Germans in Paris receive three to five thousand anonymous letters of denunciation a day, Lucien says. Most of them are signed \"a good Frenchman.\""],[null,"So the child lives inside four rooms. The windows on the street side have the curtains drawn day and night. The child walks in socks. The child learns to be silent when the bell rings, to go into the box room and get under the bed, without being told, without a sound, in less than ten seconds. You practise it, like a fire drill. Josette times it with your watch."],[null,"There is no ration card for a child who does not exist. Everybody eats less."],[[[["flag","sarah_safe",false]]],"Sarah does not ask about her parents. Not once, in the whole of 1943. She does her schoolwork with Josette every evening, from Josette's books, and gets better marks than Josette, and Madeleine marks them, and pins them on the wall. She reads every book in the workshop. She reads the Heine, in German, with a dictionary, and asks you what \"Ich weiß nicht, was soll es bedeuten\" means, and you tell her: I don't know why I am so sad."]],"choices":[],"gotos":[[[[["flag","sarah_safe",false]]],"hiding_question"],[null,"sto"]],"end":false},"hiding_question":{"chapter":null,"effects":[],"paragraphs":[[null,"One evening in March, Sarah looks up from her book and says, \"Monsieur Emil. When the war is over, will Mama and Papa come and find me here? Or should I go and find them?\""]],"choices":[[null,"\"They'll come here. They know where you are.\"","hiding_lie",[]],[null,"\"I don't know, Sarah. Nobody knows where they took them. But we will look, together, when it's over.\"","hiding_truth",[]]],"gotos":[],"end":false},"hiding_lie":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"She nods, satisfied, and goes back to her book. That night you hear her through the wall, talking to Josette, telling her what she will say to her mother when she comes: that she has learned German, that she has read Victor Hugo, that she has been good."],[null,"Madeleine says, \"You'll have to tell her one day.\" You say, \"When I know.\" She says, \"You do know, Emil. We all know.\" You say, \"I don't know. Nobody has told me. Nobody has written to us from the East. Nobody knows.\" You both know you are lying to yourselves too."]],"choices":[],"gotos":[[null,"sto"]],"end":false},"hiding_truth":{"chapter":null,"effects":[],"paragraphs":[[null,"She looks at you for a long time with her mother's eyes. Then she says, \"Yes. That's what I thought.\" She goes back to her book. She does not cry."],[null,"That night, though, she gets into bed with Josette for the first time in months, and you hear them whispering until two in the morning."],[null,"The next morning you find, on your workbench, a list in Sarah's best handwriting. \"Places to look for Mama and Papa after the war.\" It has twelve items. The first is \"Drancy.\" The last is \"Poland (all of it).\""],[null,"You put the list in the Heine."]],"choices":[],"gotos":[[null,"sto"]],"end":false},"hiding_alone":{"chapter":null,"effects":[["stat","hope","-",2]],"paragraphs":[[null,"The Lewins' flat on the third floor stays empty all autumn. Then, in December, a man from a French office for \"Jewish affairs\" comes with a locksmith and a removal van, and they empty it: the sewing machine, the beds, the table, the samovar, Moïse's cot, Sarah's school books, everything. It goes to a warehouse in the rue du Faubourg-Saint-Martin. Some of it goes to bombed-out German families in Hamburg. Then the Prefecture lets the flat to a family from Brittany, a railwayman and his wife and three children, who are very nice, and who never ask, and who find a wooden horse behind the radiator in the spring, and give it to Josette."],[null,"Josette has stopped talking to you."],[null,"Not completely. She says good morning and good night. She says please and thank you. She answers questions. But she does not talk to you, the way she used to, the long stories about the sock rabbit and the girls at school. She doesn't sit on your knee. She is ten years old and she looks at you sometimes with a look you know, because you have seen it in the mirror."]],"choices":[[null,"Try to talk to her about it.","alone_talk",[]],[null,"Leave her be. She needs time.","alone_leave",[]]],"gotos":[],"end":false},"alone_talk":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"You find her in the courtyard, sitting on the edge of the dry fountain, with the wooden horse."],[null,"\"Josette.\""],[null,"She doesn't look up."],[null,"\"I think about them every day,\" you say. \"Every day. I think I should have done more. I think I was afraid. I was afraid for you.\""],[null,"She turns the horse round in her hands. Then she says, \"I was afraid too, Papa. When they came. I was afraid they would take me.\" She looks up. \"Is that bad?\""],[null,"\"No,\" you say. \"No. It's not bad. Being afraid isn't bad.\""],[null,"\"Then what's bad?\""],[null,"You don't know how to answer her. You sit with her on the fountain until it's dark, and she lets you hold her hand."]],"choices":[],"gotos":[[null,"sto"]],"end":false},"alone_leave":{"chapter":null,"effects":[],"paragraphs":[[null,"You leave her be. You tell yourself it will pass. It does, a little. By the summer she will sit on your knee again sometimes. But something has gone out of her, and it does not come back, and when she is a grown woman with children of her own she will tell her husband, once, late at night, that the worst thing about the war was not the hunger or the bombs, but the morning she found out that her father was an ordinary man."]],"choices":[],"gotos":[[null,"sto"]],"end":false},"sto":{"chapter":"Compulsory Labour","effects":[],"paragraphs":[[null,"In February 1943 the Vichy government introduces the Service du Travail Obligatoire. Compulsory labour service. Every young Frenchman born in 1920, 1921 or 1922 must go to work in Germany, in the factories, to replace the German workers who have gone to the Eastern Front."],[null,"Jeannot is twenty-one."],[null,"Jeannot, Lucien's red-haired apprentice, who used to whistle Charles Trenet so badly, comes to the workshop with his summons in his hand. He is to report to the Gare de l'Est on the fifteenth of March, with a suitcase. He is going to a factory in Hamburg. Blohm and Voss, the shipyard. You know it. You can see its cranes from the end of the street where you were born."],[null,"\"My mother says I have to go,\" he says. \"She says if I don't go, they'll take my father instead, or stop her ration card. Lucien says go to the maquis. Go up into the hills, with the others. There are hundreds going. Thousands.\" He turns the summons over in his hands. \"I don't even know how to shoot a gun. I'm a printer, Monsieur Emil.\""]],"choices":[[null,"Make him papers. A new name, an older birth date. Then the maquis.","sto_forge",[["set","jeannot_maquis"]]],[null,"Hide him in the workshop until Lucien can find him a way to the maquis.","sto_hide",[["set","jeannot_maquis"],["stat","food","-",1]]],[null,"Tell him to go to Germany. It's safer than the hills. They'll feed him. He'll come back.","sto_go",[["set","jeannot_germany"]]]],"gotos":[],"end":false},"sto_forge":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[[[["flag","forger",false]]],"It takes you two nights. You make him a card in the name of Jean Thibault, born 1917, too old for the STO, and a certificate from a doctor in Belleville saying he has a heart murmur, and a ration card. You age the paper in the oven, rub dust into the edges, fold it a hundred times. When you give it to him, he holds it up to the light and laughs."],[[[["flag","forger",true]]],"You have never forged anything, but you have spent your whole life with paper. You go to Lucien, and Lucien goes to the nervous man with the dyed moustache, and between you, in two nights, you make Jeannot into Jean Thibault, born 1917, too old for the STO, with a heart murmur certified by a doctor who does not exist."],[null,"\"It's better than real,\" he says."],[null,"Three weeks later he is gone. To the south, to the hills of the Limousin, with a cousin of Lucien's, to a camp of young men in the woods who call themselves the maquis, after the scrubland of Corsica where bandits hide. He sends one postcard, of the cathedral at Limoges, with nothing written on it but a drawing of a tree."]],"choices":[],"gotos":[[null,"bombing"]],"end":false},"sto_hide":{"chapter":null,"effects":[],"paragraphs":[[null,"For eleven days Jeannot sleeps on the floor of the workshop, behind the press, where Isaac hid. He reads Lindner's sketchbook from cover to cover. He whistles, very quietly. You tell him to stop whistling. He stops for an hour and starts again."],[null,"On the twelfth day a girl from Lucien's network comes for him, a girl of about eighteen in a beret, with a bicycle, and two forged passes. They go south, to the hills of the Limousin, to a camp of young men in the woods who call themselves the maquis. He sends one postcard, of the cathedral at Limoges, with nothing written on it but a drawing of a tree."]],"choices":[],"gotos":[[null,"bombing"]],"end":false},"sto_go":{"chapter":null,"effects":[["stat","hope","-",1],["set","jeannot_dead"]],"paragraphs":[[null,"He goes. You see him off at the Gare de l'Est on the fifteenth of March, with Lucien, among two thousand other young men with suitcases, and their mothers, and the German band playing on the platform, and the Vichy officials making speeches about the \"relief\" of French prisoners and the \"new Europe.\" Jeannot leans out of the window as the train pulls out and waves, and shouts something you can't hear."],[null,"He writes twice. The food is bad, the work is hard, the city is beautiful, the Alster is like a sea. Then, in August, nothing."],[null,"In late July 1943 the Royal Air Force and the American Air Force bomb Hamburg for a week and a half, day and night. Operation Gomorrah. On the night of the twenty-seventh, in the hot dry summer air, the fires join together into one fire, a firestorm, a hurricane of fire two kilometres high that sucks the air out of the streets and the shelters. Forty thousand people die in Hamburg that week. Most of them are civilians. Women, children, old men. Foreign workers in their barracks, who are not allowed into the shelters."],[null,"You learn later that the street where you were born, and your mother's flat, and Schuster's bakery with its plum cake, are gone. The whole quarter. It burned for days."],[null,"Jeannot does not come back from Hamburg. You never find out exactly how. Lucien does not speak to you for a year."]],"choices":[],"gotos":[[null,"bombing"]],"end":false},"bombing":{"chapter":"Billancourt","effects":[],"paragraphs":[[null,"On Sunday the fourth of April 1943, a spring afternoon, warm, blue sky, you take Josette across Paris to Boulogne-Billancourt to deliver a missal you have rebound for the parish priest of Notre-Dame-de-Boulogne, an old man who pays in eggs from his sister's farm. It is the first sunny Sunday of the year. The racecourse at Longchamp, across the river, is having its spring meeting. The streets are full of people in their best clothes walking down to the Seine."],[null,"At a quarter past two, while you are in the priest's kitchen drinking ersatz coffee, the sirens go."],[null,"Nobody moves. The sirens go every week. The bombers are always going somewhere else."],[null,"Then you hear them. Not like the planes in Madeleine's story, screaming and low. These are high, very high, a deep humming throb that you feel in your teeth, that makes the cups ring on the table, and the old priest says, \"Ah. The Americans,\" and stands up, and takes Josette's hand, and says, \"Come, my child, the cellar, quickly now,\" and halfway down the cellar steps the first bombs hit."],[null,"The target is the Renault factory, which makes lorries for the German army. The American bombers are at seven thousand metres. They miss. Most of the bombs miss. They fall on the streets around the factory, on the houses and the shops and the people walking down to the Seine. They fall on the Pont de Sèvres, where a tram is crossing. They fall on the racecourse at Longchamp, on the crowd at the races."]],"choices":[],"gotos":[[null,"bombing_2"]],"end":false},"bombing_2":{"chapter":null,"effects":[],"paragraphs":[[null,"In the cellar the noise is not a noise. It is a thing that happens to your body. The floor jumps. The walls jump. Dust falls from the ceiling in sheets. The candle goes out. Josette is screaming and you can't hear her, you can only feel her mouth open against your neck. The priest is saying the Our Father very loudly, and you can't hear him either."],[null,"It lasts four minutes."],[null,"When you come up, the kitchen is still there, and the church is still there, but the street is not. The houses on the other side are gone. Not damaged: gone, turned into slopes of brick and plaster and beams, with smoke coming out of them, and a single wall standing with wallpaper on it, and a picture still hanging on the wallpaper, and a bath hanging out of the second floor by its pipes."],[null,"People are coming out of the dust. A woman with no shoes and her dress torn off, walking very slowly down the middle of the street, holding her arms out in front of her as if she is blind. A man sitting on the pavement holding his leg, which is bent the wrong way, saying \"It's nothing, it's nothing.\" A dog. A horse lying in the shafts of a cart with its stomach open."],[null,"And from under the nearest slope of bricks, a voice. A child's voice. Very faint. \"Maman. Maman.\""],[null,"Josette is holding your coat with both hands. She is white with dust, like a ghost, like a statue."]],"choices":[[null,"Dig. Give Josette to the priest and dig, with your hands, until you get to the child.","bombing_dig",[["stat","health","-",1]]],[null,"Take Josette home. Now. Get her away from this.","bombing_leave",[["stat","hope","-",2]]]],"gotos":[],"end":false},"bombing_dig":{"chapter":null,"effects":[["set","dug_monique"]],"paragraphs":[[null,"You give Josette to the priest. You climb on to the slope of rubble and start pulling bricks away with your hands. The bricks are hot. Other men come: a fireman with no hose, two Renault workers in their Sunday suits, a German soldier, a very young one, without his cap, who doesn't say anything, just digs beside you, throwing bricks behind him like a dog."],[null,"It takes an hour and a half. Your hands bleed. The voice gets fainter. You talk to her the whole time. \"We're coming. We're coming, little one. What's your name?\" She says her name is Monique. She is six. She says, \"My legs hurt.\" She says, \"Where is my maman?\" She says, \"I'm cold.\" Then she stops saying anything."],[null,"When you get to her she is lying under a door that has fallen across her at an angle and saved her. She is alive. Her legs are crushed. Her eyes are open. The German soldier lifts her out, very carefully, and carries her down the slope of bricks to the ambulance that has finally come, and the ambulance men put her on a stretcher. Monique. Six."],[null,"Her mother is under the same house. They find her the next day."],[null,"You will never know if Monique lived. You look for her in the lists in the hospital at Boulogne. There are three hundred and twenty-seven dead in Boulogne-Billancourt that afternoon, and eighty-five of them are children, and more than five hundred wounded. The list of the wounded does not have her name, or does, spelled three different ways."],[null,"At the racecourse at Longchamp, eight people are killed who were watching the horses."],[null,"The German soldier shakes your hand, at the end, without a word, with his own hand bleeding as much as yours. Then he puts on his cap, which somebody has found for him, and walks away."]],"choices":[],"gotos":[[null,"bombing_after"]],"end":false},"bombing_leave":{"chapter":null,"effects":[],"paragraphs":[[null,"You pick Josette up and run. You run with her away from the voice, down the street through the dust and the smoke and the people coming out of the ruins, past the woman with her arms out, past the horse, towards the Seine and the bridge and the Métro, and behind you the voice gets fainter, and you do not know if it is because you are running away from it or because it has stopped."],[null,"You get her home. You put her in the bath. The water turns grey with dust. She does not say anything. She does not say anything for two days. On the third day she asks you, in a perfectly ordinary voice, while you're eating soup, \"Papa, was there somebody under the house?\""],[null,"\"I don't know,\" you say."],[null,"\"I heard someone.\""],[null,"\"I don't know, Josette.\""],[null,"Three hundred and twenty-seven people are dead in Boulogne-Billancourt that afternoon. Eighty-five of them are children."]],"choices":[],"gotos":[[null,"bombing_after"]],"end":false},"bombing_after":{"chapter":null,"effects":[],"paragraphs":[[null,"The newspapers under German control print photographs of the dead children in rows, laid out on the floor of a school. \"Anglo-American terror.\" \"The assassins of Billancourt.\" The funerals are enormous. Vichy sends ministers. The Germans send wreaths."],[null,"And still, when Madeleine's sister in Normandy writes to say that the Americans are bombing the railway yards at Rouen and there are dead in the town, she ends the letter, \"May God bless them. May they come soon.\""],[null,"That is the war now. The bombs that kill your children are dropped by the people you are praying for. And you go on praying for them."]],"choices":[],"gotos":[[null,"arrest"]],"end":false},"arrest":{"chapter":"Rue des Saussaies","effects":[],"paragraphs":[[null,"They come for you on the eighteenth of November 1943."],[[[["flag","spy",false]],[["flag","forger",false]]],"Somebody in Lucien's network has been arrested. A young woman, the girl in the beret who took Jeannot south. She held out for two days, which is what you're supposed to do, two days, to give everybody time. On the third day she gave them a list. Your name is on it. Not your address, she didn't know your address, but she knew \"the binder in the eleventh,\" and the Gestapo knows how to use a telephone directory."],[[[["flag","spy",true],["flag","forger",true],["flag","registered",false]]],"There is no reason. Or none that you ever learn. Perhaps somebody in an office in Berlin has finally reached the letter B in the list of expatriated Social Democrats whose files were copied at the Prefecture in 1940. Perhaps someone wrote a letter. \"A good Frenchman.\""],[[[["flag","spy",true],["flag","forger",true],["flag","false_papers",false]]],"It is a control in the Métro, at Châtelet. A German in a leather coat stops everybody coming through the corridor and asks for papers. You give him Émile Brun of Colmar. He reads it, then asks you a question in German about Colmar, the name of the big church, and you answer, perfectly, too perfectly, in a Hamburg accent so thick you could spread it on bread. He laughs. \"Colmar,\" he says. \"Of course.\""],[[[["flag","spy",true],["flag","forger",true],["flag","no_papers",false]]],"It is a control in the Métro, at Châtelet. A German in a leather coat stops everybody coming through the corridor and asks for papers. You don't have any. You have never had any. Three years you have managed without, and on the eighteenth of November 1943, in the corridor at Châtelet, it stops working."],[null,"They take you to the rue des Saussaies, near the Élysée palace. Before the war it was the French Ministry of the Interior. Now it belongs to the German security police, the Sicherheitspolizei and the SD, which everybody in Paris simply calls the Gestapo. On the walls of the cells, prisoners have scratched their names and dates with their fingernails, layers of them, hundreds of them. You add yours on the second night."]],"choices":[],"gotos":[[null,"arrest_2"]],"end":false},"arrest_2":{"chapter":null,"effects":[],"paragraphs":[[null,"The man who interrogates you is called Stoltenberg. Kriminalsekretär Wilhelm Stoltenberg. He is a little older than you, bald, plump, in a cardigan with leather patches on the elbows, and on his desk there is a photograph of a woman and three daughters in a garden, and a pot of geraniums. He offers you a cigarette. He speaks to you in German. He has an accent you would know anywhere."],[null,"\"Eimsbüttel,\" he says, smiling. \"I'm from Eimsbüttel, Herr Brandt. Fruchtallee. You're from the Grindelallee, no? We were practically neighbours. Did you know Schuster's, on the corner of the Rutschbahn? The plum cake? Ach. All burned now. The English.\" He shakes his head. \"All burned. My mother's house too. Well. We are both orphans of Hamburg now.\""],[null,"He is pleasant for an hour. He wants to know about Lucien, about the network, the forged papers, the printing press, the names. He is sure you don't want to be involved in this. He is sure you are a decent man who has been led astray by Communists. He has a file in front of him, and the file has your whole life in it, from the Social Democratic Party in 1931 to the poster at Colombes to the red ink. He reads parts of it aloud, fondly, like a family album."],[null,"Then he says, \"Well, I can see we're going to need to do this the other way,\" and rings a bell, and two men come in who are not pleasant."]],"choices":[],"gotos":[[null,"arrest_3"]],"end":false},"arrest_3":{"chapter":null,"effects":[["stat","health","-",2]],"paragraphs":[[null,"You will not, afterwards, describe what happens in the room in the basement. Not to Madeleine. Not to anybody. There is a bathtub. There is cold water. There are the two men, who are French, as it happens, men from the Carlingue, the French gangsters who work for the Gestapo, who talk to each other about football while they do it. There is the moment, many times, when the water closes over your face and you know that this time you will die, and then you don't."],[null,"There are your hands. They know you are a bookbinder. They know you need your hands. One of them puts your right hand flat on the edge of the bath and takes out a pair of pliers and asks Stoltenberg in French, \"Which fingers, chief?\" And Stoltenberg says, kindly, in German, \"Herr Brandt, which fingers?\""],[null,"Between sessions they leave you in the cell. You lie on the floor and look at the names scratched on the wall. There is one near the floor, very small, that says: Here I was not afraid. Jacques. 1942. You don't know if it is a boast or a prayer."],[null,"On the third day, Stoltenberg says, \"One name, Herr Brandt. Give me one name, and you can go home to your little wife. Lucien Marchal, perhaps? We know about him already. You'd only be confirming.\""]],"choices":[[null,"Give them Lucien. They already know. You only confirm. You go home to Madeleine.","arrest_betray",[["set","betrayed_lucien"],["stat","hope","-",4]]],[null,"Give them nothing. Nothing.","arrest_silent",[["stat","health","-",1],["stat","hope","+",2]]],[[[["stat","hope",">=",3]]],"Give them a false lead: an address that you know has been empty since 1942, and the name of a man you know is dead.","arrest_false_lead",[["stat","health","-",1]]]],"gotos":[],"end":false},"arrest_betray":{"chapter":null,"effects":[["set","lucien_arrested"]],"paragraphs":[[null,"You say, \"Lucien Marchal. The rue de Belleville. The print shop behind the dairy.\" You say it to the floor."],[null,"Stoltenberg writes it down, and says, \"There. That wasn't so difficult,\" and pats your shoulder, and goes out. They leave you in the cell for another four days. Then they release you, at dawn, on the pavement in the rue des Saussaies, without your belt or your shoelaces."],[null,"You walk all the way to Belleville, holding up your trousers, with your shoes flapping. You run the last part. The print shop is sealed with a paper strip with a German eagle on it. The dairy woman, when she sees you, crosses herself and spits."],[null,"They took Lucien on the second day. Two days before you gave them his name. They already had it. They already had everything. They didn't need you to confirm anything at all. They only wanted to see whether you would."],[null,"You find this out from the dairy woman, who tells it to you as a kindness, to make you feel better. It does not make you feel better. It makes it worse, every day, for the rest of your life."]],"choices":[],"gotos":[[null,"arrest_release"]],"end":false},"arrest_silent":{"chapter":null,"effects":[],"paragraphs":[[null,"You give them nothing."],[null,"You don't know where it comes from. Not courage. You are not a brave man; you have always known that. It is something smaller and more stubborn, a binder's thing, the thing that makes you sew every section by hand even when nobody will ever see the sewing. You will not give them Lucien. You lie on the floor of the cell and recite the names of the tools on your workbench, in order, in German and French: bone folder, Falzbein; awl, Ahle; paring knife, Schärfmesser. When they put you back in the bath you recite them in your head."],[null,"They break two fingers of your right hand, the same two the SA broke in 1933. Stoltenberg seems to find this very interesting when he reads it in your file."],[null,"On the sixth day, he closes the file."]],"choices":[],"gotos":[[[[["flag","kurt_close",false]]],"arrest_kurt"],[[[["flag","hahn_job",false],["flag","spy",true],["flag","emil_arrested42",true]]],"arrest_hahn"],[[[["flag","spy",false]],[["flag","forger",false]]],"ending_deported"],[null,"arrest_fresnes"]],"end":false},"arrest_false_lead":{"chapter":null,"effects":[["set","false_lead"]],"paragraphs":[[null,"You give them an address in the rue Ramponeau, which you know has been empty since a family was taken from it in July 1942, and the name of a man called Marcel, who you know was shot at Mont-Valérien in 1942. You say Marcel did the papers. You say it slowly, after the bath, as though it is being torn out of you, which it is, very nearly."],[null,"They go to the rue Ramponeau. They find nothing, of course, and a concierge who remembers a family who was taken. Stoltenberg is not pleased. You are put back in the bath. But a dead man and an empty flat are not nothing, quite, and Stoltenberg is a busy man with a great many files."],[null,"On the fifth day he closes the file."]],"choices":[],"gotos":[[[[["flag","kurt_close",false]]],"arrest_kurt"],[[[["flag","hahn_job",false],["flag","spy",true],["flag","emil_arrested42",true]]],"arrest_hahn"],[null,"arrest_fresnes"]],"end":false},"arrest_kurt":{"chapter":null,"effects":[["set","kurt_saved_emil"]],"paragraphs":[[null,"On the morning of the seventh day the door of the cell opens and a German lance-corporal is standing there with a stick and a typed order and a Feldwebel from the military police beside him."],[null,"The order, on Wehrmacht notepaper, signed by a major of the Paris garrison, requests the transfer of the prisoner Brandt, Emil, a German national of military age, into military custody, for investigation regarding evasion of military service. It is a better crime than the one you're charged with, and it belongs to the army, and the army and the Gestapo hate each other."],[null,"Stoltenberg reads it twice. \"Brandt,\" he says, looking at Kurt. \"Brother?\""],[null,"\"Cousin,\" says Kurt, without blinking."],[null,"Stoltenberg looks at him for a long time. Then he laughs and signs the paper. \"Hamburg,\" he says. \"We look after our own, eh?\""],[null,"In the street, Kurt walks you round the corner and stops, and holds you up against a wall while you vomit. \"The major's a drunk,\" he says. \"He signs whatever I put in front of him. One day he'll read something.\" He looks at your hand. \"Emil. Your hand.\""],[null,"\"I'll learn to sew with my left.\""]],"choices":[],"gotos":[[null,"arrest_release"]],"end":false},"arrest_hahn":{"chapter":null,"effects":[["set","hahn_saved_emil"]],"paragraphs":[[null,"On the morning of the seventh day Doctor Hahn comes to the rue des Saussaies."],[null,"You don't see it. You only see the result: the door of the cell opening, a guard saying \"Raus,\" a corridor, a staff car in the courtyard with Hahn sitting in the back of it in his greatcoat, looking straight ahead."],[null,"\"I told the Kriminalsekretär,\" he says, as the car moves off, \"that you are indispensable to an operation of the highest importance to the Reichsleiter personally. That you are restoring the library of a cathedral, for the Führer's museum in Linz. Which is very nearly true.\" He looks at your hand. \"My God. Your hand.\""],[null,"\"It was the right one.\""],[null,"\"I'm sorry,\" he says, and to your surprise he is. \"Herr Brandt. I'm sorry. For all of it.\" He turns and looks out of the window at Paris going past, the Madeleine, the Opera. \"We'll lose, you know. The war. Everybody knows it now. They're in Italy. Russia's finished. And afterwards they will say I was a thief. And they'll be right.\""]],"choices":[],"gotos":[[null,"arrest_release"]],"end":false},"arrest_fresnes":{"chapter":null,"effects":[["stat","health","-",1],["stat","hope","-",2]],"paragraphs":[[null,"They send you to Fresnes, the great prison south of Paris, where you share a cell built for one man with three other men, for eleven weeks. A communist railwayman from Villeneuve-Saint-Georges, a black-marketeer who weeps all the time, and a schoolboy of seventeen who was caught writing V for victory on walls. At night you can hear the prisoners in the condemned block singing the Marseillaise, and in the mornings, sometimes, the lorry going out to Mont-Valérien."],[null,"Madeleine is allowed to send one parcel a fortnight. The guards eat half of it. She sends, in a cake, with the raisins, Josette's drawing, which you thought was lost in the rue des Saussaies. Somebody found it on the floor of the room with the bathtub and sent it to her, with no note. You will never know who."],[null,"In February 1944, for no reason that is ever explained, you are released, with the schoolboy, on a morning of sleet, at the gates of Fresnes. You walk all the way home. It takes you six hours."]],"choices":[],"gotos":[[null,"arrest_release"]],"end":false},"arrest_release":{"chapter":"Winter 1944","effects":[["stat","health","+",2]],"paragraphs":[[null,"Madeleine opens the door. She looks at you. She looks at your hand."],[[[["flag","lucien_arrested",true],["flag","spy",true],["flag","forger",true]]],"\"Lucien's gone,\" she says, before you can ask. \"South, to the hills. Somebody in his network was arrested and he got out the same night. He came here first, to warn you, but they'd already taken you.\" She almost smiles. \"He said to tell you you're a stubborn Boche and he loves you.\""],[[[["flag","lucien_arrested",true],["flag","spy",false]],[["flag","lucien_arrested",true],["flag","forger",false]]],"\"Lucien's gone south,\" she says, before you can ask. \"He got out the day after they took you. The girl in the beret gave the list, but the list was old. He's in the Limousin with Jeannot's people. He said to tell you you're a stubborn Boche and he loves you.\""],[[[["flag","lucien_arrested",false]]],"She doesn't say anything about Lucien. She doesn't have to. She knows, the whole quarter knows, that Lucien Marchal was arrested at his press on the twentieth of November and taken to Fresnes and then to the transit camp at Compiègne, and from there in January, in a cattle wagon, to Germany."],[null,"She puts your broken hand against her face and holds it there."],[null,"The children are asleep. You go and look at them."],[[[["flag","sarah_safe",false],["flag","moise_safe",false]]],"Josette, ten. Sarah, twelve. Moïse, four, who has never been outside."],[[[["flag","sarah_safe",false],["flag","moise_safe",true]]],"Josette, ten. Sarah, twelve."],[[[["flag","sarah_safe",true],["flag","moise_safe",false]]],"Josette, ten. Moïse, four, who has never been outside."],[[[["flag","sarah_safe",true],["flag","moise_safe",true]]],"Josette, ten, who doesn't talk to you the way she used to."],[[[["flag","pierrot",false]]],"And Pierrot, seven, who still has nightmares about aeroplanes."]],"choices":[],"gotos":[[null,"south"]],"end":false},"south":{"chapter":"Part Eight — The Plateau","effects":[],"paragraphs":[[null,"In April 1944 Annette Monod comes back."],[null,"She is thinner and harder and she has cut her hair, and she sits in the kitchen without taking off her coat. \"It's getting worse,\" she says. \"Not better. Worse. They're losing, so they're hurrying. The Milice are going through the quarters house by house, with the Gestapo, looking for Jews, for réfractaires, for anybody. They're paying a hundred francs a head to informers. In March they took the children from the UGIF homes, the orphanages. Babies. They're taking babies out of orphanages, Monsieur Brandt.\""],[null,"She looks at you."],[[[["flag","sarah_safe",false]],[["flag","moise_safe",false]]],"\"It's time,\" she says. \"The children have to go to the plateau. To Le Chambon. They'll be safer in the mountains than in a flat in the eleventh with a concierge downstairs. I'll arrange the place. But I need somebody to take them. A father, travelling with his children. It's the best cover there is. And you speak German, if there's a German control.\""],[[[["flag","sarah_safe",true],["flag","moise_safe",true]]],"\"I have two children,\" she says. \"Anna and Jakob Feldman. Seven and five. Their mother was taken in March, from a hiding place in the rue des Écouffes. Somebody wrote a letter. They were in a cupboard; the Milice didn't look. I've had them in a convent for three weeks and the Mother Superior says she can't keep them any longer. They have to go to the plateau. To Le Chambon. I need somebody to take them. A father, travelling with his children. It's the best cover there is. And you speak German.\""],[[[["flag","sarah_safe",true],["flag","moise_safe",true]]],"You think of a little girl on the stairs, in a pinafore with a yellow star. \"Yes,\" you say, before Annette has finished."],[null,"Madeleine says, \"And if they stop you? With your hand, and your accent, and your file?\""],[[[["flag","kurt_helps",false]]],"Kurt can help. You ask him, at the café on the avenue de la Motte-Picquet. He types you a Wehrmacht travel order, an official one, for a \"German civilian employee of the military administration, travelling to Lyon on official business with dependants.\" He stamps it with the orderly room stamp, signs it with the drunk major's signature, which he can do in his sleep now. \"If they look at it too hard, you're dead,\" he says. \"But they won't. Nobody reads anything in this army anymore.\""]],"choices":[],"gotos":[[null,"south_train"]],"end":false},"south_train":{"chapter":"The Train to Lyon","effects":[],"paragraphs":[[null,"You leave from the Gare de Lyon on the eighth of May, at seven in the morning, in a third-class compartment, with a suitcase and a basket of food and the children."],[[[["flag","sarah_safe",false]]],"Sarah, who is Suzanne Brun now, twelve years old, in a school coat and a beret, with her hair in two plaits, holding a book. She has been practising her Alsatian accent with you for a week, and it is very bad."],[[[["flag","moise_safe",false]]],"Moïse, four, who has never been outside in his life that he can remember, and who stands at the window of the compartment with both hands pressed flat against the glass, staring at the world. At a cow. At a river. At a horse. \"Mil,\" he whispers, \"Mil, what's that?\" A church. A bridge. Clouds."],[[[["flag","sarah_safe",true],["flag","moise_safe",true]]],"Anna and Jakob Feldman, seven and five, who do not know you, who have been told by Annette that you are their uncle, and who sit side by side very straight, holding hands, and do not say one word all the way to Dijon."],[null,"The train is very slow. The Resistance has been blowing up the railway lines, and the Allied aircraft have been bombing the bridges and the marshalling yards, so that the train stops for hours in the middle of fields while the line is repaired ahead. At Laroche-Migennes the station has been bombed and you walk two kilometres past the wreckage to another train. At Dijon, a carriage of German soldiers going south is attached to the back."],[null,"At Chalon-sur-Saône, where the old demarcation line used to be, the train stops and there is a control."],[null,"A Feldgendarme, a German military policeman, with the metal crescent hanging on a chain round his neck that the soldiers call the dog collar, comes along the corridor with a French policeman behind him, checking papers."]],"choices":[],"gotos":[[null,"south_control"]],"end":false},"south_control":{"chapter":null,"effects":[],"paragraphs":[[null,"He opens the door of your compartment."],[null,"In the compartment next to yours, a few minutes ago, they took somebody off the train. A man of about sixty, with a beard, travelling alone. You heard the shouting, the protests, \"But my papers are in order,\" and you saw him led along the platform between two soldiers, without his hat, and nobody in your compartment looked up."],[null,"The Feldgendarme holds out his hand. \"Papiere.\""],[[[["flag","moise_safe",false]]],"Moïse sees the uniform and goes very still, the way you taught him. The way you practised in the flat. In ten seconds he has climbed down from the window and pressed himself against the wall under the seat, with his hands over his ears, his eyes shut, absolutely silent. It is what he has been trained to do when strangers come. It is exactly the wrong thing to do on a train."]],"choices":[[null,"Speak to him in German. A friendly man from Hamburg, travelling with his children. Be one of them.","control_german",[]],[[[["flag","kurt_helps",false]]],"Hand him Kurt's Wehrmacht travel order.","control_kurt",[]],[null,"Hand over your papers in silence and pray.","control_silent",[]]],"gotos":[],"end":false},"control_german":{"chapter":null,"effects":[],"paragraphs":[[null,"\"Guten Tag, Herr Kamerad,\" you say, in your own voice, from the Grindelallee. \"Long day, eh? Endless. These French trains.\""],[null,"His eyebrows go up. \"From Hamburg?\""],[null,"\"Eimsbüttel,\" you lie. You have learned that from Stoltenberg. \"Fruchtallee.\""],[null,"\"Ach! I'm from Altona!\" He grins all over his face. He is about forty, with a moustache. He has photographs of children in his wallet, which he shows you: two boys in Hitler Youth uniforms. He is homesick. Did you hear about the bombing? Terrible. Terrible. His sister's flat. And your children? Your children, very nice. Very shy."],[[[["flag","moise_safe",false]]],"He bends down and looks at Moïse under the seat. \"And this little man? Hiding from the Feldgendarme? Afraid of the dog collar, eh?\" He laughs, and reaches into his pocket, and holds out a sweet wrapped in paper under the seat, and after a long time Moïse's small hand comes out and takes it."],[[[["flag","sarah_safe",false]]],"He looks at Sarah, at her plaits and her beret and her dark eyes, for a moment too long. Then he says, \"Pretty. Like her mother, I expect.\" Sarah looks at him and says, in her terrible Alsatian accent, \"Danke schön,\" and he laughs."],[null,"He doesn't look at your papers at all. He gives them back, folded. \"Gute Reise, Landsmann.\""],[null,"When he's gone, you find that your shirt is soaked through, and that your broken hand is shaking so badly you have to sit on it."]],"choices":[],"gotos":[[null,"chambon"]],"end":false},"control_kurt":{"chapter":null,"effects":[],"paragraphs":[[null,"He reads Kurt's travel order. Slowly. All of it. Then he reads it again. He looks at the stamp. He looks at the signature. He looks at you."],[null,"Then he clicks his heels. \"Verzeihung,\" he says. \"Sorry to trouble you.\" He hands it back, and salutes, and goes, with the French policeman behind him, who looks at you with an expression of the purest contempt you have ever seen on a human face. To him you are a German civilian employee of the military administration, travelling on official business, with your children. You are the enemy, in a third-class compartment, eating his country's bread."],[null,"You do not mind. You have never been so glad to be despised."]],"choices":[],"gotos":[[null,"chambon"]],"end":false},"control_silent":{"chapter":null,"effects":[["stat","hope","-",1]],"paragraphs":[[null,"You hand over the papers and say nothing. He reads them slowly. You watch his eyes."],[[[["flag","moise_safe",false]]],"He sees Moïse under the seat. \"What's he doing?\" he says in German, and then in bad French, \"What does the child do?\" You say, in French, \"He's frightened of uniforms. His mother died in a bombing.\" The French policeman says something to him in German, quickly, and he shrugs."],[[[["flag","moise_safe",true]]],"He looks at the children. He looks at you. He asks you something in German, quickly, a trick, to see if you understand it. You keep your face blank, as blank as you have ever kept it in your life, and the French policeman says something to him, quickly, and he shrugs."],[null,"He gives the papers back. He goes."],[null,"Afterwards, in the toilet at the end of the corridor, you are sick into the bowl, and then you go back and sit down and smile at the children, and give them bread and cheese."]],"choices":[],"gotos":[[null,"chambon"]],"end":false},"chambon":{"chapter":"Le Chambon-sur-Lignon","effects":[],"paragraphs":[[null,"The little train from Saint-Étienne climbs up into the mountains for three hours, through pine forests and over gorges, past villages with grey stone churches, and comes out at last on to a high plateau of meadows and fir trees and wind, with the snow still lying in the shadows of the walls in May."],[null,"Le Chambon-sur-Lignon is a village of Protestants, the descendants of the Huguenots who were hunted by the King's dragoons for a hundred years. They remember. They have hidden people since the war began, in farms, in boarding houses, in children's homes, in the presbytery, in the forest: Jews, refugees, réfractaires, anybody who knocked on the door. Thousands. Everybody in the village knows. Nobody in the village talks."],[null,"You are met at the station by a woman of about sixty in a black dress and clogs, with a horse and cart, who calls herself Madame Héritier and doesn't ask your name. \"They'll go to the farm at first,\" she says. \"Then the school, when they're settled. They'll go to church on Sunday. They don't have to pray, but they have to sit in church. It looks better.\" She lifts the children into the cart. \"They'll be all right with us. We've done this before. Two hundred and fifty years we've been doing this.\""]],"choices":[],"gotos":[[null,"chambon_goodbye"]],"end":false},"chambon_goodbye":{"chapter":null,"effects":[["stat","food","+",3],["stat","health","+",1]],"paragraphs":[[[[["flag","sarah_safe",false]]],"At the farm, in the yard, Sarah gets down from the cart and stands in front of you with her book held against her chest."],[[[["flag","sarah_safe",false]]],"\"Monsieur Emil,\" she says. \"Thank you.\" She says it very formally, like a girl at a prize-giving. Then she stops being formal, and she hugs you round the waist the way Josette used to when she was six, and says into your coat, \"When they come back from Poland, Mama and Papa, tell them where I am. Promise.\" And you promise."],[[[["flag","moise_safe",false]]],"Moïse doesn't understand that you are leaving. He is in the barn with a calf, which he thinks is the most important thing that has ever happened. When you go in to say goodbye, he says, \"Mil! Mil! It licked me!\" and you kneel down in the straw and hold him, and he wriggles, wanting to get back to the calf. You let him."],[[[["flag","sarah_safe",true],["flag","moise_safe",true]]],"Anna and Jakob Feldman do not say goodbye. They do not know you. They get out of the cart holding hands and stand in the farmyard looking at the chickens, and Madame Héritier's granddaughter, a girl of about twelve, takes them by the hand and leads them into the kitchen, where there is a smell of bread, and they go without looking back. You are glad. It is better that way. It is better that they don't look back."],[null,"You sleep that night in Madame Héritier's barn. In the morning she makes you eat: bread, eggs, a bowl of milk still warm from the cow, more food than you have seen on one table since 1939. She wraps the rest of the loaf and a cheese in a cloth for the road. Then you walk back to the station alone."]],"choices":[],"gotos":[[null,"dday"]],"end":false},"dday":{"chapter":"The Sixth of June","effects":[],"paragraphs":[[null,"You do not get home for two months."],[null,"On the sixth of June, as you are trying to get a train north from Saint-Étienne, the radio in the station café, turned up very loud, says that the Allies have landed in Normandy. The café goes silent. Then a man stands on a chair and starts to sing the Marseillaise, and a German soldier at the counter puts down his beer very carefully and walks out, and nobody stops singing."],[null,"On the seventh, every railway line in the centre of France is cut. The Resistance blows up everything that night: bridges, tunnels, junctions, signals, telegraph lines. The maquis come down out of the hills in the Limousin, in the Corrèze, in the Dordogne, with Sten guns dropped by English aircraft, and take over towns. They put up tricolours on the town halls. They think the liberation has come."],[null,"It has not. Not yet. The Germans have an armoured division in the south, near Montauban, the SS division Das Reich, fifteen thousand men with tanks, and it has been ordered north to Normandy, through the Limousin, and to clear the roads as it goes."],[null,"You go north by road. A lorry carrying potatoes to Clermont-Ferrand. A cart. Your feet. A gazogène van, the kind that runs on wood smoke, carrying wine. On the ninth you are in Tulle, in the Corrèze, and you arrive the morning after."]],"choices":[],"gotos":[[null,"tulle"]],"end":false},"tulle":{"chapter":null,"effects":[],"paragraphs":[[null,"In Tulle the day before, the maquis had attacked the German garrison and taken the town, and the Das Reich division had come and taken it back."],[null,"Then the Germans went from house to house and took all the men between sixteen and sixty, three thousand of them, and assembled them in the yard of the arms factory. They chose one hundred and twenty. Then they hanged them. From the balconies and the lamp posts and the trees along the avenue de la Gare, one after another, in the afternoon, with ropes from the factory, while the soldiers sat in the cafés and drank and played music on a gramophone. They ran out of rope after ninety-nine."],[null,"The bodies have been taken down by the time you arrive. You see the ropes. Some are still tied to the balconies, cut short, swinging a little in the wind. You see a woman scrubbing the pavement under one balcony with a brush and a bucket. She does not look up."],[null,"A hundred and forty-nine other men were sent to Dachau. Most of them will not come back."],[null,"You walk out of Tulle without stopping. Nobody stops in Tulle. Two days later, travelling north-west on a farm cart towards Limoges, you hear a name for the first time, from a farmer at a crossroads, who says it to the carter and then crosses himself. Oradour."]],"choices":[],"gotos":[[null,"oradour"]],"end":false},"oradour":{"chapter":"Oradour-sur-Glane","effects":[],"paragraphs":[[null,"You reach it on the afternoon of the eleventh of June 1944, the day after."],[null,"It is a market town of about three hundred and fifty people, on a little river, among meadows, with a tramline to Limoges. It had a church, a school for girls and a school for boys, a post office, garages, cafés, a hotel, butchers, bakers, a cobbler, a doctor. On Saturday the tenth, a detachment of the Das Reich division drove into the town at two in the afternoon and told everybody to assemble on the fairground for an identity check. Everybody: the people of the town, the people from the farms around, the people who had come in for the tobacco ration, the children from the schools, the refugees from Lorraine and Spain, a few cyclists passing through."],[null,"They divided them. The men to the barns and garages. The women and children to the church."],[null,"In the barns, the men were shot with machine guns, in the legs first, and the barns set on fire with them inside."],[null,"In the church, the soldiers brought in a box which gave off a choking smoke. When the women and children tried to get out of the doors and windows, the soldiers shot them. Then they set the church on fire with them inside. Two hundred and forty-seven women. Two hundred and five children."],[null,"Six hundred and forty-three people in all. One woman got out of the church through a window behind the altar and lived. Five men got out of a barn."],[null,"Then the soldiers burned the town and drove away."]],"choices":[],"gotos":[[null,"oradour_2"]],"end":false},"oradour_2":{"chapter":null,"effects":[],"paragraphs":[[null,"When you arrive there are men from the villages around, from Saint-Junien and Limoges, and some gendarmes, and a doctor, and a few people from Oradour who were away in Limoges on Saturday and have come home. They are walking through the ruins very slowly. The ruins are still smoking. The roofs are gone, everywhere, so that you can look down from the street into the kitchens: the stoves, the sewing machines, the bedsteads, all burned black, twisted. A doctor's car in the street, burned down to its springs. The tramline."],[null,"The smell is the thing that you will never forget, and never describe to anybody."],[null,"You go into the church. You don't know why. It has no roof. The bell has fallen from the tower and melted on the floor into a black puddle of bronze. There are men in there with handkerchiefs over their faces, working. You see what they are doing. You see a pram, near the altar. It is burned down to its wire frame, and its wheels. You see what is in it."],[null,"You sit down outside on the wall of the churchyard."],[null,"A man comes and sits beside you. He is about seventy, with a bicycle. He came this morning, he says, from Saint-Junien, looking for his daughter and her two little boys, who lived here, over the post office. He has been looking all day. He hasn't found them. He hasn't found anybody he could recognise. He says, \"My daughter's boys were six and three. The little one had red hair. Did you see a little one with red hair?\""],[null,"You did not."],[null,"\"They were Germans who did this,\" he says. \"But they say there were Alsatians with them, too. Frenchmen. Our own. Forced into it, they say.\" He looks at you. \"Where are you from, Monsieur? You have an accent.\""]],"choices":[[null,"Tell him the truth. \"I'm German.\"","oradour_truth",[]],[null,"Tell him something else. \"Alsace.\"","oradour_lie",[]]],"gotos":[],"end":false},"oradour_truth":{"chapter":null,"effects":[],"paragraphs":[[null,"He looks at you for a long time. You wait for him to hit you. You would not stop him."],[null,"He doesn't. He says, \"And what are you doing here, then?\" and you tell him: a bookbinder from Paris, a refugee, the children on the plateau, the road home. You don't know why you tell him. He listens to all of it."],[null,"\"Then you must remember this,\" he says. \"You must tell them. In Germany, afterwards, when it's finished. You must tell them what they did here. In German. They won't believe it from us.\""]],"choices":[[null,"Promise. Then help the men from Saint-Junien carry the dead to the graves they are digging in the meadow.","oradour_carry",[["stat","health","-",1],["set","oradour_promise"]]],[null,"Promise. Then take out your pencil and write it all down, every detail, while you can still see it.","oradour_write",[["set","oradour_promise"],["set","testimony"]]]],"gotos":[],"end":false},"oradour_lie":{"chapter":null,"effects":[],"paragraphs":[[null,"He nods. He says, \"Alsace. Poor devils. They say some of yours were in it. Forced. Boys.\" He shakes his head. \"Well. God sees.\""],[null,"He gets on his bicycle and rides off, slowly, into the ruins, to keep looking for a little boy with red hair."],[null,"You sit on the wall for a long time."]],"choices":[[null,"Help the men from Saint-Junien carry the dead to the graves they are digging in the meadow.","oradour_carry",[["stat","health","-",1]]],[null,"Take out your pencil and write it all down, every detail, while you can still see it.","oradour_write",[["set","testimony"]]]],"gotos":[],"end":false},"oradour_carry":{"chapter":null,"effects":[],"paragraphs":[[null,"You carry the dead until it is dark. The men from Saint-Junien do not ask who you are. They give you a handkerchief soaked in vinegar to tie over your face. They give you gloves. They give you, at nine o'clock in the evening, a mouthful of brandy from a bottle that is passed around the whole group, and you drink it, and you go on."],[null,"The graves are in the meadow beside the cemetery. The dead go in wrapped in sheets from the houses that did not burn in the villages around."],[null,"Afterwards you wash your hands in the river Glane, for a long time, and they do not come clean, and you go on washing them until the doctor from Saint-Junien comes and takes you by the arm and leads you away."]],"choices":[],"gotos":[[null,"maquis"]],"end":false},"oradour_write":{"chapter":null,"effects":[],"paragraphs":[[null,"You sit on the wall of the churchyard and write. In the back of Lindner's sketchbook, the blank pages at the end, with a stub of pencil. Everything. The bell. The pram. The car. The tramline. The stove with a pot still on it. The old man with the bicycle and the little boy with red hair. The smell, which you try to describe and cannot. The names you see chalked on the doors by the men searching. The time. The date. The weather: fine, warm, a light wind from the west."],[null,"You fill eleven pages, in small handwriting. You do not know why. You are not a writer. But Lindner said someone would need to see it."],[null,"Twenty years later, those eleven pages will be read aloud by a schoolgirl at a memorial ceremony at Oradour, in French, and then by a schoolboy, in German."]],"choices":[],"gotos":[[null,"maquis"]],"end":false},"maquis":{"chapter":"The Maquis","effects":[],"paragraphs":[[null,"They catch you the next morning on the road to Saint-Junien."],[null,"Six of them, very young, in berets and leather jackets and bits of uniform, with Sten guns and a hunting rifle and armbands that say FFI, the French Forces of the Interior, and the cross of Lorraine. They come out of a wood on both sides of the road, and you put up your hands, and one of them, a boy of about sixteen with a Sten gun, asks you where you are going, and you answer him, and he hears your accent."],[null,"After that it goes very fast."],[null,"They tie your hands behind your back with wire. They walk you into the wood, two kilometres, to a camp in a clearing: tents made of parachute silk, a fire, a dozen more young men, a girl cooking. They are all in a state you recognise. You saw it in Les Milles, in the weeks in May 1940. They have been to Oradour, or they know people who were. They are angry in a way that has nowhere to go."],[null,"They have another prisoner. He is sitting against a tree with his hands tied, in the field-grey uniform of the Waffen-SS, without a cap, with blood on his face. He is about seventeen."],[null,"The leader of the group is a man of about thirty, with a moustache and a policeman's tunic, who looks at your papers and your hand and your face. \"German,\" he says. \"Spy. You were at Oradour. Looking at what your friends did. Taking notes?\" He holds up Lindner's sketchbook, which they took from your bag. \"Drawings. Of what? Positions?\""],[null,"\"We shoot Germans,\" says the boy with the Sten gun. \"After Oradour. That's the rule now.\""]],"choices":[],"gotos":[[[[["flag","jeannot_maquis",false]]],"maquis_jeannot"],[[[["flag","resistance",false],["flag","lucien_arrested",true]]],"maquis_lucien"],[null,"maquis_plead"]],"end":false},"maquis_jeannot":{"chapter":null,"effects":[["stat","hope","+",2]],"paragraphs":[[null,"\"Monsieur Emil?\""],[null,"A red-haired young man has come out of a tent, with a Sten gun on a strap over his shoulder and a pipe in his mouth, unshaven, burned brown by the sun, a different person entirely from the boy who whistled Charles Trenet. He stares at you. Then he starts to laugh."],[null,"\"Jeannot,\" you say."],[null,"\"Jean Thibault,\" he says, \"born 1917. You made me.\" He turns to the leader. \"Capitaine. This is the Boche who made my papers. He's ours. He's the best forger in Paris. He hid Jews. He hid me. Untie him, for God's sake.\""],[null,"They untie you. The boy with the Sten gun is embarrassed and gives you a cigarette. Jeannot sits beside you by the fire and tells you about the maquis, the parachute drops, the English officer with the radio who drinks tea, and the night they blew up the viaduct. He has a girl, the one cooking. Her name is Paulette. He is going to marry her after the war."]],"choices":[],"gotos":[[null,"maquis_boy"]],"end":false},"maquis_lucien":{"chapter":null,"effects":[["stat","hope","+",2]],"paragraphs":[[null,"A big man comes out of a tent, in a beret, with a Sten gun on a strap and a moustache like a broom and ink on his fingers, still, after all this time, ink, and he stops dead and stares at you."],[null,"\"Emil,\" says Lucien Marchal. \"You stupid Boche. What the hell are you doing in the Haute-Vienne?\""],[null,"He takes the wire off your wrists himself, and holds you against his chest so hard your ribs creak, and tells the leader, \"This one is mine. He did our papers in Paris. He's the best forger in France. He kept his mouth shut in the rue des Saussaies. Look at his hand.\" The leader looks at your hand. He gives you back Lindner's sketchbook."],[null,"That night you sit by the fire with Lucien and drink something he says is plum brandy, and he tells you about the escape, the train, the drop zone, the English officer with the radio who drinks tea, and you tell him about Le Chambon and Oradour, and he listens, and puts his big inky hand on the back of your neck, and leaves it there."]],"choices":[],"gotos":[[null,"maquis_boy"]],"end":false},"maquis_plead":{"chapter":null,"effects":[],"paragraphs":[[null,"The leader looks at you, waiting. The boy with the Sten gun has already taken the safety catch off. Behind him, under the tree, the young SS soldier is watching you with wide eyes, as though you are a play."],[null,"You have one chance to make them believe you."]],"choices":[[[[["flag","sketchbook",false]]],"Ask them to look at the sketchbook properly. Les Milles. Colombes. The men in the straw. The rabbi. Oradour.","maquis_sketchbook",[]],[[[["flag","drawing",false]]],"Show them Josette's drawing. PAPA DON'T BE AFRAID. Tell them about your daughter.","maquis_drawing",[]],[null,"Tell them who you are. A bookbinder, a refugee, a Social Democrat, interned by France, tortured by the Gestapo.","maquis_words",[]]],"gotos":[],"end":false},"maquis_sketchbook":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"The leader turns the pages. Slowly at first, and then not slowly. The stadium at Colombes. Men asleep on straw in the brick dust. A guard on a running track with a boy's face. A rabbi saying Kaddish in his overcoat. A man with spectacles lying with his hands folded. A violinist."],[[[["flag","testimony",false]]],"And at the back, in pencil, eleven pages of small handwriting about Oradour, which he reads, and reads again, with his lips moving."],[null,"He stops at the drawing of the internees at Les Milles. \"Les Milles,\" he says. \"Near Aix. The camp for the Boches. My brother-in-law was a guard there in '40.\" He looks up at you. \"You were in it?\""],[null,"\"Nine months.\""],[null,"He looks at you for a long time. Then he takes out a knife and cuts the wire on your wrists."],[null,"\"Ernst Lindner,\" he says, looking at the signature. \"I don't know him.\" He gives you back the sketchbook. \"Keep it safe.\""]],"choices":[],"gotos":[[null,"maquis_boy"]],"end":false},"maquis_drawing":{"chapter":null,"effects":[],"paragraphs":[[null,"You can't reach it with your hands tied. You tell the leader where it is, in your breast pocket, and he takes it out and unfolds it. A man with a brown moustache and a bone folder. A rabbit. PAPA DON'T BE AFRAID. The letters blurred by the river, by the bath in the rue des Saussaies, by five years of being folded and unfolded."],[null,"He looks at it for a long time. He has a wedding ring."],[[[["stat","hope",">=",4]]],"\"How old is she?\" he says. \"Ten,\" you say. \"Eleven in September.\" He folds it up again, very carefully, along the old folds, and puts it back in your pocket himself. Then he cuts the wire on your wrists. \"Go home to her, Boche,\" he says, not unkindly."],[[[["stat","hope","<",4]]],"\"How old is she?\" he says, and you open your mouth to answer and find that you can't, that there is nothing left in you to answer with, that after Tulle and Oradour you have nothing left at all, and you just look at him, and he looks at you, and something in his face closes. He gives the drawing to the boy with the Sten gun. \"Give it to the priest in Saint-Junien,\" he says. \"He'll see it gets to her.\""]],"choices":[],"gotos":[[[[["stat","hope",">=",4]]],"maquis_boy"],[null,"ending_shot_maquis"]],"end":false},"maquis_words":{"chapter":null,"effects":[],"paragraphs":[[null,"You tell them. All of it. Hamburg, the SA, the two broken fingers. Colombes, Les Milles, the brick dust. Occupied Paris. The Lewins. The rue des Saussaies. The plateau. You talk for ten minutes."],[[[["flag","resistance",false]],[["stat","hope",">=",6]]],"The leader listens. At the end he says, \"Who was your contact in Paris? In the network?\" and you tell him a name, a code name, Lucien's, and he goes into a tent where there is a radio, and comes back an hour later, and cuts your wire himself. \"London has heard of you,\" he says. \"Or of somebody like you. That'll do.\""],[[[["flag","resistance",true],["stat","hope","<",6]]],"The leader listens. At the end he shrugs. \"Every German we catch has a story,\" he says. \"Every one of them hated Hitler. Every one of them was a Social Democrat.\" He nods to the boy with the Sten gun."]],"choices":[],"gotos":[[[[["flag","resistance",false]],[["stat","hope",">=",6]]],"maquis_boy"],[null,"ending_shot_maquis"]],"end":false},"maquis_boy":{"chapter":null,"effects":[],"paragraphs":[[null,"The SS soldier under the tree has been listening to all of it. When the others go to eat, he says to you, very quietly, in German, \"Please.\""],[null,"He has an accent you know. Alsatian. Not the Alsatian of a bookbinder from Colmar in a forged identity card, but the real thing, thick, from the villages."],[null,"His name is Joseph. He is seventeen. He is from a village near Sélestat. In February the Germans, who annexed Alsace in 1940, called up his year group into the Waffen-SS, all of them, by force. His father said if he ran they would send the whole family to a camp in Silesia. He has been a soldier for four months. He was not at Oradour, he says. His company was at Tulle. He says he didn't hang anybody. He says he stood guard. He says he only kept order."],[null,"He is crying. \"They'll shoot me. They're going to shoot me tomorrow. They said. Please. Tell them. I'm French. I'm from Alsace. I'm French. I didn't want to. Tell them.\""],[null,"You know what Kurt would say. You know what the woman at the ravine said. You know what the old man on the bicycle at Oradour said, looking for a boy with red hair."],[null,"The leader comes back from the fire. \"We're shooting him at dawn,\" he says to you. \"The SS. You can watch if you like. A German should watch.\""]],"choices":[[null,"Plead for the boy. He is seventeen. Let him be tried, after the war, by a court.","boy_plead",[["set","pleaded_boy"]]],[null,"Say nothing. After Oradour, after Tulle, after the pram in the church, you have nothing to say for him.","boy_silent",[]]],"gotos":[],"end":false},"boy_plead":{"chapter":null,"effects":[],"paragraphs":[[null,"You plead for him. You talk to the leader, and then to all of them, around the fire. You talk about the malgré-nous, the \"despite-ourselves,\" the Alsatians conscripted by force. You talk about courts. About the Republic. About what will make them different from the men who came to Oradour."],[[[["flag","jeannot_maquis",false]]],"Jeannot backs you, loudly, banging the side of a tin mug with a spoon. Then the girl who cooks, Paulette. Then, after an hour, others."],[[[["flag","jeannot_maquis",true],["flag","resistance",false],["flag","lucien_arrested",true]]],"Lucien backs you, loudly, banging the side of a tin mug with a spoon, in the voice he used to use at union meetings. Then, after an hour, others."],[[[["flag","jeannot_maquis",true],["flag","resistance",true]],[["flag","jeannot_maquis",true],["flag","lucien_arrested",false]]],"Nobody backs you for a long time. Then the girl who cooks says, without turning round from her pot, \"My cousin was taken like that. From Mulhouse. He's on the Russian front. He's eighteen.\" And after that it is different."],[null,"In the end, the leader says that the boy will be handed over to the FFI headquarters in Limoges as a prisoner of war, and that the court can decide, after the war. \"If he's lying,\" he says to you, \"and he was at Oradour, then you'll have saved a murderer. Can you live with that?\""],[null,"You don't know. You tell him so."],[null,"Joseph Kieffer is handed over in Limoges a week later. In 1953 a military court in Bordeaux will try twenty-one men who were at Oradour, fourteen of them Alsatians. Joseph is not among them. He goes home to his village near Sélestat in 1946 and becomes a carpenter. Every year, on the tenth of June, he sends a wreath to Oradour, with no name on the card."]],"choices":[],"gotos":[[null,"return_north"]],"end":false},"boy_silent":{"chapter":null,"effects":[["stat","hope","-",2]],"paragraphs":[[null,"You say nothing. You sit by the fire and look at the flames."],[null,"In the morning, at first light, they take him to the edge of the clearing. He is calling for his mother, in Alsatian. They shoot him against a beech tree. Two of them, the boy with the Sten gun and another. It takes two bursts."],[null,"Afterwards the girl who cooks goes and kneels by him and closes his eyes and takes his identity disc and his paybook and puts them in her pocket. \"For his mother,\" she says to you, as though you had asked. \"He was from near Sélestat. My cousin was taken like that. From Mulhouse.\""],[null,"You will never know if he was at Oradour. Nobody will. In 1953 a military court in Bordeaux will try twenty-one men who were, fourteen of them Alsatians, forced into the SS like him, and the trial will tear France in half."]],"choices":[],"gotos":[[null,"return_north"]],"end":false},"return_north":{"chapter":null,"effects":[],"paragraphs":[[null,"You get back to Paris on the fourteenth of July 1944. It takes you a month, on foot, by cart, on a bicycle somebody in the maquis gives you, through a France that is coming apart. You go round the fighting in Normandy, a long way round. You see American aircraft in the sky every day now, hundreds of them, in shining formations, and German columns on the roads, moving only at night, with branches tied to their lorries for camouflage. You see a German convoy strafed on a road near Chartres: lorries burning, horses dead in the ditches, a soldier walking away from it with his face burned, not seeing anything, and the French people in the village watching from their windows and doing nothing."],[null,"You walk into the courtyard of number 64 in the evening."],[[[["flag","pierrot",false]]],"Pierrot sees you first, and screams, the way Josette screamed in 1940, and runs at you."],[[[["flag","pierrot",true]]],"Josette sees you first, from the window, and then she is coming down the stairs, and she is not a child any more, she is nearly eleven and tall and grave, but she comes across the courtyard faster and faster, and the last few metres she runs."]],"choices":[],"gotos":[[null,"liberation"]],"end":false},"liberation":{"chapter":"Part Nine — The Bells","effects":[],"paragraphs":[[null,"In August 1944 Paris rises."],[null,"First the railwaymen strike, on the tenth. Then, on the fifteenth, the police: the same police who arrested the Lewins, who filled the buses in July 1942, who stood guard in a cordon around the Vel d'Hiv. They walk out of their stations and take off their képis and occupy the Prefecture on the Île de la Cité and raise the tricolour over it. There will be a great deal of talk later about the heroism of the Paris police in August 1944. It will be true, and it will also be very convenient."],[null,"On the nineteenth the Resistance calls an insurrection. The FFI come out into the streets with their armbands and their pistols and a few rifles and the weapons taken from the police stations. They put up barricades: paving stones dug out of the street with pickaxes, overturned cars, trees, a tram, a piano, the iron gratings from round the trees, sandbags, bedsteads, a pissoir. Within three days there are four hundred barricades in Paris. There is one at the end of the rue de la Roquette, built across the street from the Café des Sports. Old Ferrand supervises it from his chair with his stick, and is the happiest you have ever seen him."],[null,"The Germans still hold the city with twenty thousand men, tanks, artillery. There is shooting all day: German lorries racing through the streets with soldiers firing from the back, FFI snipers on the rooftops, a tank firing into a building on the boulevard Voltaire, the dead lying in the streets under sheets with candles beside them and flowers."],[null,"On the evening of the twentieth, there is a knock at the door of the flat. A soft knock. Three times."],[null,"It is Kurt."]],"choices":[],"gotos":[[null,"kurt_door"]],"end":false},"kurt_door":{"chapter":null,"effects":[],"paragraphs":[[[[["flag","kurt_rejected",false]]],"You have not seen him for two years. Not since the café on the rue Soufflot, when you put money on the table and walked out."],[null,"He is in civilian clothes, a suit that doesn't fit, too short in the sleeves. He has shaved off his moustache. He is carrying his stick and a small bag. His face is grey."],[null,"\"My unit is pulling out,\" he says. \"Tonight. East. To the Rhine. Or they're going to fight here, to the end, in the streets, nobody knows. The general's been ordered to blow up the bridges. To blow up Paris. Notre-Dame. The Opéra. Everything.\" He laughs, a terrible little laugh. \"I'm not going, Emil. I'm not going
