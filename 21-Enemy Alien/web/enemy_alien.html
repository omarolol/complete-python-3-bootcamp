"exode_nuns",[]]],"gotos":[],"end":false},"exode_pierrot":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"You pick him up. He lets you. He puts his arms round your neck and says, very reasonably, \"When Maman gets up, she'll come and find us,\" and you say yes, and Rivka looks at you over his head and says nothing."],[null,"Before you go, you take the young woman's handbag from beside her. Inside are a few francs, a lipstick, a ration card in the name of Lucie Maréchal, born 1916, and a photograph of her laughing on a beach with a man in a bathing costume and a baby. You put the bag in the pram."],[null,"You will look for Pierrot's family for two years through the Red Cross, through the mairie in Lille, through the newspapers. You will not find them. Pierrot Maréchal will grow up in your flat on the rue de la Roquette, in the little room that used to be the box room, and he will have nightmares about aeroplanes until he is twelve years old."]],"choices":[],"gotos":[[null,"exode_loire"]],"end":false},"exode_nuns":{"chapter":null,"effects":[],"paragraphs":[[null,"The nuns at the next village have turned the school into a shelter. There are forty lost children there already, sitting on the floor, eating bread and jam, and a nun in a white wimple writing names on cards and pinning them to their jerseys. She writes PIERROT, LILLE?, YELLOW DRESS, ÉTAMPES ROAD, 13 JUNE, and pins it on him, and he does not cry, and he does not let go of your hand until she prises his fingers off."],[null,"\"We'll find his people,\" the nun says. \"The Red Cross has lists.\""],[null,"In the years afterwards, the Red Cross will put tens of thousands of lost children back with their families. You will never know whether Pierrot was one of them."],[null,"You still dream about him. In the dream he says, Are you a maman? And you say, No."]],"choices":[],"gotos":[[null,"exode_loire"]],"end":false},"exode_loire":{"chapter":null,"effects":[],"paragraphs":[[null,"On the sixteenth of June you reach the Loire at Gien."],[null,"Gien is burning. The bridge over the river has been bombed and the old town on the north bank, the beautiful old town with its castle and its earthenware factory, is on fire, house after house, and the refugees are crossing the river over what is left of the bridge, single file, under the smoke. You get across. You do not remember how. You find your mother's house on the south bank, in the rue des Bateliers, and it is standing, and your mother is in the doorway in her apron, with a broom, sweeping glass from the step, and she drops the broom."],[null,"Two days later the Germans arrive."],[null,"They come down the road in motorcycles with sidecars, and then lorries, and then horse-drawn wagons, lots of horses, which surprises everybody. They are very young and very dusty and very polite. One of them, a boy with spectacles, gives Josette a bar of chocolate. Josette looks at you before she takes it. You nod. You do not know what else to do. The boy with spectacles says, in careful French, \"War finish. Soon go home. All go home,\" and smiles at you, and you see that he means it."],[null,"On the seventeenth, on your mother's radio, Marshal Pétain says that it is with a heavy heart that he tells the French people that they must stop fighting."]],"choices":[],"gotos":[[null,"exode_home"]],"end":false},"exode_home":{"chapter":null,"effects":[],"paragraphs":[[null,"In July you walk home, with everybody else, in the other direction. The Germans have put up signs in French on the roads telling refugees to return to their homes. There are German field kitchens at the crossroads, handing out soup. There are German soldiers directing traffic. There are photographers from the German propaganda companies taking pictures of German soldiers handing out soup to French children."],[null,"In Paris, the building is still standing. The windows are still there. Isaac Lewin is standing in the courtyard when you come in, in his shirtsleeves, with a tape measure round his neck, as if he had never moved, and when he sees Rivka and the children he sits down on the edge of the fountain and puts his face in his hands, and you take the children upstairs so that they don't have to see their father cry."],[[[["flag","pujol_hostile",false]]],"Madame Pujol stayed through everything, in her lodge. She watches you come in with your pram and says, \"So, you ran. Like the rest of them. While your Boche husband's friends were marching up the Champs-Élysées.\" You do not answer her."],[[[["flag","pujol_hostile",true]]],"Madame Pujol stayed through everything, in her lodge. When she sees you come in, she comes out with a jug of milk. Real milk, from God knows where. \"For the children,\" she says gruffly, and goes back inside."]],"choices":[],"gotos":[[null,"reunion"]],"end":false},"reunion":{"chapter":null,"effects":[],"paragraphs":[[null,"(You are Emil Brandt again. It is October 1940.)"],[null,"\"And then,\" Madeleine says, in the dark, \"I waited. For you. For a letter. For anything. I went to the Prefecture every week. They said you were in the free zone and nothing could be done. I went to the Red Cross. They had you on a list for Les Milles, and then on a list for Bayonne, and then nowhere at all. I thought you were dead, Emil. I thought you were dead and that nobody would ever tell me.\""],[[[["flag","pierrot",false]]],"On the other side of the thin wall, in the box room, a small boy cries out in his sleep, and Madeleine gets up without thinking, and goes to him. You hear her murmuring. When she comes back she says, \"That's Pierrot. He's ours now. I hope you don't mind. I couldn't ask you.\""],[null,"You hold her. You tell her about the train, the dust, the dead. You tell her about Lindner. You show her the sketchbook, by the light of a match, page after page."],[[[["flag","felix_alive",false]]],"You tell her about Felix, walking south towards Marseille with his violin."],[[[["flag","felix_dead",false]]],"You tell her about Felix, and about your straw by the window, and she listens without saying anything and holds your hand harder."],[null,"Outside, at midnight, a German patrol goes by in the rue de la Roquette, boots on cobbles, someone laughing. Curfew. In the occupied zone, the clocks have been set forward to Berlin time."]],"choices":[],"gotos":[[null,"occupation"]],"end":false},"occupation":{"chapter":"Part Four — Berlin Time","effects":[],"paragraphs":[[null,"Within a week you understand that you have come home to a city where you do not legally exist."],[null,"To eat, in occupied Paris, you need a ration card. To get a ration card you need an identity card. To get an identity card, as a foreigner, you need to present yourself at the Prefecture of Police, where, since the autumn, the files of all foreigners have been open to the German security services, who sit in an office on the third floor and drink coffee and read them. Your file says: Brandt, Emil. Born Hamburg 1905. Stateless (expatriated by the Reich, 1934). Social Democrat. Interned 1939. And in red ink: Suspect."],[null,"\"Or,\" says Lucien, at the kitchen table, over a bottle of something brown he has brought that he says is calvados, \"you could be somebody else.\""],[null,"He has a friend at the town hall of the twentieth arrondissement who has blank identity cards, real ones, with real stamps. With the right name, the right birthplace, you would not need to explain the accent. \"Alsace,\" he says. \"Half the Alsatians in Paris speak French like a cow chewing gravel. You'll be Émile Brun, of Colmar. Born 1905. Bookbinder. Married. Very boring. A hundred francs for my friend, for his trouble.\""],[null,"Madeleine looks at you. \"If they catch you with false papers, it's prison. Or worse.\""],[null,"\"If they read his real file,\" Lucien says, \"it's worse anyway.\""]],"choices":[[null,"Become Émile Brun of Colmar. Pay Lucien's friend for false papers.","occ_false",[["stat","money","-",100],["set","false_papers"]]],[null,"Register honestly under your own name. You have done nothing wrong, and you will not start your life here with a lie.","occ_register",[["set","registered"]]],[null,"Do neither. Stay out of every file and live without a card, on Madeleine's rations.","occ_nopapers",[["set","no_papers"]]]],"gotos":[],"end":false},"occ_false":{"chapter":null,"effects":[],"paragraphs":[[null,"Lucien's friend at the town hall is a fat, nervous man called Bonnefoy, with a moustache dyed too black, who meets you in the back of a church and gives you a grey card in a brown envelope without saying a word, and leaves by the side door."],[null,"Émile Brun. Born the eighteenth of March 1905 in Colmar, Haut-Rhin. Profession: bookbinder. Your own photograph, taken at a booth at the Gare de l'Est, looking alarmed."],[null,"You practise the signature at night until it looks like your own. You learn the streets of Colmar from an old Baedeker in the workshop. You memorise the name of a school, a church, a baker. You teach Josette, carefully, that if anyone ever asks, Papa comes from Alsace. She looks at you with her mother's eyes and says, \"But Papa, that's a lie,\" and you have to explain to a seven-year-old why her father must lie, and the explanation does not come out well."]],"choices":[],"gotos":[[null,"occ_statut"]],"end":false},"occ_register":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"You go to the Prefecture and stand for six hours in the queue for foreigners, among Poles and Russians and Spaniards and Hungarians, holding your grey paper and your release from Saint-Nicolas, and when you get to the counter the clerk is the same clerk who used to sigh at you in 1938. He sighs at you now. Some things are permanent."],[null,"He takes your papers into a back office. He is gone for forty minutes. When he comes back he gives you an identity card for foreigners and a ration card and says, without looking at you, \"They copied your file upstairs. The Germans. They copy all of them. I thought you'd want to know.\""],[null,"You walk home with the card in your pocket feeling as if it is warm. It has your own name on it. It is also, you understand, a map to your door."]],"choices":[],"gotos":[[null,"occ_statut"]],"end":false},"occ_nopapers":{"chapter":null,"effects":[["stat","food","-",1]],"paragraphs":[[null,"You stay out of every file. You do not exist. For a while it is even easy. You work in the workshop and you do not go out except at dusk, and you eat from Madeleine's rations and Josette's, which are already not enough for two people, let alone three."],[[[["flag","pierrot",false]]],"Or four, now, with Pierrot."],[null,"Madeleine gets thin. You get thinner. You feel it in the evenings, a hollowness, a light-headed slowness that gets worse as the winter comes."]],"choices":[],"gotos":[[null,"occ_statut"]],"end":false},"occ_statut":{"chapter":"The Census","effects":[],"paragraphs":[[null,"On the twenty-seventh of September 1940 the German military command issues an ordinance: every Jew in the occupied zone must register at the police station of their district. Shortly afterwards, without even being asked, the Vichy government publishes its own law, the Statut des Juifs: Jews excluded from the civil service, from the army, from teaching, from the press, from the cinema."],[null,"The queues at the police station on the rue de l'Orillon go round the block in October. You see them every morning on your way to buy bread: old men in good coats with medals from 1914, women with prams, students, rabbis, families with children, all of them waiting patiently in the rain to put their names on a list for the French police, who have prepared the forms beautifully. There are separate files, colour-coded, by name, by nationality, by street, by profession. It is the best list of Jews anybody has ever made in France."],[null,"Isaac Lewin comes down to the workshop the night before he goes. He sits on the stool by the press, turning his hat in his hands."],[null,"\"I'm going tomorrow,\" he says. \"With Rivka. And the children too, they want the children on the list. You think I shouldn't.\""],[[[["flag","registered",false]]],"You do not know what you think. You, who have just put your own name on a list."]],"choices":[[null,"Tell him not to go. Lists like this are how it started in Germany.","statut_warn",[["set","warned_isaac"]]],[null,"Tell him you don't know. It's his family and his decision.","statut_quiet",[]]],"gotos":[],"end":false},"statut_warn":{"chapter":null,"effects":[],"paragraphs":[[null,"\"Isaac. In Germany it started with lists. First lists, then signs, then the shops. Then they come for you in the night, and they already have the address, because you gave it to them yourself.\""],[null,"He listens. He does not interrupt. When you are finished he puts his hat on his knee and smooths it."],[null,"\"Emil,\" he says. \"In Łódź when I was a boy, the Cossacks came without lists. They didn't need lists. They found us with their noses.\" He shrugs. \"This is France. The country of the Rights of Man. Dreyfus. Zola. If I don't register, I'm illegal. Then they can do anything. If I register, I'm a legal person, with papers, a tailor with a shop, a family, a résident. Legal people have rights here.\" He stands up. \"You worry too much. It's a German habit.\""],[null,"He goes the next morning, with Rivka and Sarah and the baby, and stands in line in the rain for four hours, and comes back with a stamp on his identity card. It says JUIF in red capitals."],[null,"He shows it to you as if it is nothing. Sarah shows you hers too. She is proud of it. Nobody else in her class has one."]],"choices":[],"gotos":[[null,"occ_winter"]],"end":false},"statut_quiet":{"chapter":null,"effects":[],"paragraphs":[[null,"\"I don't know, Isaac.\""],[null,"He nods. \"Nobody knows. That's the trouble.\" He stands, puts his hat on. \"I'll go. It's the law.\""],[null,"He goes the next morning, with Rivka and Sarah and the baby, and stands in line in the rain for four hours, and comes back with a stamp on his identity card. It says JUIF in red capitals. He shows it to you as if it is nothing. Sarah shows you hers too. She is proud of it. Nobody else in her class has one."]],"choices":[],"gotos":[[null,"occ_winter"]],"end":false},"occ_winter":{"chapter":"The Winter of 1940","effects":[],"paragraphs":[[null,"That winter is the coldest in Paris for fifty years. The Seine freezes at the edges. There is no coal. The Germans have taken the coal, and the trains to carry it, and the men to dig it are prisoners in Germany. In the flat, the water in the jug by the bed is frozen in the mornings, and Josette goes to school in two coats and gloves with the fingers cut off, and comes home with chilblains on her hands that crack and bleed."],[null,"There is no food. That is to say, there is food, for the Germans, and for those who can pay for the black market, and for those with relatives in the country. For everybody else there is a ration card, and a ration card in the winter of 1940 means about twelve hundred calories a day, and the shops do not always have enough to honour even that. Madeleine queues for three hours for four hundred grams of meat and gets to the front when there is none left. She queues for potatoes. There are no potatoes. There are swedes, rutabagas, the turnips that farmers used to feed to cattle, and Jerusalem artichokes, and Paris learns a hundred ways to cook them, and all of them taste of rutabaga."],[null,"People keep rabbits in their bathrooms. People keep hens on their balconies. The pigeons in the Luxembourg gardens disappear. So, in some quarters, do the cats."],[null,"In the workshop the glue freezes in the pot."]],"choices":[[null,"Buy on the black market. A man at the Café des Sports can get butter, meat, eggs, at five times the price.","winter40_black",[["stat","money","-",120],["stat","food","+",3]]],[null,"Sell one of Lindner's drawings. A gallery on the rue de Seine buys \"degenerate art\" quietly, for German officers with modern tastes.","winter40_sketch",[]],[null,"Endure it. Everyone else is.","winter40_endure",[]]],"gotos":[],"end":false},"winter40_black":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"The man at the Café des Sports is called Dédé and wears a camel-hair coat and two rings. He meets you in the toilets, where he keeps a suitcase, and sells you a kilo of butter, half a ham, two dozen eggs, a sack of potatoes and a bag of real coffee, and smiles at you with a gold tooth."],[null,"\"Where does it come from?\" you ask."],[null,"\"From people who have it,\" Dédé says, \"to people who can pay. That's what a market is, Monsieur.\""],[null,"That night, Madeleine fries potatoes in butter and the smell fills the stairwell. Josette eats so fast she is sick, and then eats again. You give some potatoes and some eggs to Rivka for Sarah and the baby, and Isaac comes down and kisses your hand, which embarrasses you both terribly."],[null,"You are not proud of where the money goes. In the queue for bread the next morning a woman in front of you faints from hunger and has to be carried out."]],"choices":[],"gotos":[[null,"occ_hahn"]],"end":false},"winter40_sketch":{"chapter":null,"effects":[],"paragraphs":[[[[["flag","sketchbook",true]]],"You remember that the sketchbook did not survive the river. There is nothing to sell. You endure, like everyone else."],[[[["flag","sketchbook",false]]],"The gallery on the rue de Seine is warm and smells of turpentine and expensive cigars. The owner, a tall Frenchman with a monocle, turns the pages of Lindner's sketchbook slowly, very slowly, and stops at a drawing of a guard on the running track at Colombes."],[[[["flag","sketchbook",false]]],"\"Lindner,\" he says. \"Ernst Lindner. My God. I thought he was dead.\" He looks up. \"He's very fashionable, you know. Among a certain kind of German officer. The cultivated ones. They hang this sort of thing in their bathrooms where Berlin won't see it. I'll give you four hundred francs for that one. And four thousand for the whole book.\""],[[[["flag","sketchbook",false]]],"You sell him one drawing: a study of three men asleep on straw at Les Milles, their faces turned away. You never forget it. Ten years later you will see it reproduced in an American magazine, in an article about Ernst Lindner, \"the lost Expressionist,\" captioned Sleepers, c. 1939, private collection, and you will put the magazine down and go outside."]],"choices":[],"gotos":[[[[["flag","sketchbook",false]]],"winter40_sold"],[null,"winter40_endure"]],"end":false},"winter40_sold":{"chapter":null,"effects":[["stat","money","+",400],["stat","food","+",2],["stat","hope","-",1],["set","sold_sketch"]],"paragraphs":[[null,"That night there is meat in the flat. Madeleine does not ask where it came from. Later, when the children are asleep, she sits with the sketchbook open on her lap at the place where the page was torn out, and runs her finger along the torn edge."]],"choices":[],"gotos":[[null,"occ_hahn"]],"end":false},"winter40_endure":{"chapter":null,"effects":[["stat","health","-",2],["stat","food","-",1]],"paragraphs":[[null,"You endure. Everyone does. You queue. You sleep in your clothes. You burn the offcuts of leather and board from the workshop in the kitchen stove, then the shelves, then a chair. You watch your daughter's wrists get thinner. You get a cough in January that does not go away until April."],[null,"In February Rivka gives Josette a pair of mittens she has knitted from the unravelled wool of her own winter cardigan, and Josette refuses to take them off even to sleep."]],"choices":[],"gotos":[[null,"occ_hahn"]],"end":false},"occ_hahn":{"chapter":"Doctor Hahn","effects":[],"paragraphs":[[null,"In March 1941 a German officer comes into the workshop."],[null,"You are at the bench, sewing sections, and the bell over the door rings, and you look up and there is a field-grey uniform, a Sonderführer's insignia, an officer's cap held politely in the hand, spectacles, a long sad clever face. He is about fifty. He is carrying a parcel wrapped in newspaper."],[null,"\"I'm told you are the best binder in the eleventh arrondissement,\" he says in careful, perfect French. \"A colleague recommended you. You rebound his Montaigne. Exquisite work. I have a Goethe.\""],[null,"He unwraps it on your bench. It is a first edition of the West-Eastern Divan, 1819, in its original boards, crushed at the corners, the spine split. You find that you have picked it up before you can stop yourself, and that you are turning it in your hands, looking at the sewing, and he is watching you with a small smile."],[null,"\"You know what that is,\" he says. Then, in German: \"You're from Hamburg, aren't you? Those vowels. My mother was from Altona.\""],[[[["flag","false_papers",false]]],"\"I am from Colmar, Herr Sonderführer,\" you say. \"Alsace.\" He smiles more widely. \"Of course you are,\" he says. \"And I am from Timbuktu. Never mind. It's not my business. Books are my business.\""],[[[["flag","registered",false]]],"\"Brandt,\" he says. \"Emil Brandt. Yes. I looked you up. I hope you don't mind. Expatriated in '34. Social Democrat. Interned by the French, poor man. Well. I'm not the Gestapo, Herr Brandt. I'm a librarian.\""],[[[["flag","no_papers",false]]],"You do not answer. He looks at you for a long moment, and you can see him deciding not to ask. \"Well,\" he says. \"Never mind. It's not my business. Books are my business.\""],[null,"His name is Doctor Albrecht Hahn. Before the war he was a librarian at the State Library in Berlin. Now he works for an organisation called the Einsatzstab Reichsleiter Rosenberg, which collects books and documents in occupied countries \"for research.\""]],"choices":[],"gotos":[[null,"hahn_offer"]],"end":false},"hahn_offer":{"chapter":null,"effects":[],"paragraphs":[[null,"He comes back for the Goethe a fortnight later and stands at the bench with it in his hands for a long time, turning the pages, and you see that his eyes are wet."],[null,"\"Herr Brandt,\" he says. He calls you that now. \"I'll be frank. I have a problem. We have a great many books at our depot. Hundreds of thousands. Libraries from all over Paris, which have been, how shall I say, entrusted to us. Some are in very poor condition. I need someone who understands books. Who can repair, catalogue, sort. Who reads German and French and preferably Hebrew letters as well.\" He puts the Goethe down. \"Three thousand francs a month. A pass for the German canteen. Coal. Nobody will ask questions about your papers. I'll see to that.\""],[null,"Three thousand francs is three times what the workshop makes in a good month. A pass for the German canteen is meat, butter, real coffee. Coal is the difference between your daughter's hands bleeding and not bleeding."],[null,"You know, everybody in Paris knows, whose libraries these are. The Rothschilds. The Turgenev Library, the Russian émigrés' library. The Polish Library. The library of the rabbinical seminary. The private libraries of Jewish families who fled in June 1940, emptied out of their flats by men in lorries with lists."],[null,"Afterwards, you go to see Lucien."],[[[["flag","resistance",false]]],"Lucien says, \"Take it.\""],[[[["flag","resistance",true]]],"Lucien listens with his arms crossed. Then he says something you were not expecting. \"Take it. Take it, and tell me what they're doing in there. Who comes and goes. What they take, where they send it. Lists. Addresses. The Germans keep lists of everything. I know people who'd want to see them.\""]],"choices":[[null,"Take the job. For Josette. You will tell yourself it's only books.","hahn_accept",[["set","hahn_job"],["stat","money","+",300],["stat","food","+",3],["stat","hope","-",1]]],[null,"Take the job and pass everything you see to Lucien.","hahn_spy",[["set","hahn_job"],["set","spy"],["set","resistance"],["stat","money","+",300],["stat","food","+",3]]],[null,"Refuse. You will not be a librarian of stolen books.","hahn_refuse",[["set","refused_hahn"],["stat","hope","+",1]]]],"gotos":[],"end":false},"hahn_accept":{"chapter":null,"effects":[],"paragraphs":[[null,"The depot is in a requisitioned building on the avenue d'Iéna, and the basement of a big shop on the rue de la Boétie, and a warehouse by the Gare d'Austerlitz. Wherever you go, there are books. Books in crates, books in piles to the ceiling, books on the floors of rooms that used to be ballrooms, books thrown out of lorries on to the pavement in the rain. Sorting tables. Men in brown overalls with stamps. Women typing catalogue cards. Order and method. Hahn moves among it all like a priest in a cathedral."],[null,"Your job is the repair room: crushed spines, torn boards, water damage, mould. You are good at it. Hahn is delighted."],[null,"The canteen is warm. You eat sausage and potatoes and drink real coffee among German secretaries and clerks and soldiers, and you speak German to them, and some of them become almost friends: a girl from Leipzig, a fat corporal who was a bookseller in Dresden. Nobody asks you anything. You bring home bread and fat and coal in your bag and Josette's chilblains heal by April."]],"choices":[],"gotos":[[null,"depot"]],"end":false},"hahn_spy":{"chapter":null,"effects":[["stat","hope","+",1]],"paragraphs":[[null,"The depot is in a requisitioned building on the avenue d'Iéna, and the basement of a big shop on the rue de la Boétie, and a warehouse by the Gare d'Austerlitz. Wherever you go, there are books. Books in crates, books in piles to the ceiling, books on the floors of rooms that used to be ballrooms, books thrown out of lorries on to the pavement in the rain. Sorting tables. Men in brown overalls with stamps. Women typing catalogue cards. Order and method. Hahn moves among it all like a priest in a cathedral."],[null,"You are very good at your job. And every evening you write, from memory, in pencil on cigarette paper, what you saw: the names on the crates, the addresses they came from, the lorry numbers, the destinations stencilled on the crates going east: Berlin, Frankfurt, Ratibor. Twice a week you leave the papers inside the cover of a book you have \"repaired\" for Lucien, and Lucien's apprentice Jeannot collects it from the workshop on a bicycle."],[null,"The canteen is warm. You bring home bread and fat and coal. Josette's chilblains heal by April. In the canteen you laugh at the fat corporal's jokes. You find you can do it quite easily. That frightens you more than anything."]],"choices":[],"gotos":[[null,"depot"]],"end":false},"depot":{"chapter":null,"effects":[],"paragraphs":[[null,"One afternoon in May you are given a crate to sort that has come from a flat on the avenue Foch. A family called Kahn-Morel: the crate is full of children's books. Jules Verne, the Comtesse de Ségur, Babar, schoolbooks, a German grammar, all with the same bookplate, ex libris Daniel Kahn-Morel, in a child's careful handwriting under the printed one."],[null,"Inside a Jules Verne, as a bookmark, there is a letter. A child's letter, in pencil, to \"Mon cher Grand-Père,\" about a holiday at Deauville in 1939, about a crab that pinched somebody's toe. It is signed Daniel, age 9."],[null,"The crate is to be catalogued, the valuable books kept for the institute in Frankfurt, the rest pulped. The children's books are the rest."]],"choices":[[null,"Slip the Jules Verne with the letter into your coat. Someone might someday come looking for it.","depot_keep",[["set","reinach_book"]]],[null,"Do your job. Pulp them. They're only books.","depot_pulp",[["stat","hope","-",1]]]],"gotos":[],"end":false},"depot_keep":{"chapter":null,"effects":[],"paragraphs":[[null,"You put it in the inside pocket of your coat, next to Josette's drawing, and walk out past the guard on the door with your heart going like a hammer. He says \"Heil Hitler, Herr Brandt, schönen Abend,\" without looking up from his newspaper."],[null,"At home you put the book on the high shelf in the workshop, behind the account books, where it will stay for four years."]],"choices":[],"gotos":[[null,"occ_rafle"]],"end":false},"depot_pulp":{"chapter":null,"effects":[],"paragraphs":[[null,"The pulping machine is in the basement. It is noisy. The books go in at the top and come out at the bottom as a grey wet porridge that is sold to a paper mill in Nanterre to make new paper, which is used to print, among other things, German army forms and the newspaper Le Matin. You stand and watch Babar go in."],[null,"You keep the letter, though. You cannot not keep the letter."]],"choices":[],"gotos":[[null,"occ_rafle"]],"end":false},"hahn_refuse":{"chapter":null,"effects":[["stat","money","+",80]],"paragraphs":[[null,"\"I'm sorry, Herr Doktor. I'm a bookbinder. I bind books. I'm not a librarian.\""],[null,"Hahn looks at you for a long time. Then he smiles, sadly."],[null,"\"You think I don't know what they are?\" he says in German, very quietly. \"I'm saving them. If I don't catalogue them, the men who come after me will burn them in the courtyard. I've seen it done.\" He puts on his cap. \"Well, I respect you, Herr Brandt. Truly. I'll remember.\""],[null,"You do not know whether that is a kindness or a threat. Neither, perhaps, does he."],[null,"He pays for the Goethe, generously, in occupation marks."]],"choices":[],"gotos":[[null,"occ_rafle"]],"end":false},"occ_rafle":{"chapter":"August 1941","effects":[],"paragraphs":[[null,"On the morning of the twentieth of August 1941 you wake at five to the sound of engines. Through the blacked-out window you see buses. Green and cream Paris buses, the ones from the TCRP, parked at the end of the street, ten of them, with their engines running, and French police in their capes everywhere, at every corner, blocking the ends of the rue de la Roquette, the boulevard Voltaire, the rue de Charonne."],[null,"It is the whole of the eleventh arrondissement. They close it off like a cork in a bottle. Nobody in, nobody out. Then they go building by building with their lists, the colour-coded lists from last October, looking for Jewish men between eighteen and fifty."],[null,"Isaac is forty-one."],[null,"He comes down the stairs at a quarter past five in his vest and his trousers with the braces hanging, barefoot, carrying his shoes, white as paper. Upstairs you can hear Rivka crying and the baby screaming."],[null,"\"They're in the building opposite,\" he says. \"Emil. Emil.\""],[null,"The workshop is downstairs. Behind the big standing press there is a space where you keep the boards, a cupboard with a false back, the size of a coffin, where in Hamburg you would have hidden a man without thinking. They are two doors away. You can hear them on the stairs of number 60."],[[[["flag","pujol_hostile",false]]],"And Madame Pujol is standing at the window of her lodge, watching you both."],[[[["flag","pujol_hostile",true]]],"Madame Pujol is standing at the window of her lodge. She sees Isaac. She sees you. She looks at you for a long moment, and then she pulls the curtain shut."]],"choices":[[null,"Hide Isaac behind the press.","rafle_hide",[]],[null,"You can't. If they find him in your workshop, they take you too, and maybe Madeleine. Tell him to go back up and hope they pass the building by.","rafle_refuse",[["stat","hope","-",2],["set","isaac_drancy"]]]],"gotos":[],"end":false},"rafle_hide":{"chapter":null,"effects":[["set","isaac_hid"],["stat","hope","+",1]],"paragraphs":[[null,"You get him behind the press with the boards in front of him. He is shaking so much that you can hear the boards rattle and you have to put your hand on them and say, very quietly in Yiddish, which is near enough German, \"Shh, Isaac, shh.\" Then you go back to the bench and pick up a needle and a section and begin to sew, and your hands are shaking so much you stab yourself in the thumb, twice, and bleed on to the paper."],[null,"Two policemen. A sergeant with a list, a young one behind him. They do not look at you. They go up the stairs, and you hear them on the third floor, banging on the Lewins' door, and Rivka's voice, high and fast, and the sergeant's, bored."],[null,"They are up there for ten minutes."],[[[["flag","pujol_hostile",false]]],"When they come down, the sergeant stops at the door of the lodge and talks to Madame Pujol through the window. You cannot hear what they say. She points. She points at the workshop."],[[[["flag","pujol_hostile",false]]],"The sergeant comes in. He walks around the workshop slowly, looking at the presses, the guillotine, the shelves. He stops in front of the standing press. He looks at you. You look at him. He is about fifty, with a grey moustache and a wedding ring, and he looks very tired."],[[[["flag","pujol_hostile",false]]],"\"What's behind there?\" he says. \"Boards,\" you say. \"Binder's boards.\" He looks at you for a long time. Then he says, loudly, to the young one in the doorway, \"Nothing here. Boards,\" and walks out. You will never know why. You will think about him for the rest of your life."],[[[["flag","pujol_hostile",true]]],"When they come down, they walk straight past the workshop door without looking in. The young one is laughing about something. The sergeant ticks the Lewins' name on his list with a pencil: absent."],[null,"At ten o'clock the buses leave with four thousand two hundred men from the eleventh arrondissement. They are taken to a half-built housing estate in the northern suburbs, at a place called Drancy, a concrete horseshoe with no windows in its stairwells."],[null,"Isaac comes out from behind the press at noon, grey with dust, and sits on the floor of the workshop for an hour, and will not speak. Then he goes upstairs. That night he comes down again with a suit he has made for you. He has had your measurements for a year, he says. He was saving it for a special occasion."]],"choices":[],"gotos":[[null,"occ_hostages"]],"end":false},"rafle_refuse":{"chapter":null,"effects":[],"paragraphs":[[null,"\"Go back up, Isaac. Please. If they find you here, we're all finished. Go back up and lock the door and don't answer it. Maybe they'll pass.\""],[null,"He looks at you for one second. Just one. Then he nods, and goes back up the stairs in his bare feet, holding his shoes."],[null,"They do not pass. At six in the morning, you hear them on the stairs, a sergeant and a young one, and the banging on the Lewins' door, and Rivka's voice, and then Isaac comes down the stairs between them in his shirt and trousers with his shoes on now, and a little suitcase, and as he passes the workshop door he does not look at you."],[null,"At ten o'clock the buses leave with four thousand two hundred men from the eleventh arrondissement. They are taken to a half-built housing estate in the northern suburbs, at a place called Drancy."],[null,"In November, after three months, the Germans release a few hundred of the sickest men from Drancy, because too many of them are dying of hunger, and it looks bad. Isaac is one of them. He comes home on the Métro in his summer shirt, in the rain. He weighs forty-four kilos. He has dysentery and his teeth are loose. He does not tell anybody what happened inside. He does not have to."],[null,"He never speaks of the morning on the stairs. That is worse than if he did."]],"choices":[],"gotos":[[null,"occ_hostages"]],"end":false},"occ_hostages":{"chapter":"Hostages","effects":[],"paragraphs":[[null,"The day after the roundup, the twenty-first of August, a young Communist called Pierre Georges, who will later be known as Colonel Fabien, shoots a German naval cadet in the back on the platform of the Barbès-Rochechouart Métro station. The cadet's name is Alfons Moser. He is twenty-one."],[null,"The Germans reply with posters."],[null,"The posters are yellow, with black borders, in German and French. They go up all over Paris, on walls, on Métro stations, on the columns where they used to advertise the theatre. AVIS. BEKANNTMACHUNG. They give the names of hostages who have been shot in reprisal. Communists, Jews, anybody already in prison. Three. Then ten. Then in October, after an officer is killed in Nantes, forty-eight in a single day, including a boy of seventeen called Guy Môquet, who writes a letter to his mother before they take him to the quarry."],[null,"On the poster in September, the third name is Marchal, Pierre, printer, born 1919. Lucien's cousin. They shoot him at the fortress of Mont-Valérien, in the clearing behind the chapel, at dawn."],[null,"Lucien comes to the workshop the next evening. He does not drink. He sits on Isaac's stool and he does not drink and you have never seen him not drink."],[null,"\"It's started now,\" he says. \"It's started properly.\" He looks at you. \"I need people, Emil. People who can do things with paper. You know paper. Tracts. Cards. Stamps. You know how to make a thing look like what it isn't.\""],[[[["flag","spy",false]]],"\"You already do enough,\" he adds. \"At the depot. But I need more. I need a forger.\""],[[[["flag","hahn_job",false]]],"\"And I need a man inside the depot who isn't afraid.\""],[[[["flag","false_papers",false]]],"\"You know what a false card looks like. You've got one in your pocket.\""]],"choices":[[null,"Join him. You will help with tracts and papers.","hostage_join",[["set","resistance"],["set","forger"],["stat","hope","+",2]]],[null,"Refuse. You have a family. Your daughter. You've seen enough camps.","hostage_refuse",[["stat","hope","-",1]]]],"gotos":[],"end":false},"hostage_join":{"chapter":null,"effects":[],"paragraphs":[[null,"\"What do you need?\""],[null,"He tells you. Tracts first, to be left in Métro carriages and letterboxes and under the doors of churches. Then ration cards. Then, later, identity cards, with stamps cut by hand from rubber erasers and blocks of lino, for people who need to stop existing: escaped prisoners, young men avoiding the labour service, Jews, British airmen shot down over Belgium on their way south."],[null,"You are very good at stamps. You discover it the first night, cutting the eagle of the Prefecture backwards into a pink eraser with a scalpel by the light of a candle, while Madeleine sleeps. It is like a binder's finishing tool. It is like gold tooling a spine. You hold it to the light and it is perfect, and you feel something you have not felt since 1933. Not happiness. Something harder."],[null,"Madeleine finds the eraser in the morning. She looks at it for a long time. Then she puts it back exactly where it was and says nothing, and that night when you come to bed she holds you so tightly that you can't breathe."]],"choices":[],"gotos":[[null,"kurt"]],"end":false},"hostage_refuse":{"chapter":null,"effects":[],"paragraphs":[[null,"\"I can't, Lucien. I can't. I've done my camp. I have Josette.\""],[null,"He nods. He does not argue. He looks old."],[null,"\"I know,\" he says. \"That's what everybody says. 'I have someone.' It's a good reason.\" He stands up. \"It's the best reason there is. That's the trouble with it.\""],[null,"At the door he turns. \"If you change your mind, the dairy. Ask for Jeannot.\""],[null,"That night you lie awake listening to the German patrol in the street, the boots, the laughter, and you think about a printer called Pierre Marchal, born 1919, who was shot in a clearing at dawn for something somebody else did."]],"choices":[],"gotos":[[null,"kurt"]],"end":false},"kurt":{"chapter":"Part Five — My Brother","effects":[],"paragraphs":[[[[["flag","hahn_job",false]]],"It happens in the German canteen, of all places, on a Tuesday in April 1942. You are carrying your tray to your usual table by the window when somebody behind you drops a cup, and says, \"Emil?\" in a voice you have not heard for nine years, and you turn round."],[[[["flag","hahn_job",true]]],"It happens on the boulevard Saint-Michel, of all places, on a Tuesday in April 1942. You are walking back from delivering a set of rebound encyclopaedias to a lycée, pushing the handcart, and a group of German soldiers are coming the other way, on leave, cameras, laughing, and one of them stops dead in the middle of the pavement so that the others bump into him, and says, \"Emil?\" in a voice you have not heard for nine years."],[null,"It is Kurt."],[null,"Your little brother. Thirty-two years old now. He is in the field-grey uniform of an Obergefreiter of infantry, a lance-corporal, with the ribbon of the Iron Cross second class in his buttonhole and another ribbon you do not recognise, and he is thin, much thinner than you remember, and older than thirty-two, and he walks with a stick. He has the same face as your father. You had forgotten that. He has your father's face exactly, and your father has been dead since 1928."],[null,"He takes a step towards you and stops, as if he is not sure he is allowed."],[null,"The last time you saw him was in May 1933, in your mother's kitchen in Hamburg, the day after the SA brought him back. He was sitting at the table with his hands round a cup of coffee, and you asked him what they had done to him, and he would not say, and you said, \"Then come with me. To Paris. Tonight.\" And he said no. He said, \"Somebody has to stay with Mother.\" And you went, and he stayed."]],"choices":[],"gotos":[[null,"kurt_2"]],"end":false},"kurt_2":{"chapter":null,"effects":[],"paragraphs":[[null,"You go to a café on the rue Soufflot, near the Panthéon, where there are no other Germans, and sit at a table at the back. He orders schnapps for you both and the waiter brings calvados. Kurt's hands shake when he lifts the glass. He drinks it in one."],[null,"He tells you things. Mother died in 1938, of her heart, in her sleep, and he wrote to you, and the letter came back marked \"address unknown.\" He married in 1937, a girl called Hilde from Barmbek, and there is a son, Peter, who is four now, and he shows you a photograph of a fat little boy in a sailor suit on a beach at Travemünde. He was called up in 1939. Poland. France, in 1940, then he was here, in Paris, with the occupation troops, for six months, the best six months of his life. And then the East. Russia. The Ukraine."],[null,"He stops."],[null,"\"I looked for you,\" he says. \"In 1940. When we were here. I went to the Prefecture and asked. They said they had no Brandt, Emil. I thought, he's in England. Or dead. Or in America.\" He laughs, without any laughter in it. \"And here you are. On the boulevard Saint-Michel.\""],[null,"You ask him about the stick. He says, \"Frostbite. December. In front of Moscow. They took off four toes. It was forty degrees below zero and we were in summer coats, Emil. Summer coats. The horses froze standing up.\" He orders another calvados. \"That's how I got here. Light duties. Garrison. They gave me Paris, to rest.\""],[null,"Then he looks at you, and you see your father's eyes in his face looking at you, and something in them you do not want to see."],[null,"\"I have to tell somebody,\" he says. \"Can I tell you? You're the only one I can tell.\""]],"choices":[],"gotos":[[null,"kurt_confession"]],"end":false},"kurt_confession":{"chapter":null,"effects":[],"paragraphs":[[null,"He tells you about September in the Ukraine."],[null,"He tells it slowly and in order, looking at the tablecloth, as if he is reading it off a list. A town, somewhere west of Kiev; he does not remember the name, or says he doesn't. His company was ordered to provide a cordon. That was the word, cordon. Just to keep order. There was a ravine outside the town, a sandy ravine with birch trees, and men from the SS and from a police battalion. And the Jews of the town were brought there. All of them. Not the men. All of them. Women. Old people. Children. Kurt's company stood in a line along the road with their rifles and kept order while the Jews walked past them towards the ravine, in families, carrying their things, because they had been told they were being resettled."],[null,"At the edge of the ravine they had to undress. They had to put their clothes in piles: coats here, shoes there. Then they went down into the ravine in groups of ten and lay down on top of the ones who were already there, and were shot in the back of the neck."],[null,"It took two days. The men from the police battalion were given schnapps. Some of them were drunk by noon. There were so many children. There was an old man who was a rabbi, who sang. There was a woman who held up her baby to the soldiers in the cordon, to Kurt's line, as she went past, and said something in Yiddish, which is near enough to German that you can understand it, and what she said was \"Take him. Please. He's only a baby. Take him.\""],[null,"\"I didn't take him,\" Kurt says. He says it to the tablecloth. \"I didn't take him, Emil. I stood there with my rifle. I kept order.\""]],"choices":[],"gotos":[[null,"kurt_choice"]],"end":false},"kurt_choice":{"chapter":null,"effects":[],"paragraphs":[[null,"He is crying now, without any sound. A Wehrmacht lance-corporal, crying in a café in the Latin Quarter with his face in his hands, and the waiter is very carefully looking the other way, and the two old men by the window have got up and left."],[null,"\"And then you know what I did? I sent Hilde a fur coat. From Kiev. They were giving them out. From the piles. I sent my wife a fur coat in a parcel, Emil. She wrote and said it was the most beautiful thing she'd ever had.\""],[null,"You think about Sarah Lewin. You think about Moïse, who is two years old now and calls you \"Mil.\" You think about the drawing in your breast pocket. You think about the cellar in Hamburg in 1933, and Kurt at nineteen in the back of the lorry with his face against the slats, looking at you, and you running, you running away to Paris and leaving him there."]],"choices":[[null,"Put your hand on his. He is your brother. Whatever he has done, he is your brother.","kurt_embrace",[["set","kurt_close"],["stat","hope","+",1]]],[null,"Get up. Leave. Whatever he was once, he is one of them now.","kurt_reject",[["set","kurt_rejected"],["stat","hope","-",1]]],[null,"Tell him: if he wants forgiveness, he can help you. Then you'll see.","kurt_bargain",[["set","kurt_close"],["set","kurt_helps"]]]],"gotos":[],"end":false},"kurt_embrace":{"chapter":null,"effects":[],"paragraphs":[[null,"You put your hand on his on the tablecloth, and he grabs it with both of his, hard, as if he is drowning."],[null,"You stay in the café until curfew. You talk about Mother. About the cellar on the Grindelallee, about the smell of the Elbe in summer, about the football ground at Rothenbaum. About the plum cake at the bakery on the corner, Schuster's, which still exists, he says. You laugh. You don't know how, but you laugh."],[null,"At the door, he says, \"I'll come to see you. I won't come in uniform. I'll come in a coat. Nobody will know.\" He puts his hand on your face, like Mother did. \"I'm glad you ran, Emil. You were right to run. I should have run with you.\""]],"choices":[],"gotos":[[null,"star"]],"end":false},"kurt_reject":{"chapter":null,"effects":[],"paragraphs":[[null,"You stand up. You put money on the table for the calvados. He looks up at you, with your father's face, wet."],[null,"\"Emil.\""],[null,"\"You stood there,\" you say. \"You held a rifle and you stood there and you let them do it. And now you want me to say it's all right. I can't, Kurt. I'm not God and I'm not your priest. I can't.\""],[null,"You walk out. You walk all the way back to the eleventh arrondissement, across the river and through the Marais, and you do not remember any of it. When you get home, Madeleine takes one look at your face and sends the children to Rivka's."],[null,"That night you dream of a ravine with birch trees, and a woman holding up a baby, and the baby has Moïse's face, and you are in the cordon, and you do not take it either."]],"choices":[],"gotos":[[null,"star"]],"end":false},"kurt_bargain":{"chapter":null,"effects":[],"paragraphs":[[null,"He looks at you as if you have slapped him. Then, slowly, something in his face settles."],[null,"\"Yes,\" he says. \"Yes. That's fair. That's fair, Emil. Tell me what you need.\""],[null,"You don't know yet. You tell him so. He writes on the back of a beer mat: the address of his unit, a barracks at the École Militaire, and the name of a café on the avenue de la Motte-Picquet where he goes in the evenings."],[null,"\"Anything,\" he says. \"Papers. Passes. Information. I'm a clerk now, in the orderly room. You'd be surprised what a clerk sees.\" He holds out his hand, and after a moment you shake it. It is like shaking hands with a stranger who has your father's face."]],"choices":[],"gotos":[[null,"star"]],"end":false},"star":{"chapter":"The Star","effects":[],"paragraphs":[[null,"On the seventh of June 1942 every Jew in the occupied zone over the age of six must begin to wear a yellow star."],[null,"It is a six-pointed star the size of the palm of a hand, made of yellow cloth with a black border, with the word JUIF in the middle in black letters made to look like Hebrew. It must be sewn on to the left breast of the outer garment, firmly, \"solidly sewn,\" the ordinance says. Each person is issued three. They are distributed at the police stations, in exchange for a coupon from the textile ration card. The Jews of France pay for their own stars with their clothing ration."],[null,"Rivka sews them on. You watch her through the open door of the Lewins' flat, sitting at the kitchen table with her mouth full of pins, sewing a yellow star on to Sarah's school pinafore with the tiny, perfect stitches of a professional, so that it will be solidly sewn and nobody can say it isn't. Then on Isaac's jacket. Then on her own coat."],[null,"Sarah is ten. She stands in front of the mirror in the hall in her pinafore with the star and looks at herself for a long time."],[null,"\"Mama,\" she says. \"Will I still be allowed to go to school?\""],[null,"\"Of course.\""],[null,"\"Will I still be allowed to go to the square?\" The square is the little park at the end of the street, the Square de la Roquette, with a sandpit and a carousel."],[null,"Rivka doesn't answer. In July, the eighth ordinance will forbid Jews from all public parks, squares, gardens, cinemas, theatres, museums, libraries, swimming pools, restaurants, cafés, and telephone boxes. In the Métro they will be permitted to ride only in the last carriage. They will be permitted to shop only between three and four in the afternoon, when the shops are empty."]],"choices":[],"gotos":[[null,"star_2"]],"end":false},"star_2":{"chapter":null,"effects":[],"paragraphs":[[null,"The next morning, Josette comes down to breakfast with a yellow star made of paper pinned to her school smock. She has drawn it with a pencil and coloured it in with her yellow crayon. In the middle she has written, in capitals: JUIVE."],[null,"\"Sarah has one,\" she says. \"So I have one. Then she won't be the only one in our class.\""],[null,"Madeleine puts down the coffee pot."],[null,"You have heard, everybody has heard, that in the first days some Parisians, students mostly, did the same. Wore yellow stars that said ZAZOU, or BOUDDHISTE, or with the name of their province. Wore yellow flowers, yellow handkerchiefs. Some of them were arrested by the French police, and some of them are in Drancy now, with the Jews."],[null,"Josette is nine years old."]],"choices":[[null,"Let her wear it.","star_let",[["set","josette_star"],["stat","hope","+",2]]],[null,"Take it off her, gently. Explain why.","star_forbid",[]],[null,"Take it off her, and pin it on your own coat instead. If anyone pays for this, it will be you.","star_emil",[["set","emil_star"],["stat","hope","+",1]]]],"gotos":[],"end":false},"star_let":{"chapter":null,"effects":[],"paragraphs":[[null,"You kneel down in front of her and straighten it. \"It's a good star,\" you say. \"You drew it very well.\""],[null,"She goes to school wearing it. At ten o'clock the headmistress telephones the girls' school on the rue Keller and asks for Madame Brandt, and Madeleine walks across the arrondissement in the middle of the morning to sit in the headmistress's office with her daughter, who is not crying, who is sitting very straight on her chair with her paper star in her lap."],[null,"\"I'm not going to report this,\" the headmistress says. She is a thin grey woman with a crucifix. \"I want you to understand that I could. I want you to understand that I'm not going to. But if she does it again, Madame, I won't be able to protect her.\""],[null,"Josette doesn't wear it again. She keeps it. She keeps it in the drawer by her bed with the sock rabbit, and sometimes at night you hear her telling Sarah through the floor that she still has it."],[null,"Sarah tells you, years later, that it was the most important thing that anybody did for her in the whole war."]],"choices":[],"gotos":[[null,"rumor"]],"end":false},"star_forbid":{"chapter":null,"effects":[],"paragraphs":[[null,"You kneel down in front of her and take it off, very gently, unpinning it, and she starts to cry, and you try to explain. Why it is brave and why it is dangerous. Why there are police. Why there are lists. Why sometimes the bravest thing you can do is go to school and sit next to Sarah and be her friend, with no star, every day. She listens. She doesn't understand. She is nine."],[null,"\"But that's not fair,\" she says."],[null,"\"No,\" you say. \"It isn't.\""],[null,"She goes to school without it, and sits next to Sarah, and holds her hand under the desk all day. The other girls don't speak to Sarah now. Some of their mothers have told them not to. Two of them call her names at playtime, and Josette hits one of them, very hard, in the face, and is sent home with a note, and you do not punish her."]],"choices":[],"gotos":[[null,"rumor"]],"end":false},"star_emil":{"chapter":null,"effects":[["stat","health","-",1],["set","sarah_drawing"]],"paragraphs":[[null,"You pin it on your own coat. Josette stares at you. Madeleine says \"Emil,\" in a voice like a warning."],[null,"You wear it to work. You wear it on the Métro, in the first carriage, where Jews are not allowed, and stand there with your paper star among the clerks and the workmen and the women going to market, and they look at it and look away, and one old man, a worker in a blue jacket, gets up and offers you his seat. You do not take it."],[null,"At the Bastille two French policemen get on."],[null,"They take you to the police station on the rue de la Roquette. They keep you there for two days in a cell with a drunk and a pickpocket. On the first night a policeman you don't know comes in and hits you three times in the face with a rolled-up newspaper with something heavy in it, without saying a word, and leaves. On the second day an inspector interviews you and asks if you are a Jew. You say no. He asks you why you were wearing a Jewish star. You say because your daughter's friend has to wear one. He writes it down. He looks at you for a long time and then says, \"Get out, you idiot. Go home.\""],[[[["flag","hahn_job",false]]],"Later you find out that Doctor Hahn telephoned the police station when you did not come to work. He never mentions it. Nor do you."],[null,"Your face is swollen for a week. Sarah sees it, and understands, and does not say anything, but the next day she leaves a drawing on your workbench: a man with a brown moustache and a yellow star, and a little girl with another star, holding hands."]],"choices":[],"gotos":[[null,"rumor"]],"end":false},"rumor":{"chapter":"Part Six — Thursday the Sixteenth","effects":[],"paragraphs":[[null,"It comes on Tuesday the fourteenth of July, the national holiday, which the Germans have forbidden anybody to celebrate. A warm grey day. No flags. The tricolour has been banned in the occupied zone, and so the women of the eleventh arrondissement go out walking in red, white and blue dresses, in threes, arm in arm, and the German soldiers don't understand."],[null,"That evening you hear it."],[[[["flag","spy",false]]],"You hear it at the depot. Hahn's secretary, the girl from Leipzig, says it in the canteen to the fat corporal, not lowering her voice, because it never occurs to her that anybody there would care: the French police are going to do the big one on Thursday. Twenty-eight thousand names. Foreign Jews. Stateless. Everybody, this time, she says, women, children, the lot. They've requisitioned the buses and the Vélodrome d'Hiver. Thursday, four in the morning. You go to Lucien on your way home and tell him, and Lucien's face goes white, and he gets on his bicycle."],[[[["flag","hahn_job",false],["flag","spy",true]]],"You hear it at the depot. Hahn's secretary, the girl from Leipzig, says it in the canteen to the fat corporal, not lowering her voice, because it never occurs to her that anybody there would care: the French police are going to do the big one on Thursday. Twenty-eight thousand names. Foreign Jews. Stateless. Everybody, this time, she says, women, children, the lot. They've requisitioned the buses and the Vélodrome d'Hiver. Thursday, four in the morning."],[[[["flag","kurt_close",false],["flag","hahn_job",true]]],"You hear it from Kurt. He comes to the workshop at dusk, in a civilian raincoat that is too big for him, and shuts the door behind him and leans on it. \"Thursday,\" he says. \"The French police. Four in the morning. The orderly room has the paperwork, for the trains afterwards. Foreign Jews, stateless Jews. Everybody, Emil. Women. Children. It says children. Your neighbours, the tailor.\" He is out of breath. \"I didn't tell you this. I was never here.\" And then he is gone."],[[[["flag","resistance",false],["flag","hahn_job",true],["flag","kurt_close",true]]],"You hear it from Lucien. He comes to the workshop at dusk, out of breath, sweat through his shirt. \"Thursday,\" he says. \"Four in the morning. A comrade in the police union. Foreign Jews. Twenty-eight thousand names. Everybody, women, children, this time it's everybody. They've got the buses. I'm going round every Jewish family I know.\" He is gone before you can answer."],[[[["flag","hahn_job",true],["flag","kurt_close",true],["flag","resistance",true]]],"You hear it from Madeleine. She has heard it from the wife of a policeman in her school, who told her at the gate in a whisper, crying: her husband has been ordered to report at three in the morning on Thursday, with a list. Foreign Jews. Everybody. The policeman's wife is crying because the policeman has been sick in the toilet every night this week."],[null,"The Lewins are Polish Jews. Foreign. Isaac's and Rivka's names are on the colour-coded index cards at the Prefecture, with their address, which they wrote down themselves in October 1940. Sarah was born in Paris, in the Rothschild hospital, in 1931. She is French. Moïse too. It will not make any difference. You don't know that yet. Nobody does."]],"choices":[],"gotos":[[null,"rumor_2"]],"end":false},"rumor_2":{"chapter":null,"effects":[],"paragraphs":[[null,"You go up to the third floor. You tell them."],[null,"Isaac listens standing in the middle of the kitchen with his tape measure round his neck and his arms crossed. When you have finished, he nods."],[null,"\"Yes,\" he says. \"I've heard. Everybody's heard. They're saying it in the shops in the rue des Rosiers.\" He shrugs. \"It's like last August. They want the men, for work, in Germany. So I'll go away for a few days. To my cousin in Montreuil. When they come they'll find a woman and children and they'll go away again. They don't take women and children, Emil. What would they want with them? What work can a baby do?\""],[null,"\"Isaac. Everybody. It says everybody.\""],[null,"\"Who says?\" says Isaac. \"A German? A rumour?\" He smiles at you, gently, the way you smile at a frightened child. \"Emil. This is France. France doesn't arrest babies.\""],[null,"Rivka has been sitting at the table with Moïse on her knee. She has not said anything. Now she looks at you, and you see that she believes you."],[null,"Josette is downstairs, nine years old, asleep with a sock rabbit in her fist."],[[[["flag","pierrot",false]]],"So is Pierrot, in the box room, who still has nightmares about aeroplanes."],[null,"If the police find Jews in your flat, it is the end. For you, for Madeleine. Maybe for your children."]],"choices":[[null,"Offer to take the children. Sarah and Moïse can sleep in your flat tomorrow night.","rumor_children",[]],[null,"Offer more: hide the whole family in the workshop. Behind the press, in the cellar, anywhere.","rumor_family",[["set","hid_family"]]],[null,"Say nothing more. You've warned them. It's their decision, and you have your own children.","rumor_nothing",[["stat","hope","-",2]]]],"gotos":[],"end":false},"rumor_children":{"chapter":null,"effects":[],"paragraphs":[[null,"\"Give me the children,\" you say. \"Just for the night. Wednesday night. If nothing happens, they come back up in the morning and we'll all laugh about it.\""],[null,"Isaac starts to say something. Rivka speaks first."],[null,"\"Yes,\" she says. \"Sarah. Take Sarah.\" She turns to her daughter, who has been sitting on the floor in the corner pretending to read and listening to every word. \"Sarah, you'll sleep at Josette's tomorrow. Like a holiday.\""],[null,"Then she looks down at the baby in her lap. Moïse is two and a half. He is chewing the ear of a wooden horse that Isaac carved for him, and he looks up at his mother and says \"Mama,\" and puts the horse in her mouth to share."],[[[["flag","isaac_hid",false]]],"Rivka shuts her eyes. Then she stands up and puts Moïse in your arms. He is heavy and warm and smells of milk and sleep. \"You hid Isaac,\" she says. \"Last year. When they came. You hid him behind the press. I know you. You'll keep him.\" She is shaking. \"If nothing happens, I'll come down for him at six. If nothing happens.\""],[[[["flag","isaac_hid",false]]],"You hold Moïse. He grabs your nose."],[[[["flag","isaac_hid",true]]],"\"Not him,\" Rivka says. \"I can't. Not him. He's a baby. He won't sleep without me. He'll scream all night and the whole building will hear, and then they'll come for you too.\" She is holding him so tightly he squirms. \"They don't take babies. Isaac's right. Not babies.\""],[[[["flag","isaac_hid",true]]],"You think of the August morning last year, when Isaac came down the stairs in his bare feet holding his shoes, and you sent him back up. She remembers too. You can see it."]],"choices":[],"gotos":[[[[["flag","isaac_hid",false]]],"rumor_children_both"],[null,"rumor_children_sarah"]],"end":false},"rumor_children_both":{"chapter":null,"effects":[["set","took_sarah"],["set","took_moise"]],"paragraphs":[[null,"On Wednesday night Sarah comes down at nine with her nightdress, her toothbrush and her school satchel, and Rivka comes down at ten with the baby asleep on her shoulder, and puts him on your bed, and kisses him, and kisses Sarah, and goes up again without saying anything, holding the banister."],[null,"Sarah gets into bed with Josette. You hear them whispering for an hour. Then they're asleep."],[null,"You don't sleep. You and Madeleine sit at the kitchen table in the dark with the blackout up and the window open for air, listening to Paris. At two o'clock it is perfectly quiet. At three o'clock you hear a lorry. At a quarter to four you hear the buses."]],"choices":[],"gotos":[[null,"veldhiv"]],"end":false},"rumor_children_sarah":{"chapter":null,"effects":[["set","took_sarah"]],"paragraphs":[[null,"On Wednesday night Sarah comes down at nine with her nightdress, her toothbrush and her school satchel. Rivka brings her. At the door Rivka kisses her eight times, on both cheeks, on the forehead, the eyes, the hands, and Sarah says \"Mama, stop, it's only one night,\" and Rivka laughs, and goes up the stairs again holding the banister."],[null,"Sarah gets into bed with Josette. You hear them whispering for an hour. Then they're asleep."],[null,"You don't sleep. You and Madeleine sit at the kitchen table in the dark with the blackout up and the window open for air, listening to Paris. At two o'clock it is perfectly quiet. At three o'clock you hear a lorry. At a quarter to four you hear the buses."]],"choices":[],"gotos":[[null,"veldhiv"]],"end":false},"rumor_family":{"chapter":null,"effects":[],"paragraphs":[[null,"\"All of you,\" you say. \"In the workshop. In the cellar under the workshop. There's a trapdoor under the drying rack. It's where the coal was kept. Nobody knows about it except me.\""],[null,"Isaac argues for an hour. He is not a coward and he does not want to hide in a coal cellar like a rat. Rivka doesn't argue. She starts packing a bag before he's finished, and in the end he follows her down the stairs at midnight on Wednesday with a suitcase and a candle and his face set like stone, and the four of them go down through the trapdoor into the black, Isaac, Rivka, Sarah, Moïse with a dummy in his mouth, and you close the trapdoor and drag the drying rack across it, and pile paper on the rack, and go upstairs, and sit at the kitchen table with Madeleine in the dark."],[null,"At two o'clock it is perfectly quiet. At three o'clock you hear a lorry. At a quarter to four you hear the buses."]],"choices":[],"gotos":[[null,"veldhiv"]],"end":false},"rumor_nothing":{"chapter":null,"effects":[],"paragraphs":[[null,"\"It's your decision, Isaac,\" you say. \"I'm sorry. I've told you what I heard.\""],[null,"He thanks you. He shakes your hand. He says he'll go to his cousin's in Montreuil tomorrow evening, and Rivka and the children will stay, and everything will be fine."],[null,"On the stairs, going down, you hear Rivka's voice behind the door, high and fast in Yiddish, and Isaac's, low."],[null,"Wednesday night you don't sleep. You and Madeleine sit at the kitchen table in the dark with the blackout up and the window open for air, listening to Paris. At two o'clock it is perfectly quiet. At three o'clock you hear a lorry. At a quarter to four you hear the buses."]],"choices":[],"gotos":[[null,"veldhiv"]],"end":false},"veldhiv":{"chapter":"The Sixteenth of July 1942","effects":[],"paragraphs":[[null,"They come at ten past four. Not Germans. There is not one German in the rue de la Roquette that morning. French policemen, in their capes and their képis, in pairs, a sergeant and a constable, with lists, and French gendarmes in their helmets at the ends of the street, and the green and cream buses of the Paris transport company, with their drivers smoking at the wheel, waiting."],[null,"You hear them on the stairs of number 64. The heavy feet. The knock on the third floor. A man's voice, bored, saying \"Police. Open up.\""]],"choices":[],"gotos":[[[[["flag","hid_family",false]]],"veldhiv_family"],[[[["flag","took_sarah",false]]],"veldhiv_children"],[null,"veldhiv_nothing"]],"end":false},"veldhiv_family":{"chapter":null,"effects":[],"paragraphs":[[null,"They knock on the Lewins' door for a long time. Then they break it open. You hear them walking around upstairs, opening cupboards, the bed being turned over. Then they come down."],[[[["flag","pujol_hostile",false]]],"At the bottom of the stairs, the sergeant stops at the lodge. Madame Pujol is already standing in her doorway in her dressing gown, her hair in pins. \"The Lewins,\" the sergeant says. \"Third floor. Gone. Where?\" She does not hesitate. She turns her head and looks at the door of the workshop."],[[[["flag","pujol_hostile",true]]],"At the bottom of the stairs, the sergeant stops at the lodge. Madame Pujol is already standing in her doorway in her dressing gown, her hair in pins. \"The Lewins,\" the sergeant says. \"Third floor. Gone. Where?\""],[[[["flag","pujol_hostile",true]]],"Madame Pujol looks at him for a long moment. Then she says, quite loudly, in her most disagreeable voice, \"Gone to the country last week, the whole tribe of them. To Normandy. Owing me two months' rent, of course. You find them, Sergeant, you tell them Madame Pujol wants her money.\""],[[[["flag","pujol_hostile",true]]],"The sergeant laughs. He writes something on his list. \"Absent,\" he tells the constable. \"Next building.\""]],"choices":[],"gotos":[[[[["flag","pujol_hostile",false]]],"veldhiv_found"],[null,"veldhiv_saved"]],"end":false},"veldhiv_saved":{"chapter":null,"effects":[["set","sarah_safe"],["set","moise_safe"],["set","parents_safe"],["stat","hope","+",3]],"paragraphs":[[null,"You stand at the window with Madeleine and watch the buses fill. From number 60 they bring out the Grinbergs, mother and three children, the youngest in pyjamas. From number 58 the old couple from the ground floor, Monsieur and Madame Kaplan, he in his overcoat in July, she with a birdcage with a canary in it, which a constable takes off her and puts on the pavement, and the canary sings and sings on the pavement after the bus has gone. From across the street, a woman with a baby who throws herself at a policeman and has to be dragged. Children. So many children. Children carrying their own little suitcases. Children holding their teddy bears."],[null,"The bus doors close. The buses leave."],[null,"At noon, when the street is empty, you go down to the workshop and move the drying rack and lift the trapdoor, and Isaac comes up the ladder into the light, black with coal dust, and stands in the workshop, and looks at you."],[null,"He does not say anything. Neither do you. Then he puts his arms around you and holds you, and he is shaking, a big man, shaking like a tree in the wind, and Rivka comes up behind him with Moïse, who is asleep, and Sarah, who is not."],[null,"Then you go and knock on the door of the lodge."],[null,"Madame Pujol opens it a crack. She looks at you. \"What?\" she says. \"What do you want? I didn't do anything. I don't know anything.\" She shuts the door in your face. Through it she says: \"And they still owe me two months' rent.\""],[null,"They do not. They have never been late with the rent in eleven years. You will think about Madame Pujol for the rest of your life, and you will never understand her."]],"choices":[],"gotos":[[null,"veldhiv_stadium"]],"end":false},"veldhiv_found":{"chapter":null,"effects":[["stat","health","-",3],["stat","hope","-",3],["set","sarah_safe"],["set","emil_arrested42"]],"paragraphs":[[null,"The sergeant comes into the workshop with two constables and Madame Pujol behind them in her dressing gown. \"Under the rack,\" she says. \"There's a coal hole. He thinks I don't know about it. Eleven years I've been in this building.\""],[null,"They drag the rack away. They open the trapdoor. They shine a torch down into the black. \"Come up,\" the sergeant says. \"Come up, all of you, it's finished.\""],[null,"Isaac comes up first, with his hands up, black with coal, and then Rivka with Moïse, and the sergeant says \"And the girl. There's a girl. Sarah, ten years old. Where's the girl?\" and Rivka says \"She's with my sister in Lyon,\" and the sergeant shines his torch down into the coal hole for a long time."],[null,"Sarah is down there. You know she is. She is lying flat under the old coal sacks at the back, behind the chimney breast, not breathing. You told her where. You told her, if anything happens, there, under the sacks, and don't come out for anybody, anybody, not even Mama."],[null,"The sergeant turns his torch off. \"Lyon,\" he says. \"All right.\""],[null,"Then he turns to you."],[null,"You don't remember all of it. The constables hit you in the workshop, with batons and boots, while the sergeant watches, and Madeleine screams on the stairs. They take you away in a police van with Isaac and Rivka and Moïse and four other people. At the commissariat they separate you. You are not a Jew. You are a German, of all things, who has been hiding Jews, and nobody quite knows what to do with you."],[[[["flag","hahn_job",false]]],"At five in the afternoon, Doctor Hahn arrives at the commissariat in a staff car. He does not speak to you. He speaks to the commissaire in an office with the door shut for fifteen minutes. Then you are released. In the car he says, looking straight ahead, \"Herr Brandt. I can do this once. Do you understand me? Once.\""],[[[["flag","kurt_close",false],["flag","hahn_job",true]]],"At five in the afternoon a German lance-corporal with a stick comes into the commissariat with a typed order on Wehrmacht notepaper, stamped, demanding the release of \"the German national Brandt\" into military custody. The French are glad to be rid of the problem. Outside, in the street, Kurt tears the order into small pieces and puts them in the gutter. \"I typed it myself,\" he says. \"I signed it myself. Don't ask.\""],[[[["flag","hahn_job",true],["flag","kurt_close",true]]],"They keep you three days. On the third day an inspector releases you without explanation, for lack of a crime anybody can be bothered to charge you with. You walk home with two cracked ribs."],[null,"Sarah comes out of the coal hole at midnight on the sixteenth, when Madeleine goes down and calls her in the special whistle you agreed. She has been lying under the sacks for twenty hours. She has wet herself. She doesn't cry. She doesn't speak, either, for eleven days."]],"choices":[],"gotos":[[null,"veldhiv_stadium"]],"end":false},"veldhiv_children":{"chapter":null,"effects":[["set","sarah_safe"],["stat","hope","-",2]],"paragraphs":[[null,"They knock on the Lewins' door for a long time. Then Isaac opens it. You hear his voice. \"Sir, I'm a legal person, here are my papers, I have a shop...\" He did not go to his cousin's in Montreuil after all. He would not leave Rivka."],[null,"Through the floor you hear Rivka's voice, very clear: \"My daughter is with my sister in Lyon.\""],[[[["flag","took_moise",false]]],"\"And the baby?\" says the sergeant. A pause. \"There's a cot. Where's the baby?\" \"Dead,\" Rivka says. \"Of diphtheria. In May. The cot is for the next one.\" You never know how she says it without her voice breaking. The sergeant says nothing for a while. Then you hear him tick the list."],[[[["flag","took_moise",true]]],"You hear Moïse crying. You hear the sergeant say, \"Bring the child. A bottle, nappies, a change of clothes. You have five minutes.\""],[null,"Then they come down the stairs. Isaac first, carrying two suitcases. Rivka behind him."],[[[["flag","took_moise",true]]],"She has Moïse on her hip, in his sleeping suit, with his wooden horse."],[null,"She walks past the door of your flat and does not look at it. She does not look at it because she knows that if she looks at it, Sarah will hear her and come out."],[null,"Sarah is standing behind the door. Madeleine is holding her with both arms and a hand over her mouth, and Sarah is fighting her without a sound, kicking, biting Madeleine's hand until it bleeds, and Madeleine does not let go."],[null,"At the bottom of the stairs, Rivka stops and turns, and looks up the stairwell, and for one second you think she is going to call out. Then she turns again and walks out through the courtyard into the street and on to the bus."]],"choices":[],"gotos":[[[[["flag","took_moise",false]]],"veldhiv_children_moise"],[null,"veldhiv_stadium"]],"end":false},"veldhiv_children_moise":{"chapter":null,"effects":[["set","moise_safe"]],"paragraphs":[[null,"Moïse sleeps through all of it, in the middle of your bed, on his back with his arms flung out, with his mouth open, the way only very small children sleep. When he wakes up at seven o'clock he says \"Mama?\" and then, when he sees you, \"Mil!\" and holds out his arms to be picked up."],[null,"He asks for Mama all day. He asks for Mama for a month. Then less. By the end of the year he calls Madeleine Mama, and you have to decide whether to correct him, and you don't."]],"choices":[],"gotos":[[null,"veldhiv_stadium"]],"end":false},"veldhiv_nothing":{"chapter":null,"effects":[["set","all_taken"]],"paragraphs":[[null,"They knock on the Lewins' door for a long time. Then Isaac opens it. He did not go to his cousin's in Montreuil after all. He would not leave Rivka. \"Sir, I am a legal person,\" you hear him say, \"here are my papers, I have a shop...\" \"Five minutes,\" says the sergeant. \"Clothes, blankets, food for two days.\""],[null,"Food for two days. You think of Colombes. Two days."],[null,"Then they come down the stairs. Isaac first, carrying two suitcases. Rivka with Moïse on her hip, in his sleeping suit, with his wooden horse. And Sarah, in her school pinafore with the yellow star, solidly sewn, carrying her satchel, because she did not know what else to bring, holding her mother's skirt."],[null,"Your door is open a crack. You are standing behind it. As they pass, Sarah looks at the crack and sees your eye. She does not say anything. She looks at you, and you look at her."],[null,"There are two policemen. The sergeant is in front, the constable behind, on the stairs above. For a moment, at the turn of the stairs, Sarah is half a metre from your door and nobody is looking at her."]],"choices":[[null,"Reach out and pull her inside, now.","veldhiv_grab",[]],[null,"Don't move.","veldhiv_still",[]]],"gotos":[],"end":false},"veldhiv_grab":{"chapter":null,"effects":[["stat","health","-",2],["set","sarah_safe"],["set","grabbed_sarah"]],"paragraphs":[[null,"You open the door and pull her in by the arm and shut it, and it is the quickest thing you have ever done in your life, and the loudest, and the constable on the stairs shouts."],[null,"He hammers on the door. You hold it shut. Behind you, Madeleine has picked Sarah up and is running with her, through the flat to the back window, which opens on the roof of the workshop, and out across the roof and down into the yard of the dairy behind, and you hold the door shut with your shoulder while the constable kicks it."],[null,"Then the sergeant's voice, below: \"Leave it! Leave it, Gaston, for God's sake. We have the list. We have the time. One kid. Leave it.\" A silence. Then the constable says, through the door, very quietly: \"Next time, Boche.\" And you hear his boots going down the stairs."],[null,"Afterwards you find you have dislocated your shoulder. Madeleine pushes it back into place on the kitchen table, with Lucien's instructions from a first-aid manual, and you scream into a towel."],[null,"Sarah is in the dairy's cold room for a day and a night, among the churns. When Madeleine brings her home, she asks for her mother. Madeleine doesn't know what to say."]],"choices":[],"gotos":[[null,"veldhiv_stadium"]],"end":false},"veldhiv_still":{"chapter":null,"effects":[["stat","hope","-",3]],"paragraphs":[[null,"You don't move."],[null,"She goes past. Down the stairs, holding her mother's skirt, in her pinafore with the yellow star, with her satchel. The constable's boots come after her. Then they are in the courtyard. Then they are in the street. You hear the bus doors close."],[null,"Josette has woken. She is standing in her nightdress in the doorway of her room, holding the sock rabbit, and she says, \"Papa? Where's Sarah going?\""],[null,"You don't answer her. You will never be able to answer her."]],"choices":[],"gotos":[[null,"veldhiv_stadium"]],"end":false},"veldhiv_stadium":{"chapter":"The Vélodrome d'Hiver","effects":[],"paragraphs":[[null,"Over two days the French police arrest thirteen thousand one hundred and fifty-two people in Paris. They had hoped for twenty-eight thousand, but many were warned and hid. Of those arrested, four thousand one hundred and fifteen are children."],[null,"The families with children are taken to the Vélodrome d'Hiver, the winter cycling stadium on the boulevard de Grenelle near the Eiffel Tower, where before the war there were six-day bicycle races and boxing matches and political rallies. They are kept there for five days. Eight thousand people. There is a glass roof, painted blue for the blackout, and July sun on it. There is no food
